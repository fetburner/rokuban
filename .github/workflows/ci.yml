name: CI

on:
  # 全ブランチの commit で SHA イメージを publish する。tag は release.yml が持つので除外。
  push:
    branches: ['**']
  pull_request:

jobs:
  web-test:
    runs-on: ubuntu-latest
    # vitest がハングしても既定の 6h でランナーを占有させない（go test の -timeout と同じ狙い）。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      # コンポーネント／lib のロジック回帰は CI では Vitest でしか止まらない（build は型エラーしか
      # 拾わない。web/e2e/ もロジック回帰を止めうるが、CI では回さずローカル専用）。
      # Go toolchain も postgres service も要らないので独立した job にして test job の信号と混ぜない。
      - run: pnpm test
        working-directory: web

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rokuban
          POSTGRES_PASSWORD: rokuban
          POSTGRES_DB: rokuban_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rokuban"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ROKUBAN_TEST_DATABASE_URL: postgres://rokuban:rokuban@localhost:5432/rokuban_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # web/dist/ を go:embed するため、Go ビルド前にフロントエンドをビルド
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      # DB を使うテストはパッケージごとに専用データベースを作るため（internal/testutil.SetupDB）、
      # 待ち合わせも踏み合いもなく並行実行できる。-timeout はハングを早期検知するため既定の 10m より短くする。
      # POSTGRES_USER はこのインスタンスの initdb 時に作られる初期ロールなので CREATE DATABASE 権限を持つ。
      - run: go test ./... -timeout 5m

  # 生成物（sqlc/oapi-codegen/orval）が openapi.yaml / マイグレーションからの再生成と一致するかを
  # 検証する。生成物はコミット済みなので他 job（build/test）は再生成漏れがあっても普通に緑になる。
  # ツール版は CLAUDE.md §ビルド・テストに固定した版に合わせる（版がずれると偽陽性で赤くなる）。
  generated-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      # sqlc / oapi-codegen は go.mod の依存に入れず、golangci-lint と同じくローカルバイナリ
      # 前提（CLAUDE.md）。CI では都度その版をインストールして GOPATH/bin を PATH に足す。
      - run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: sqlc generate
      # internal/api/gen.go の //go:generate directive をそのまま踏む。ここで直接
      # oapi-codegen を呼ぶと directive の増減・フラグ変更を検知できないまま緑になる。
      - run: go generate ./internal/api/
      - run: pnpm exec orval
        working-directory: web
      # 新規ファイル（クエリ追加で sqlcgen 配下のファイルが増える等）も検出するため
      # git add -A で拾ってから差分を見る。パスは絞らない —— 出力先を列挙すると
      # sqlc.yaml の out / oapi-codegen.yaml の output / orval.config.ts の target が
      # 変わったとき（orval の mode: split で生成先が増えたとき等）に、このジョブが
      # 黙って緑のまま検知力を失う。ここで拾いすぎる untracked は .gitignore 側で
      # 除外する（node_modules 等は既に無視されており、他のステップは追跡ファイルを
      # 変えない）。
      - name: 再生成漏れがあれば失敗させる
        run: |
          git add -A
          git diff --cached --exit-code \
            || { echo "::error::生成物が古い。sqlc generate / go generate ./internal/api/ / (cd web && pnpm exec orval) を実行してコミットしてください"; exit 1; }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: pnpm lint
        working-directory: web
      # トークン外の生の色値の検出（docs/frontend/design.md）。実ブラウザは
      # 要らないのでここで回す。色そのものの合否は `pnpm e2e:design`（ローカル）
      - run: pnpm check:colors
        working-directory: web
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  # 利用者向け文書（README / CLAUDE / configuration / operations / runbook）の文体を
  # textlint で検査する。深い設計文書は対象外（`npm run docs:lint:all` で手動実行できる）。
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:lint

  # deploy/k8s/ のマニフェスト検査（不変条件 8 はマニフェストにも適用する）。
  #
  # ここで見るのは「YAML として組めるか」（kustomize build）と「各オブジェクトが
  # k8s のスキーマに合うか」（kubeconform）の 2 つだけ。**オブジェクト間の参照と
  # ConfigMap の中身はどちらも見ない** --- 存在しない ConfigMap を envFrom に書いても
  # 両方緑になる（実測。deploy/k8s/manifests_test.go の冒頭コメント）。
  # そちらは go test ./deploy/k8s/（test ジョブ）が見る。
  #
  # ツールは版を固定する。runner イメージの同梱物に依存すると、イメージ更新で
  # 黙って挙動が変わる（kustomize は runner に入っているが版が動く）。
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize and kubeconform
        run: |
          curl -sSfL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin kustomize
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin kubeconform
      # **build と検証をパイプで繋がない。** `run:` の既定シェルは `bash -e` で
      # pipefail が付かないため、パイプの終了コードは kubeconform のものになる。
      # kubeconform は標準入力が空でも exit 0 を返すので、kustomize build が
      # エラーで何も出さなくてもジョブは緑になる（実測:
      # `bash -e -c 'kustomize build /nonexistent | kubeconform -strict -summary -'`
      # は「0 resource found parsing stdin」で exit 0）。
      - name: Build manifests
        run: |
          kustomize build deploy/k8s/base > /tmp/base.yaml
          kustomize build deploy/k8s/overlays/kind > /tmp/overlay-kind.yaml
          kustomize build deploy/k8s/overlays/e2e > /tmp/overlay-e2e.yaml
      # **スキーマの版も固定する。** 既定は master なので、リポジトリ側の変更ゼロで
      # 上流 k8s のリリースだけで検査内容が動く。値は docs/runbook/k8s.md で
      # 実機確認した版のマイナー（実機は v1.36.1。スキーマはマイナー単位で公開
      # されている）。上げるときは両方を同じ PR で動かす。
      # **CRD（KEDA の ScaledJob 等）はこの検査の外。** リポジトリには
      # `deploy/k8s/e2e/fixtures/` に ScaledJob があるが、そちらは kustomize の
      # 出力にも下の検査対象にも入れていない（`-strict` が未知の kind で落ちる）。
      # CRD を検査に入れるときは `-schema-location` でスキーマを渡すか
      # `-ignore-missing-schemas` を付ける決定が要る（後者は未知の kind を
      # 黙って飛ばすので、typo も一緒に飛ばす）。
      - name: Validate against the Kubernetes schema
        run: |
          kubeconform -strict -summary -kubernetes-version 1.36.0 \
            /tmp/base.yaml /tmp/overlay-kind.yaml /tmp/overlay-e2e.yaml \
            deploy/k8s/e2e/cluster/scaffold.yaml \
            deploy/k8s/e2e/fixtures/watcher.yaml deploy/k8s/e2e/fixtures/cron-epg-sync.yaml
      # ハーネスの純粋な部分（対象の探索と watch ログの読み取り）はクラスタを
      # 要らないのでここで回す。**1 巡目のレビュー修正がここにテストを持たず、
      # 「複数一致は FAIL」の経路が大域変数の代入が子シェルに閉じるせいで
      # 一度も動いていなかった**のを、実機 2 周でも変異注入でも捕まえられ
      # なかった（変異がその状態を作らなかったため）。
      - name: e2e harness lib self-test
        run: ./deploy/k8s/e2e/lib/selftest.sh
      # ハーネスは全部シェルなので、静的検査もここで掛ける（runner に同梱）。
      # SC2329（未使用の関数）を外しているのは、判定の述語を retry_until と
      # trap に間接的に渡す形が多いため。
      - name: Shellcheck the e2e harness
        run: |
          shellcheck -x -e SC1091,SC2034,SC2329 \
            deploy/k8s/e2e/run.sh deploy/k8s/e2e/oracles.sh \
            deploy/k8s/e2e/lib/*.sh deploy/k8s/e2e/checks/*.sh
      # **受け入れ判定ハーネス（deploy/k8s/e2e）そのものは CI で回さない。**
      # 回すのは人間で、タイミングと理由は docs/runbook/k8s.md
      # §受け入れ判定ハーネス に書いてある。ここで見るのは、ハーネスが持つ
      # マニフェスト（overlays/e2e / 足場 / CRD を含まない fixture）が YAML と
      # して組めてスキーマに合うことまで --- 回さないものが腐るのを、せめて
      # ここで止める。ConfigMap の中身（overlay の config.yml）は kustomize にも
      # kubeconform にも不透明なので、そちらは go test ./deploy/k8s/ が見る
      # （TestOverlayConfigsLoad）。

  # 全ブランチの push で公式イメージ（ffmpeg 非同梱）を SHA タグで ghcr へ公開する。
  # arm64 は QEMU を避けてネイティブ runner でビルドし、arch ごとに SHA サフィックス付きで
  # push、publish-manifest でまとめる。タグ付けは docker/metadata-action に委ねる。
  publish-arch:
    # pull_request（特に fork）では GITHUB_TOKEN に packages:write が無い。
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.sha }},suffix=-${{ matrix.arch }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  publish-manifest:
    if: github.event_name == 'push'
    needs: publish-arch
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # main は branch protection で検証済みの前提なので無条件に latest を付ける。
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
      # 各 arch イメージを 1 つの multi-arch manifest にまとめ、meta の全タグに付ける。
      - name: Create multi-arch manifest
        run: |
          for tag in $TAGS; do
            IMAGETOOLS_ARGS+=(-t "$tag")
          done
          docker buildx imagetools create "${IMAGETOOLS_ARGS[@]}" \
            "ghcr.io/${{ github.repository }}:${{ github.sha }}-amd64" \
            "ghcr.io/${{ github.repository }}:${{ github.sha }}-arm64"
        env:
          TAGS: ${{ steps.meta.outputs.tags }}

  # イメージをローカルビルドして起動を検査する自己完結ジョブ。publish に依存しないので
  # fork PR（GITHUB_TOKEN に packages:write が無く GHCR へ push できない）でも回る。
  # amd64 の重い層は publish-arch と gha キャッシュ（scope=amd64）を共有する。
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # migrate 用の ffmpeg 非同梱イメージ。
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rokuban:test
          cache-from: type=gha,scope=amd64
      # server --all はその上に ffmpeg を積んだ Dockerfile.full で起動する。
      - run: docker build -f Dockerfile.full --build-arg BASE=rokuban:test -t rokuban:test-full .
      # /mnt/media（storage.media_dir 既定値）と /var/tmp/rokuban
      # （storage.scratch_dir 既定値）が実行ユーザーから書けること。
      # 修正前のイメージでは media 側が Permission denied で落ちる。
      # uid も一緒に主張するのは、Dockerfile.full 末尾の `USER nobody` が
      # 将来落ちたときにこのステップが名前だけ嘘のまま pass しないため
      # （root なら書けてしまう）。scratch_dir 側はベースイメージの /var/tmp が
      # 1777 であることに依存しているだけなので、イメージを差し替えたときに
      # 黙って壊れないようここで一緒に押さえる。
      - name: Media and scratch dirs are writable as nobody
        run: |
          docker volume create rokuban-media-probe
          docker run --rm --entrypoint sh -v rokuban-media-probe:/mnt/media rokuban:test-full \
            -c 'test "$(id -u)" = 65534 && mkdir -p /mnt/media/probe/nested && touch /mnt/media/probe/nested/file && mkdir -p /var/tmp/rokuban'
      - name: Remove probe volume
        if: always()
        run: docker volume rm -f rokuban-media-probe
      - name: Smoke test
        run: |
          docker compose -f docker-compose.test.yml up --wait --wait-timeout 60
          curl -sf http://localhost:40773/healthz
      # 上の probe は touch/mkdir であって Go の os.MkdirAll / os.Create を
      # 通っていない。catalog_export は RunOnStart の定期ジョブなので、
      # 起動直後に実バイナリが nobody として media volume へ世代ディレクトリを
      # 書く。healthz はジョブが落ちても通るため、ジョブ状態を明示的に見る。
      # 修正前のイメージではここが state=retryable + permission denied になる。
      - name: catalog_export wrote to the media volume
        run: |
          for _ in $(seq 1 30); do
            state=$(docker compose -f docker-compose.test.yml exec -T postgres \
              psql -U rokuban -d rokuban -tAc \
              "SELECT state FROM river_job WHERE kind='catalog_export' ORDER BY id DESC LIMIT 1")
            case "$state" in
              completed) break ;;
            esac
            sleep 2
          done
          docker compose -f docker-compose.test.yml exec -T postgres \
            psql -U rokuban -d rokuban -c \
            "SELECT id, kind, state, attempt, errors FROM river_job WHERE kind='catalog_export'"
          test "$state" = completed
          docker compose -f docker-compose.test.yml exec -T rokuban \
            sh -c 'test -f "$(ls -d /mnt/media/catalog/catalog-*/ | tail -1)/manifest.json"'
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
