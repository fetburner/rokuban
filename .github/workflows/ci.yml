name: CI

env:
  # RustFS の公式イメージのダイジェスト。services の image は env コンテキストを読めないため、
  # このアンカーを `*rustfs_image` で参照して同じ値を使う。判定 6 の deployment.yaml も同じ値で、
  # 一致は deploy/k8s/two_stores_test.go が見る。
  # RustFS を services にし、docker run の step にしない理由: service container はジョブ終了時に
  # runner が片付けるので停止 step が要らず、job.services.rustfs.id で失敗時のログ（docker logs）を取れる。
  RUSTFS_IMAGE: &rustfs_image rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2

on:
  # PR と main への push だけを検証する。その他のブランチ push は
  # publish-sha.yml の publish ジョブだけを起動する（同じ commit の検証を二重にしない）。
  push:
    branches:
      - main
  pull_request:

jobs:
  web-test:
    runs-on: ubuntu-latest
    # vitest がハングしても既定の 6h でランナーを占有させない（go test の -timeout と同じ狙い）。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      # コンポーネント／lib のロジック回帰は CI では Vitest で止める（build は型エラーしか拾わない）。
      # Go toolchain も postgres service も要らないので独立した job にして test job の信号と混ぜない。
      - run: pnpm test
        working-directory: web
      # E2E のフィクスチャ契約だけを検証する。E2E_VALIDATE_FIXTURES_ONLY=1 で各スクリプトは
      # ブラウザを起動せず終了する。実ブラウザ判定は browser-e2e job で実行する。
      - run: pnpm e2e:fixtures
        working-directory: web

  # 要件宣言の無い判定を browser-e2e の対象にする。語彙と意味は web/e2e/README.md に置く。
  # 必須チェック名 `browser-e2e` は下の集約ジョブが担う。
  browser-e2e-shard:
    name: browser-e2e-shard (${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rokuban
          POSTGRES_PASSWORD: rokuban
          POSTGRES_DB: rokuban_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rokuban"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_URL: http://localhost:40773
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm build
        working-directory: web
      # Build after web/dist exists: this is the actual static bundle embedded in the Go binary.
      - run: go build -o /tmp/rokuban ./cmd/rokuban
      - name: Prepare CI config and apply database migrations
        run: |
          {
            printf '%s\n' 'server:' '  listen: "127.0.0.1:40773"' '  allowed_hosts: [localhost]'
            sed \
              -e 's/^  host: postgres$/  host: localhost/' \
              -e 's/^  database: rokuban$/  database: rokuban_test/' \
              -e "s#^  media_dir: /mnt/media\$#  media_dir: ${RUNNER_TEMP}/rokuban-e2e-media#" \
              config.ci.yml
          } > "${RUNNER_TEMP}/rokuban-e2e.yml"
          mkdir -p "${RUNNER_TEMP}/rokuban-e2e-media"
          /tmp/rokuban migrate up --config "${RUNNER_TEMP}/rokuban-e2e.yml"
      - name: Start API server and wait for readiness
        run: |
          server_log="${RUNNER_TEMP}/rokuban-e2e-server.log"
          /tmp/rokuban server --roles api --config "${RUNNER_TEMP}/rokuban-e2e.yml" >"${server_log}" 2>&1 &
          server_pid=$!
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error "${E2E_URL}/readyz" >/dev/null; then
              echo "Rokuban is ready at ${E2E_URL}"
              exit 0
            fi
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          echo "::error::Rokuban did not become ready at ${E2E_URL}; server log follows"
          cat "${server_log}"
          exit 1
      - name: Run browser E2E
        if: ${{ !cancelled() }}
        run: node e2e/run.mjs --shard ${{ matrix.shard }}/5
        working-directory: web
      - name: Show API server log
        if: failure()
        run: cat "${RUNNER_TEMP}/rokuban-e2e-server.log"

  # 必須チェック名 `browser-e2e` を保つ集約ジョブ。skip / cancelled / failure を緑にしない。
  browser-e2e:
    needs: browser-e2e-shard
    if: always()
    runs-on: ubuntu-slim
    steps:
      - run: test "${{ needs.browser-e2e-shard.result }}" = success

  # S3 の署名付き URL への 302 を実 Chrome で測る。`browser-e2e` と別ジョブにしている
  # のは、RustFS の固定イメージと実 Chrome（`playwright install chrome`）を用意するため。
  # 実 Safari の測定は macOS のローカルで行い、CI には載せない。
  browser-s3-302:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: conformance
          POSTGRES_PASSWORD: conformance
          POSTGRES_DB: conformance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conformance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rustfs:
        image: *rustfs_image
        env:
          RUSTFS_ACCESS_KEY: rokuban
          RUSTFS_SECRET_KEY: rokuban-test-secret
          RUSTFS_VOLUMES: /data
        ports:
          - 9000:9000
        command: /data
    env:
      ROKUBAN_TEST_DATABASE_URL: postgres://conformance:conformance@localhost:5432/conformance_test?sslmode=disable
      AWS_ACCESS_KEY_ID: rokuban
      AWS_SECRET_ACCESS_KEY: rokuban-test-secret
      AWS_REGION: us-east-1
      E2E_S3_APP_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build application streamer conformance fixture
        run: go build -tags s3conformance -o "$RUNNER_TEMP/rokuban-s3streamer-conformance" ./internal/streamer/conformance
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chrome
        working-directory: web
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Wait for RustFS
        env:
          RUSTFS_CONTAINER_ID: ${{ job.services.rustfs.id }}
        run: |
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/health >/dev/null; then
              echo "RustFS is ready at http://127.0.0.1:9000"
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$RUSTFS_CONTAINER_ID" 2>/dev/null || true)" != true ]; then
              break
            fi
            sleep 1
          done
          exit 1
      - run: node e2e/run.mjs --needs s3
        working-directory: web
        env:
          E2E_S3_URL: http://127.0.0.1:9000
          E2E_STREAMER_FIXTURE_BINARY: ${{ runner.temp }}/rokuban-s3streamer-conformance
      - name: RustFS logs on failure
        if: failure()
        env:
          RUSTFS_CONTAINER_ID: ${{ job.services.rustfs.id }}
        run: docker logs "$RUSTFS_CONTAINER_ID" || true

  # go test を複数ランナーに分ける。4 コアのランナー 1 台に全パッケージ（race 付きの合計は
  # 約 600 秒）を詰めると、CPU の取り合いで最長パッケージがそのままジョブ長になるため。
  # 分ける軸は所要時間で、ffmpeg の要否ではない。ffmpeg を見るテストは ROKUBAN_REQUIRE_FFMPEG を
  # 見ずに黙って skip するもの（internal/ffargs）があるので、全シャードに ffmpeg を入れる。
  # 振り分けは直前の main 実行の実測（go-test-timings- のキャッシュ）を見て gotestsum の ci-matrix が
  # 決める。手で名前を並べると、パッケージが増えるたびに直すことになるため。
  # 実測が無いパッケージは 0 秒と見積もられる（初回・キャッシュ切れ）。
  # 必須チェック名 `test` は下の集約ジョブが担う。
  test-matrix:
    # 全シャードの開始を待たせる。ubuntu-slim では setup-go と gotestsum のビルドで 24s → 110s に伸びた。
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # go:embed の all:dist が存在しないと go list が落ちる。パッケージ一覧だけ要るので空の置き場で足りる。
      - run: mkdir -p web/dist && touch web/dist/.keep
      - uses: actions/cache/restore@v6
        with:
          path: timings
          key: go-test-timings-${{ github.run_id }}
          restore-keys: go-test-timings-
      - id: plan
        run: |
          go list ./... > "$RUNNER_TEMP/packages.txt"
          go run gotest.tools/gotestsum@v1.13.0 tool ci-matrix --timing-files 'timings/*.json' --partitions 3 < "$RUNNER_TEMP/packages.txt" > "$RUNNER_TEMP/matrix.json"
          echo "matrix=$(cat "$RUNNER_TEMP/matrix.json")" >> "$GITHUB_OUTPUT"

  test-shard:
    name: test (${{ matrix.description }})
    needs: test-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-matrix.outputs.matrix) }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rokuban
          POSTGRES_PASSWORD: rokuban
          POSTGRES_DB: rokuban_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rokuban"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ROKUBAN_TEST_DATABASE_URL: postgres://rokuban:rokuban@localhost:5432/rokuban_test?sslmode=disable
      # 実 ffmpeg / ffprobe を回すテスト（この変数を見るもの）を
      # skip させない。ライブの音声 rendition の並びと PDT を実経路で見ているのはそれらだけ。
      ROKUBAN_REQUIRE_FFMPEG: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # ffmpeg の .deb（約 60 MB）をキャッシュする。Ubuntu ミラーからのダウンロードは通常 30 秒未満
      # だが、2026-09〜10 の 251 回中 5 回は 10 分を超えた（最長 27 分）。版はランナーイメージで
      # 変わるのでイメージ版をキーにする（ImageOS / ImageVersion はランナーの環境変数で、`env`
      # コンテキストには無い）。イメージ版が変わったら restore-keys で前のイメージの .deb を
      # 復元し、差分だけをダウンロードする。ミラーから消えた版の .deb は autoclean で落とす。
      # actions/cache は一般ユーザーで保存するので、root 所有の既定 /var/cache/apt/archives ではなく
      # $HOME 下に置き、apt（root）が書いた後に所有者を戻す。
      - id: apt-cache-key
        run: |
          echo "prefix=apt-ffmpeg-${ImageOS}-" >> "$GITHUB_OUTPUT"
          echo "key=apt-ffmpeg-${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.apt/cache
          key: ${{ steps.apt-cache-key.outputs.key }}
          restore-keys: ${{ steps.apt-cache-key.outputs.prefix }}
      - run: |
          mkdir -p ~/.apt/cache/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/.apt/cache" ffmpeg
          sudo apt-get autoclean -o Dir::Cache::Archives="$HOME/.apt/cache"
          sudo chown -R "$USER" ~/.apt/cache
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # web/dist/ を go:embed するため、Go ビルド前にフロントエンドをビルド
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      # DB を使うテストはパッケージごとに専用データベースを作るため（internal/testutil.SetupDB）、
      # 待ち合わせも踏み合いもなく並行実行できる。
      # POSTGRES_USER はこのインスタンスの initdb 時に作られる初期ロールなので CREATE DATABASE 権限を持つ。
      # 全パッケージに -race を掛ける。goroutine を持つパッケージは worker / streamer に限らず
      # 散らばっていて、並行性で選別すると漏れる（選び漏らした側の data race は通常実行では通ってしまう）。
      # -timeout は各テストバイナリごとの制限。最長パッケージ（internal/worker。race 付きで数分）の
      # 実測に対して 2 倍以上の余裕を取る。実測が 10 分の半分に近づいたら、-timeout を上げる前に
      # 実時間の待ち（WaitDelay・ポーリング・バックオフ）を疑う。
      # -p はパッケージの同時実行数。既定は GOMAXPROCS（ランナーでは 4）で、import path 順に
      # 詰めるので長いパッケージが後ろに回ると、ステップ長が「シャード内の合計 ÷ 4」で決まる。
      # 同時実行数を上げると CPU を取り合って各パッケージは遅くなるが、後ろの長いパッケージの
      # 開始が早まるので、ステップ全体は縮む。
      - name: Run go test shard
        shell: bash
        env:
          PACKAGES: ${{ matrix.packages }}
          TIMING_FILE: timing-${{ matrix.id }}.json
        run: |
          read -r -a pkgs <<< "$PACKAGES"
          go run gotest.tools/gotestsum@v1.13.0 --jsonfile "$TIMING_FILE" -- -race -p 8 -count=1 -timeout 10m "${pkgs[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: go-test-timing-${{ matrix.id }}
          path: timing-${{ matrix.id }}.json
          # 同じ run の test-timings に渡すだけ。残すのは cache 側。
          retention-days: 1

  # main の実行だけが見積もりを更新する。PR はこの保存を行わず、main のキャッシュを読むだけ。
  test-timings:
    needs: test-shard
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: go-test-timing-*
          merge-multiple: true
          path: timings
      - uses: actions/cache/save@v6
        with:
          path: timings
          key: go-test-timings-${{ github.run_id }}

  # 必須チェック名 test を保つ集約ジョブ。skip / cancelled / failure を緑にしない。
  test:
    needs: test-shard
    if: always()
    runs-on: ubuntu-slim
    steps:
      - run: test "${{ needs.test-shard.result }}" = success

  # rokuban が mirakc に期待する API 挙動を実物のコンテナに対して判定する。
  # go list のパッケージを gotestsum ci-matrix へ渡し、main の test2json 実測で 3 シャードに分ける。
  # 各病態ケースは独立したパッケージなので、長い EventIDReset / ingest resume / TestRecordLifecycle なども
  # パッケージ単位で分散できる。Postgres は ingestresume がどのシャードへ入っても使えるよう全てに置く。
  # 必須チェック名 `mirakc-conformance` は下の集約ジョブが担う。
  mirakc-conformance-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/cache/restore@v6
        with:
          path: timings
          key: mirakc-conformance-timings-${{ github.run_id }}
          restore-keys: mirakc-conformance-timings-
      - id: plan
        run: |
          go list -tags conformance ./internal/mirakc/conformance/... > "$RUNNER_TEMP/packages.txt"
          go run gotest.tools/gotestsum@v1.13.0 tool ci-matrix --timing-files 'timings/*.json' --partitions 3 < "$RUNNER_TEMP/packages.txt" > "$RUNNER_TEMP/matrix.json"
          echo "matrix=$(cat "$RUNNER_TEMP/matrix.json")" >> "$GITHUB_OUTPUT"

  mirakc-conformance-shard:
    name: mirakc-conformance (${{ matrix.description }})
    needs: mirakc-conformance-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 43
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mirakc-conformance-matrix.outputs.matrix) }}
    # harness はコンテナ名を t.Name() と PID で一意にする。シャード内のパッケージは -p 1 で直列にし、
    # mirakc コンテナ同時起動による時刻判定の揺れを避ける。並列化はランナーを分ける matrix が担う。
    # -timeout は各パッケージの test binary ごとに掛かる。named wait の積算では
    # EventIDReset が約 320s（コンテナ起動 40s + service 60s + schedule retry 120s +
    # record 45s + finished / settle 55s）、他の最大は live release 約 295s、
    # RecordLifecycle 約 288s、ingest resume 約 280s。38m はビルド・image pull・環境遅延にも
    # 十分な余裕を残す保守的な上限。docker run 中の image pull も 38m を消費する。
    # timeout-minutes 43 は setup・Postgres 起動・終了処理の 5m を加える。
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: conformance
          POSTGRES_PASSWORD: conformance
          POSTGRES_DB: conformance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conformance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ROKUBAN_CONFORMANCE_TEST_DATABASE_URL: postgres://conformance:conformance@localhost:5432/conformance_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run conformance shard
        shell: bash
        env:
          PACKAGES: ${{ matrix.packages }}
          JSONFILE: mirakc-conformance-timing-${{ matrix.id }}.json
        run: |
          read -r -a pkgs <<< "$PACKAGES"
          go run gotest.tools/gotestsum@v1.13.0 --jsonfile "$JSONFILE" -- -tags conformance -p 1 -count=1 -timeout 38m -v "${pkgs[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mirakc-conformance-timing-${{ matrix.id }}
          path: mirakc-conformance-timing-${{ matrix.id }}.json
          if-no-files-found: warn
          retention-days: 1

  mirakc-conformance-timings:
    needs: mirakc-conformance-shard
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: mirakc-conformance-timing-*
          merge-multiple: true
          path: timings
      - uses: actions/cache/save@v6
        with:
          path: timings
          key: mirakc-conformance-timings-${{ github.run_id }}

  # 必須チェック名 mirakc-conformance を保つ集約ジョブ。skip / cancelled / failure を緑にしない。
  mirakc-conformance:
    needs: mirakc-conformance-shard
    if: always()
    runs-on: ubuntu-slim
    steps:
      - run: test "${{ needs.mirakc-conformance-shard.result }}" = success

  # S3 API の互換性をダイジェスト固定した RustFS イメージで検査する。
  s3-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: conformance
          POSTGRES_PASSWORD: conformance
          POSTGRES_DB: conformance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conformance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rustfs:
        image: *rustfs_image
        env:
          RUSTFS_ACCESS_KEY: rokuban
          RUSTFS_SECRET_KEY: rokuban-rustfs-conformance
          RUSTFS_VOLUMES: /data
        ports:
          - 9000:9000
        command: /data
    env:
      ROKUBAN_S3_CONFORMANCE_ENDPOINT: http://127.0.0.1:9000
      ROKUBAN_S3_CONFORMANCE_REGION: us-east-1
      ROKUBAN_S3_CONFORMANCE_BUCKET: rokuban-conformance
      ROKUBAN_S3_CONFORMANCE_ACCESS_KEY_ID: rokuban
      ROKUBAN_S3_CONFORMANCE_SECRET_ACCESS_KEY: rokuban-rustfs-conformance
      ROKUBAN_S3_CONFORMANCE_CREATE_BUCKET: "true"
      ROKUBAN_TEST_DATABASE_URL: postgres://conformance:conformance@localhost:5432/conformance_test?sslmode=disable
      AWS_ACCESS_KEY_ID: rokuban
      AWS_SECRET_ACCESS_KEY: rokuban-rustfs-conformance
      AWS_REGION: us-east-1
      # 固定した RustFS は 6 機能すべて対応する。記録がこれと違えば退行として落とす。
      ROKUBAN_S3_CONFORMANCE_EXPECT: conditional-writes=supported,multipart-upload-and-abort=supported,multipart-abort-gone=supported,multipart-resume=supported,head-checksum-sha256=supported,presigned-get-range=supported
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Wait for RustFS
        env:
          RUSTFS_CONTAINER_ID: ${{ job.services.rustfs.id }}
        run: |
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/health >/dev/null; then
              echo "RustFS is ready at http://127.0.0.1:9000"
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$RUSTFS_CONTAINER_ID" 2>/dev/null || true)" != true ]; then
              break
            fi
            sleep 1
          done
          exit 1
      - name: Run S3 API conformance tests
        run: go test -tags s3conformance ./internal/objstore/conformance -count=1 -timeout 5m -v
      - name: Run shared object store contract and upload token tests against RustFS
        run: go test -tags s3conformance ./internal/objstore/s3store -run '^(TestStoreContract|TestPutStoresUploadToken)$' -count=1 -timeout 5m -v
      - name: Run S3 worker publication and recovery tests
        run: go test -tags s3conformance ./internal/worker -run '^TestS3DerivedObjectPublicationAndRecovery$' -count=1 -timeout 5m -v
      - name: RustFS logs on failure
        if: failure()
        env:
          RUSTFS_CONTAINER_ID: ${{ job.services.rustfs.id }}
        run: docker logs "$RUSTFS_CONTAINER_ID" || true

  # 生成物（sqlc/oapi-codegen/orval）が openapi.yaml / マイグレーションからの再生成と一致するかを
  # 検証する。生成物はコミット済みなので他 job（build/test）は再生成漏れがあっても普通に緑になる。
  # ツール版は CLAUDE.md §ビルド・テストに固定した版に合わせる（版がずれると偽陽性で赤くなる）。
  generated-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      # go:embed と実ビルド依存の棚卸しに web/dist が必要。
      - run: pnpm build
        working-directory: web
      # 公式 Go バイナリと web/dist に入る本番依存の LICENSE / NOTICE / PATENTS を
      # lockfile と実ビルド依存から再生成し、コミット済み notice との差分を検出する。
      - name: Check third-party notices
        run: npm run third-party-notices -- --check
      # sqlc / oapi-codegen は go.mod の依存に入れず、golangci-lint と同じくローカルバイナリ
      # 前提（CLAUDE.md）。CI では都度その版をインストールして GOPATH/bin を PATH に足す。
      - run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: sqlc generate
      # internal/api/gen.go の //go:generate directive をそのまま踏む。ここで直接
      # oapi-codegen を呼ぶと directive の増減・フラグ変更を検知できないまま緑になる。
      - run: go generate ./internal/api/
      - run: pnpm exec orval
        working-directory: web
      # 適用後スキーマのダンプ（internal/db/schema.sql）。マイグレーションを足して再生成し忘れると
      # 下の差分検査で落ちる。PostgreSQL はスクリプトが自分でコンテナを起動する（版の固定もそこ）。
      - run: scripts/schemadump.sh
      # 新規ファイル（クエリ追加で sqlcgen 配下のファイルが増える等）も検出するため
      # git add -A で拾ってから差分を見る。パスは絞らない —— 出力先を列挙すると
      # sqlc.yaml の out / oapi-codegen.yaml の output / orval.config.ts の target が
      # 変わったとき（orval の mode: split で生成先が増えたとき等）に、このジョブが
      # 黙って緑のまま検知力を失う。ここで拾いすぎる untracked は .gitignore 側で
      # 除外する（node_modules 等は既に無視されており、他のステップは追跡ファイルを
      # 変えない）。
      - name: 再生成漏れがあれば失敗させる
        run: |
          git add -A
          git diff --cached --exit-code \
            || { echo "::error::生成物が古い。sqlc generate / go generate ./internal/api/ / (cd web && pnpm exec orval) / scripts/schemadump.sh を実行してコミットしてください"; exit 1; }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: pnpm lint
        working-directory: web
      # トークン外の生の色値の検出（docs/frontend/design.md）。実ブラウザを要しないのでここで回す。
      - run: pnpm check:colors
        working-directory: web
      # go.mod より古い Go でビルドされた golangci-lint は起動を拒む。v2.12.2 は
      # go1.26 ビルドなので go.mod の go 1.27.1 では動かない。v2.13.2 は go1.27.0
      # ビルド（比較は major.minor なので 1.27.1 を通す）。
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  # 保守対象の Markdown 全体（README.md / CLAUDE.md / deploy/**/*.md / docs/**/*.md /
  # web/e2e/**/*.md）を textlint で検査する。プロファイルは 1 本で、違反 0 件が gate。
  docs-lint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run docs:lint
      # 許容が base より増えていないこと（scripts/check-allow-total.mjs）。PR だけ見る。
      - name: Check allow counts
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          # base 側にスクリプトがあればそれを実行する（同じ PR でスクリプトを弱めても捕まる）。
          # 無い初回だけ PR 側を使う。
          if git cat-file -e "origin/$BASE_REF:scripts/check-allow-total.mjs"; then
            git show "origin/$BASE_REF:scripts/check-allow-total.mjs" > "$RUNNER_TEMP/check-allow-total.mjs"
            node "$RUNNER_TEMP/check-allow-total.mjs" "origin/$BASE_REF"
          else
            npm run docs:allow-total -- "origin/$BASE_REF"
          fi

  # deploy/k8s/ のマニフェスト検査（不変条件 8 はマニフェストにも適用する）。
  #
  # ここで見るのは「YAML として組めるか」（kustomize build）と「各オブジェクトが
  # k8s のスキーマに合うか」（kubeconform）の 2 つだけ。**オブジェクト間の参照と
  # ConfigMap の中身はどちらも見ない** --- 存在しない ConfigMap を envFrom に書いても
  # 両方緑になる（実測。deploy/k8s/manifests_test.go の冒頭コメント）。
  # そちらは go test ./deploy/k8s/（test ジョブ）が見る。
  #
  # ツールは版を固定する。runner イメージの同梱物に依存すると、イメージ更新で
  # 黙って挙動が変わる（kustomize は runner に入っているが版が動く）。
  manifests:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - name: Install kustomize, kubeconform and shellcheck
        run: |
          curl -sSfL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin kustomize
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin kubeconform
          # **shellcheck も版を固定する**（runner にも入っているが版が動く）。
          # 実際、runner 同梱の版は「間接的にしか呼ばれない関数」を SC2329 では
          # なく **SC2317** で報告し、手元では緑のジョブが赤くなった。
          curl -sSfL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | sudo tar xJ -C /usr/local/bin --strip-components=1 shellcheck-v0.11.0/shellcheck
      # **build と検証をパイプで繋がない。** `run:` の既定シェルは `bash -e` で
      # pipefail が付かないため、パイプの終了コードは kubeconform のものになる。
      # kubeconform は標準入力が空でも exit 0 を返すので、kustomize build が
      # エラーで何も出さなくてもジョブは緑になる（実測:
      # `bash -e -c 'kustomize build /nonexistent | kubeconform -strict -summary -'`
      # は「0 resource found parsing stdin」で exit 0）。
      - name: Build manifests
        run: |
          kustomize build deploy/k8s/base > /tmp/base.yaml
          # **サイト 1 組ぶんも単体で組む。** overlay 経由でしか組まないと、
          # site/ だけが壊れているのか overlay の patch が壊れているのかを
          # 出力から切り分けられない。
          kustomize build deploy/k8s/site > /tmp/site.yaml
          kustomize build deploy/k8s/overlays/kind > /tmp/overlay-kind.yaml
          kustomize build deploy/k8s/overlays/e2e > /tmp/overlay-e2e.yaml
          # 置き場ごとの層も単体で組み、2 つの置き場を持つ overlay も組む。
          kustomize build deploy/k8s/store > /tmp/store.yaml
          kustomize build deploy/k8s/overlays/e2e-two-stores > /tmp/overlay-e2e-two-stores.yaml
      # **スキーマの版も固定する。** 既定は master なので、リポジトリ側の変更ゼロで
      # 上流 k8s のリリースだけで検査内容が動く。値は docs/runbook/k8s.md で
      # 実機確認した版のマイナー（実機は v1.36.1。スキーマはマイナー単位で公開
      # されている）。上げるときは両方を同じ PR で動かす。
      # **CRD（KEDA の ScaledJob）はリポジトリに置いたスキーマで検査する。**
      # `-ignore-missing-schemas` は採らない --- 未知の kind を黙って飛ばすので
      # `kind: ScaledJobb` のような typo も一緒に飛ばす。スキーマの出どころと、
      # `-strict` を有効にするための加工（`additionalProperties: false`）は
      # deploy/k8s/schemas/README.md。**ファイル名が小文字なのは
      # `{{.ResourceKind}}` が小文字化した名前を埋めるため**で、大文字にすると
      # macOS では通って Linux の CI だけが落ちる。
      #
      # スキーマがあるので、fixture の ScaledJob もここで検査対象に入る。
      # **足場も fixture も glob で拾う。** 名前で列挙すると、ハーネスに
      # マニフェストを 1 つ足した日にそれだけが検査から漏れる。
      - name: Validate against the Kubernetes schema
        run: |
          kubeconform -strict -summary -kubernetes-version 1.36.0 \
            -schema-location default \
            -schema-location 'deploy/k8s/schemas/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/base.yaml /tmp/site.yaml /tmp/store.yaml /tmp/overlay-kind.yaml /tmp/overlay-e2e.yaml /tmp/overlay-e2e-two-stores.yaml \
            deploy/k8s/e2e/cluster/*.yaml \
            deploy/k8s/e2e/fixtures/*.yaml
      # ハーネスの純粋な部分（対象の探索と watch ログの読み取り）はクラスタを
      # 要らないのでここで回す。**1 巡目のレビュー修正がここにテストを持たず、
      # 「複数一致は FAIL」の経路が大域変数の代入が子シェルに閉じるせいで
      # 一度も動いていなかった**のを、実機 2 周でも変異注入でも捕まえられ
      # なかった（変異がその状態を作らなかったため）。
      - name: e2e harness lib self-test
        run: ./deploy/k8s/e2e/lib/selftest.sh
      # ハーネスは全部シェルなので、静的検査もここで掛ける（版は上で固定した）。
      # SC2317 / SC2329（到達しない・使われないように見えるコード）を外して
      # いるのは、判定の述語を retry_until と trap に間接的に渡す形が多いため。
      # 番号が 2 つあるのは版によってどちらで報告されるかが違うから。
      - name: Shellcheck the e2e harness
        run: |
          shellcheck --version
          shellcheck -x -e SC1091,SC2034,SC2317,SC2329 \
            deploy/k8s/e2e/run.sh deploy/k8s/e2e/oracles.sh \
            deploy/k8s/e2e/faults/*.sh \
            deploy/k8s/e2e/lib/*.sh deploy/k8s/e2e/checks/*.sh
      # **受け入れ判定・故障注入ハーネス（deploy/k8s/e2e）そのものは CI で回さない。**
      # 回すのは人間で、タイミングと理由は docs/runbook/k8s.md
      # §受け入れ判定ハーネス に書いてある。ここで見るのは、ハーネスが持つ
      # マニフェスト（overlays/e2e / 足場 / CRD を含まない fixture）が YAML と
      # して組めてスキーマに合うことまで --- 回さないものが腐るのを、せめて
      # ここで止める。ConfigMap の中身（overlay の config.yml）は kustomize にも
      # kubeconform にも不透明なので、そちらは go test ./deploy/k8s/ が見る
      # （TestOverlayConfigsLoad）。

  # イメージをローカルビルドして起動を検査する自己完結ジョブ。publish に依存しないので
  # fork PR（GITHUB_TOKEN に packages:write が無く GHCR へ push できない）でも回る。
  # publish と同じ docker-bake.hcl で組むので、bake の定義が壊れたら main に入る前にここで落ちる。
  # gha キャッシュも bake の定義が持ち、publish-sha.yml / release.yml と共有する。
  # ただし組むのは amd64 だけで、arm64 へのクロスビルドは publish-sha.yml でしか通らない。
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # rokuban:test は migrate 用の ffmpeg 非同梱イメージ。server --all は
      # その上に ffmpeg を積んだ Dockerfile.full（rokuban:test-full）で起動する。
      - uses: docker/bake-action@v7
        with:
          source: .
          files: ./docker-bake.hcl
          targets: image,full
          load: true
          set: |
            *.platform=linux/amd64
            image.tags=rokuban:test
            full.tags=rokuban:test-full
      - name: JLSE binaries start with their runtime libraries
        run: |
          docker run --rm --entrypoint sh rokuban:test-full -eu -c '
            for tool in chapter_exe logoframe join_logo_scp; do
              test -x "/usr/local/bin/$tool"
              if ldd "/usr/local/bin/$tool" 2>&1 | grep -F "not found"; then exit 1; fi
            done
          '
      # /mnt/media（storage.media_dir 既定値）と /var/tmp/rokuban
      # （storage.scratch_dir 既定値）が実行ユーザーから書けること。
      # 修正前のイメージでは media 側が Permission denied で落ちる。
      # uid も一緒に主張するのは、Dockerfile.full 末尾の `USER nobody` が
      # 将来落ちたときにこのステップが名前だけ嘘のまま pass しないため
      # （root なら書けてしまう）。scratch_dir 側はベースイメージの /var/tmp が
      # 1777 であることに依存しているだけなので、イメージを差し替えたときに
      # 黙って壊れないようここで一緒に押さえる。
      - name: Media and scratch dirs are writable as nobody
        run: |
          docker volume create rokuban-media-probe
          docker run --rm --entrypoint sh -v rokuban-media-probe:/mnt/media rokuban:test-full \
            -c 'test "$(id -u)" = 65534 && mkdir -p /mnt/media/probe/nested && touch /mnt/media/probe/nested/file && mkdir -p /var/tmp/rokuban'
      - name: Remove probe volume
        if: always()
        run: docker volume rm -f rokuban-media-probe
      - name: Smoke test
        run: |
          docker compose -f docker-compose.test.yml up --wait --wait-timeout 60
          curl -sf http://localhost:40773/healthz
      # 上の probe は touch/mkdir であって Go の os.MkdirAll / os.Create を
      # 通っていない。catalog_export は RunOnStart の定期ジョブなので、
      # 起動直後に実バイナリが nobody として media volume へ世代ディレクトリを
      # 書く。healthz はジョブが落ちても通るため、ジョブ状態を明示的に見る。
      # 修正前のイメージではここが state=retryable + permission denied になる。
      - name: catalog_export wrote to the media volume
        run: |
          for _ in $(seq 1 30); do
            state=$(docker compose -f docker-compose.test.yml exec -T postgres \
              psql -U rokuban -d rokuban -tAc \
              "SELECT state FROM river_job WHERE kind='catalog_export' ORDER BY id DESC LIMIT 1")
            case "$state" in
              completed) break ;;
            esac
            sleep 2
          done
          docker compose -f docker-compose.test.yml exec -T postgres \
            psql -U rokuban -d rokuban -c \
            "SELECT id, kind, state, attempt, errors FROM river_job WHERE kind='catalog_export'"
          test "$state" = completed
          docker compose -f docker-compose.test.yml exec -T rokuban \
            sh -c 'test -f "$(ls -d /mnt/media/catalog/catalog-*/ | tail -1)/manifest.json"'
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
