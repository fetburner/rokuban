# PR と main の役割分担
# PR は変更が影響しうる検証に絞って結果を早く返す。その絞り込みの安全網は main への
# push ごとの全件実行だけとし、Go テストは -count=1 を維持する。
# main のコミットごとの結果を残すため、後続の push があっても cancel-in-progress で止めない。
# PR が緑で main が落ちたら、原因の PR の作者（エージェントを含む）が修正 PR を出す。revert はしない。
# 集約ジョブは、計画段階で対象が空と判定した場合だけ shard の skip を成功とする。
# allowed-skips は skip を許すだけで要求はしない（planned_skip のとき shard は job の if で必ず skip する）。
name: CI

env:
  # RustFS の公式イメージのダイジェスト。services の image は env コンテキストを読めないため、
  # このアンカーを `*rustfs_image` で参照して同じ値を使う。判定 6 の deployment.yaml も同じ値で、
  # 一致は deploy/k8s/two_stores_test.go が見る。
  # RustFS を services にし、docker run の step にしない理由: service container はジョブ終了時に
  # runner が片付けるので停止 step が要らず、job.services.rustfs.id で失敗時のログ（docker logs）を取れる。
  RUSTFS_IMAGE: &rustfs_image rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
  # s3-conformance と mysql-contract-test の対象パッケージの一覧。
  # mysql-contract-test は、plan ジョブの test 計画（citest）と step の両方がこの値を読む。
  # s3-conformance は、計画だけがこの値を読み、step は go test 行に直書きする（scripts/s3conformance が行を解析するため）。
  # 計画の一覧と step の集合の一致は scripts/s3conformance の TestS3ConformancePackagesMatchSteps が検査する。
  S3_CONFORMANCE_PACKAGES: ./internal/objstore/conformance ./internal/objstore/s3store ./internal/storagemaint ./internal/encode ./internal/thumbnail
  MYSQL_CONTRACT_PACKAGES: ./internal/mysqldb ./internal/mysqltest ./internal/store/mysqlstore ./internal/notifier/mysqlsource

on:
  # PR と main への push だけを検証する。その他のブランチ push は
  # publish-sha.yml の publish ジョブだけを起動する（同じ commit の検証を二重にしない）。
  push:
    branches:
      - main
  pull_request:

jobs:
  # 計画ジョブ。browser-e2e・test・mirakc-conformance の 3 つの計画を 1 本にまとめ、checkout・base の fetch・
  # setup-go を 1 回にする。step id と job の outputs は計画ごとに分ける。
  # 計画のどれか 1 つでも失敗すると、このジョブは失敗する。3 つの集約ジョブ（browser-e2e・test・mirakc-conformance）は
  # needs.plan.result が success でなければ赤になる。shard の skip は planned_skip で表し、集約ジョブが判定する。
  # ubuntu-slim にしない。setup-go と gotestsum のビルドで 24 秒 → 110 秒に延びた。
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      browser_e2e_matrix: ${{ steps.plan-browser-e2e.outputs.matrix }}
      browser_e2e_scripts: ${{ steps.plan-browser-e2e.outputs.scripts }}
      browser_e2e_planned_skip: ${{ steps.plan-browser-e2e.outputs.planned_skip }}
      test_matrix: ${{ steps.plan-test.outputs.matrix }}
      test_planned_skip: ${{ steps.plan-test.outputs.planned_skip }}
      run_browser_s3_302: ${{ steps.plan-test.outputs.run_browser_s3_302 }}
      run_s3_conformance: ${{ steps.plan-test.outputs.run_s3_conformance }}
      run_mysql_contract: ${{ steps.plan-test.outputs.run_mysql_contract }}
      mirakc_conformance_matrix: ${{ steps.plan-mirakc-conformance.outputs.matrix }}
      mirakc_conformance_planned_skip: ${{ steps.plan-mirakc-conformance.outputs.planned_skip }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        if: github.event_name == 'pull_request'
        with: &browser_e2e_path_filters
          filters: |
            web:
              - 'web/**'
              - '.node-version'
              # 全件にする範囲は scripts/citest の requiresAllPackages と一致させる（TestBrowserE2EPathFiltersMatchAllPackagesRule が検査）。
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            # browser-s3-302 だけが使う（web/src/ は使わず、web/dist の build も無い）。
            # 同じアンカーを読む web-test にも載るが、そちらは使わない。push では使わない。
            browser_s3_302_web:
              - 'web/e2e/**'
              - 'web/package.json'
              - 'web/pnpm-lock.yaml'
              - '.node-version'
      - name: Fetch PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      # test と mirakc-conformance の計画は常に go を実行するので、setup-go は常に実行する。
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # 追跡済みの web/dist/.gitkeep が go:embed all:dist の置き場を満たすため、go list の前にフロントエンドのビルドは要らない。
      # test と mirakc-conformance の見積もりはどちらも path: timings で復元する。同じディレクトリへ 2 本を復元すると
      # 混ざるので、test の分を timings-test へ移してから mirakc-conformance の分を復元する。
      # actions/cache はキャッシュの version を path から作るため、path を変えると main が保存した分に当たらなくなる。
      - uses: actions/cache/restore@v6
        with:
          path: timings
          key: go-test-timings-${{ github.run_id }}
          restore-keys: go-test-timings-
      - name: Move test timings aside
        run: mkdir -p timings && mv timings timings-test
      - uses: actions/cache/restore@v6
        with:
          path: timings
          key: mirakc-conformance-timings-${{ github.run_id }}
          restore-keys: mirakc-conformance-timings-
      # PR の変更と citest から browser-e2e の matrix を作る。main の全件実行は冒頭の役割分担に従う。
      - id: plan-browser-e2e
        env:
          E2E_CI_FULL: ${{ steps.changes.outputs.web == 'true' || github.event_name == 'push' }}
          E2E_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node web/e2e/run.mjs --ci-plan
      # 振り分けは直前の main 実行の実測（go-test-timings- のキャッシュ）を見て gotestsum の ci-matrix が
      # 決める。手で名前を並べると、パッケージが増えるたびに直すことになるため。
      # 実測が無いパッケージは 0 秒と見積もられる（初回・キャッシュ切れ）。
      # PR は citest で変更の影響を受けるパッケージだけを選ぶ。main は go list の全件。
      # 対象が空になるのは PR で変更がテストに影響しないときだけで、その場合は planned_skip を出して
      # shard を作らず、集約ジョブ test がそれを成功とみなす（mirakc-conformance と同じ形）。
      # PR の shard 数は選ばれたパッケージの見積もり（main の実測の合計）から決める（scripts/shardcount）。
      # 1 本の準備は run 45591817397 の実測で 40〜51 秒（job 開始から「Run go test shard」開始まで。
      # 3 本の値は 49・51・40 秒）。ここでは 50 秒を使う。本数を 1 つ増やすとこの準備分のランナー時間が増える。
      # shard 内は -p 8 で並行に回るので、実時間は合計 ÷ 約 3 になる（同じ run の shard 1: 合計 540 秒・step 184 秒、
      # shard 2: 合計 569 秒・step 178 秒。step にはビルドも入る）。そこで並行度 3 を shardcount に渡す。
      # 縮みが準備以上のときだけ 1 本増やす。結果は合計 300 秒で 2 本、900 秒で 3 本、上限 3 本。
      # 最長パッケージが実時間の下限になる点は式に入れていない。その分は本数が多い側（従来寄り）に外れる。
      # 実測の無いパッケージが 1 つでもあれば 3 本にする。重さが分からない見積もりの欠けは、ランナー時間が
      # 余る側に寄せる（今までの振り分けと同じ）。0 秒と見なして本数を減らすと、待ちが延びる側に外れる。
      # run_browser_s3_302・run_s3_conformance・run_mysql_contract は、browser-s3-302・s3-conformance・mysql-contract-test の
      # job レベルの if が読む。それらは skip されても skipped と表示されるだけでマージを止めない（必須でない）。
      # そのため計画が失敗したときに赤を出すのは、計画の失敗を受ける必須の集約ジョブの役目になる。
      - id: plan-test
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # 上の paths-filter の browser_s3_302_web。push では使わない。
          BROWSER_S3_302_WEB: ${{ steps.changes.outputs.browser_s3_302_web }}
        run: |
          changed="$RUNNER_TEMP/changed.z"
          packages_file="$RUNNER_TEMP/packages.txt"
          # 代入で受けるのは、citest などの失敗を set -e で step の失敗にするため。if の中の $(...) では失敗が握り潰される。
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            git diff --name-only -z --no-renames "$BASE_SHA" HEAD > "$changed"
            read -r -a s3_pkgs <<< "$S3_CONFORMANCE_PACKAGES"
            read -r -a mysql_pkgs <<< "$MYSQL_CONTRACT_PACKAGES"
            streamer=$(go run ./scripts/citest -base "$BASE_SHA" -tags s3conformance ./internal/streamer/conformance < "$changed")
            s3=$(go run ./scripts/citest -base "$BASE_SHA" -tags s3conformance "${s3_pkgs[@]}" < "$changed")
            mysql=$(go run ./scripts/citest -base "$BASE_SHA" "${mysql_pkgs[@]}" < "$changed")
            browser=false
            if [[ -n "$streamer" || "$BROWSER_S3_302_WEB" == true ]]; then browser=true; fi
            s3_run=false
            if [[ -n "$s3" ]]; then s3_run=true; fi
            mysql_run=false
            if [[ -n "$mysql" ]]; then mysql_run=true; fi
            go run ./scripts/citest -base "$BASE_SHA" ./... < "$changed" > "$packages_file"
          else
            browser=true
            s3_run=true
            mysql_run=true
            go list ./... > "$packages_file"
          fi
          {
            echo "run_browser_s3_302=$browser"
            echo "run_s3_conformance=$s3_run"
            echo "run_mysql_contract=$mysql_run"
          } >> "$GITHUB_OUTPUT"

          if [[ ! -s "$packages_file" ]]; then
            test "$GITHUB_EVENT_NAME" = pull_request
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'planned_skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            shards=$(go run ./scripts/shardcount --timing-files 'timings-test/*.json' --parallel 3 --setup-sec 50 < "$packages_file")
            if [[ "$shards" -eq 1 ]]; then
              # ci-matrix は 2 以上の分割しか受けないので、1 本だけは直接作る。
              matrix=$(jq -Rsc '{include: [{id: 0, packages: (split("\n") | map(select(. != "")) | join(" ")), description: "0 - all"}]}' < "$packages_file")
            else
              matrix=$(go run gotest.tools/gotestsum@v1.13.0 tool ci-matrix --timing-files 'timings-test/*.json' --partitions "$shards" < "$packages_file")
              # 少数パッケージを割り当てたときに残る空のシャードを除く。
              matrix=$(jq -ce '.include |= map(select(.packages != "")) | select(.include | length > 0)' <<< "$matrix")
            fi
          else
            matrix=$(go run gotest.tools/gotestsum@v1.13.0 tool ci-matrix --timing-files 'timings-test/*.json' --partitions 3 < "$packages_file")
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      # 冒頭の「PR と main の役割分担」に従う。PR は citest の選定結果、main は go list の全件を
      # gotestsum ci-matrix に渡し、main の test2json 実測を使って最大 3 シャードへ振り分ける。
      # PR の本数は見積もり（mirakc-conformance-shard の実測。mirakc-conformance-timings- のキャッシュ）の合計から、
      # test の計画と同じ式（実効並列度 1、準備 40 秒）で決める。
      # 実効並列度は 1 なので、合計がそのまま待ち時間になる。線は 80 秒で 2 本、240 秒で 3 本。
      - id: plan-mirakc-conformance
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          packages_file="$RUNNER_TEMP/conformance-packages.txt"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            git diff --name-only -z --no-renames "$BASE_SHA" HEAD |
              go run ./scripts/citest -base "$BASE_SHA" -tags conformance ./internal/mirakc/conformance/... > "$packages_file"
          else
            go list -tags conformance ./internal/mirakc/conformance/... > "$packages_file"
          fi
          if [[ ! -s "$packages_file" ]]; then
            test "$GITHUB_EVENT_NAME" = pull_request
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'planned_skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # PR の shard 数は test の計画と同じ式（scripts/shardcount）で決める。shard 内は -p 1 の直列なので
          # 実効並列度は 1。準備は run 45591817397 の実測で 33・33・40 秒（job 開始から「Run conformance shard」
          # 開始まで）なので 40 秒を渡す。
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            shards=$(go run ./scripts/shardcount --timing-files 'timings/*.json' --parallel 1 --setup-sec 40 < "$packages_file")
            if [[ "$shards" -eq 1 ]]; then
              # ci-matrix は 2 以上の分割しか受けないので、1 本だけは直接作る。
              matrix=$(jq -Rsc '{include: [{id: 0, packages: (split("\n") | map(select(. != "")) | join(" ")), description: "0 - all"}]}' < "$packages_file")
            else
              matrix=$(go run gotest.tools/gotestsum@v1.13.0 tool ci-matrix --timing-files 'timings/*.json' --partitions "$shards" < "$packages_file")
              # 少数パッケージを割り当てたときに残る空のシャードを除く。
              matrix=$(jq -ce '.include |= map(select(.packages != "")) | select(.include | length > 0)' <<< "$matrix")
            fi
          else
            matrix=$(go run gotest.tools/gotestsum@v1.13.0 tool ci-matrix --timing-files 'timings/*.json' --partitions 3 < "$packages_file")
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # 必須チェック名 web-test を担い、paths-filter が失敗した場合もチェックを赤にする。
  web-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    # vitest がハングしても既定の 6h でランナーを占有させない（go test の -timeout と同じ狙い）。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        if: github.event_name == 'pull_request'
        with: *browser_e2e_path_filters
      - uses: ./.github/actions/setup-web
        if: &web_test_needed ${{ github.event_name == 'push' || steps.changes.outputs.web == 'true' }}
      # コンポーネント／lib のロジック回帰は Vitest で止める。Go toolchain と PostgreSQL は要らない。
      - run: pnpm test
        if: *web_test_needed
        working-directory: web
      # E2E のフィクスチャ契約だけを検証する。E2E_VALIDATE_FIXTURES_ONLY=1 で各スクリプトは
      # ブラウザを起動せず終了する。実ブラウザ判定は browser-e2e job で実行する。
      - run: pnpm e2e:fixtures
        if: *web_test_needed
        working-directory: web

  # 計画ジョブが e2e-go-deps を citest に渡し、変更された Go 依存を宣言した判定だけを選ぶ。
  # web / Node / CI 準備の変更では全判定、main では毎回全判定を対象にする。
  # 必須チェック名 `browser-e2e` は下の集約ジョブが担う。
  browser-e2e-shard:
    name: browser-e2e-shard (${{ matrix.shard }}/${{ matrix.count }})
    needs: plan
    if: needs.plan.outputs.browser_e2e_planned_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.browser_e2e_matrix) }}
    env:
      E2E_URL: http://localhost:40773
      E2E_SCRIPTS: ${{ needs.plan.outputs.browser_e2e_scripts }}
      E2E_SHARD: ${{ matrix.shard }}/${{ matrix.count }}
    steps:
      - uses: actions/checkout@v7
      # Go を子プロセスで起動する判定（e2e-go-deps）のフィクスチャ生成用。setup-go の cache を使わない
      # 理由は test-shard の go-race-build の step と同じ（そちらのコメントを参照）。
      - uses: actions/setup-go@v7
        if: matrix.needs_go == true
        with:
          go-version-file: go.mod
          cache: false
      - id: go-e2e-dirs
        if: matrix.needs_go == true
        shell: bash
        run: |
          {
            echo "gocache=$(go env GOCACHE)"
            echo "gomodcache=$(go env GOMODCACHE)"
          } >> "$GITHUB_OUTPUT"
      # 縮める手段は build キャッシュ（モジュールと build 結果）だけにする。生成物（フィクスチャ出力）の
      # キャッシュは選ばない。キーに入力を入れ漏らすと、製品のビルダーを変えた PR が古いフィクスチャの
      # まま緑になる。生成物までキャッシュしても、build キャッシュに上乗せで縮むのはテスト本体だけになる。
      # CI のランナーで fixture の go test を段階ごとに測った値（秒）は次のとおり。
      # コンパイルは、空のキャッシュで 21〜29、復元後で 0〜3。モジュール取得は、どちらでも 0〜1。
      # テスト本体は worker が 5〜6、streamer が 11〜14（ffmpeg を含む）で、キャッシュの有無で変わらない。
      # フィクスチャは `go test -count=1` で毎回生成する。
      # キーは shard ごと（go.mod / go.sum のハッシュ付き）。別 prefix なので go-race-build とは衝突しない。
      # 部分実行では対象の判定だけを詰め直すので、shard 番号が main と合わないことがある。restore-keys の
      # 2 行目は shard を外し、別 shard の中身でもモジュールと依存のビルド結果が当たるようにする。
      # 保存は main への push で、完全一致が無かったときだけ。PR は読むだけ。
      # ponytail: 自前パッケージのビルド結果は main が進むと当たらなくなる。効きが落ちたら run ごとのキーへ移る。
      - id: go-e2e-cache
        if: matrix.needs_go == true
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.go-e2e-dirs.outputs.gocache }}
            ${{ steps.go-e2e-dirs.outputs.gomodcache }}
          key: go-e2e-build-${{ runner.os }}-${{ matrix.shard }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-e2e-build-${{ runner.os }}-${{ matrix.shard }}-
            go-e2e-build-${{ runner.os }}-
      - uses: ./.github/actions/setup-web
      # Playwright のブラウザとその依存も入れる（キャッシュのキーは install-apt-cached/action.yml）。
      - uses: ./.github/actions/install-apt-cached
        with:
          playwright-browser: chromium
      - run: pnpm build
        working-directory: web
      - name: Run browser E2E
        if: ${{ !cancelled() }}
        run: node e2e/run.mjs --scripts "$E2E_SCRIPTS" --shard "$E2E_SHARD" --preview
        working-directory: web
      # restore が完全一致しなかった main の実行だけ保存する（test-shard の Save go build cache と同じ条件）。
      # main が続けて push されると 2 本の run が同じキーを保存しうる。その save の失敗で判定を赤くしないよう continue-on-error にする。
      - name: Save go e2e build cache
        if: github.event_name == 'push' && matrix.needs_go == true && steps.go-e2e-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.go-e2e-dirs.outputs.gocache }}
            ${{ steps.go-e2e-dirs.outputs.gomodcache }}
          key: go-e2e-build-${{ runner.os }}-${{ matrix.shard }}-${{ hashFiles('go.mod', 'go.sum') }}

  # 必須チェック名 `browser-e2e` を保つ集約ジョブ。判定は alls-green（冒頭の役割分担に従う）。
  browser-e2e:
    needs: [plan, browser-e2e-shard]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: ${{ needs.plan.outputs.browser_e2e_planned_skip == 'true' && 'browser-e2e-shard' || '' }}

  # S3 の 302 と中継を実 Chrome で測る。`browser-e2e` と別ジョブにしている
  # のは、RustFS の固定イメージと実 Chrome（`playwright install chrome`）を用意するため。
  # 実 Safari の測定は macOS のローカルで行い、CI には載せない。
  browser-s3-302:
    needs: plan
    if: needs.plan.outputs.run_browser_s3_302 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: conformance
          POSTGRES_PASSWORD: conformance
          POSTGRES_DB: conformance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conformance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rustfs:
        image: *rustfs_image
        env:
          RUSTFS_ACCESS_KEY: rokuban
          RUSTFS_SECRET_KEY: rokuban-test-secret
          RUSTFS_VOLUMES: /data
        ports:
          - 9000:9000
        # 起動の待ちは health check が持つ（healthy まで job の step より前に待つ）。上限は 2 秒 × 30 回の約 60 秒。
        options: >-
          --health-cmd "curl -sf http://127.0.0.1:9000/health"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
        command: /data
    env:
      ROKUBAN_TEST_DATABASE_URL: postgres://conformance:conformance@localhost:5432/conformance_test?sslmode=disable
      AWS_ACCESS_KEY_ID: rokuban
      AWS_SECRET_ACCESS_KEY: rokuban-test-secret
      AWS_REGION: us-east-1
      E2E_S3_APP_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build application streamer conformance fixture
        run: go build -tags s3conformance -o "$RUNNER_TEMP/rokuban-s3streamer-conformance" ./internal/streamer/conformance
      - uses: ./.github/actions/setup-web
      - uses: ./.github/actions/install-apt-cached
        with:
          playwright-browser: chrome
      - name: Run S3 browser conformance (302, proxy, and encrypted proxy)
        run: node e2e/run.mjs --needs s3
        working-directory: web
        env:
          E2E_S3_URL: http://127.0.0.1:9000
          E2E_STREAMER_FIXTURE_BINARY: ${{ runner.temp }}/rokuban-s3streamer-conformance
          # s3-proxy の一時停止。main は従来値、PR は再開の経路だけを見る 0 ms（跨ぐ待ちは未特定。web/e2e/s3-proxy.mjs の PAUSE_MS を参照）
          E2E_S3_PROXY_PAUSE_MS: ${{ github.event_name == 'push' && '180000' || '0' }}
      - name: RustFS logs on failure
        if: failure()
        env:
          RUSTFS_CONTAINER_ID: ${{ job.services.rustfs.id }}
        run: docker logs "$RUSTFS_CONTAINER_ID" || true

  # go test を複数ランナーに分ける。4 コアのランナー 1 台に全パッケージ（race 付きの合計は
  # 約 600 秒）を詰めると、CPU の取り合いで最長パッケージがそのままジョブ長になるため。
  # 分ける軸は所要時間で、ffmpeg の要否ではない。ffmpeg を見るテストは ROKUBAN_REQUIRE_FFMPEG を
  # 見ずに黙って skip するもの（internal/ffargs）があるので、全シャードに ffmpeg を入れる。
  # 必須チェック名 `test` は下の集約ジョブが担う。
  test-shard:
    name: test (${{ matrix.description }})
    needs: plan
    if: needs.plan.outputs.test_planned_skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.test_matrix) }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rokuban
          POSTGRES_PASSWORD: rokuban
          POSTGRES_DB: rokuban_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rokuban"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      ROKUBAN_TEST_DATABASE_URL: postgres://rokuban:rokuban@localhost:5432/rokuban_test?sslmode=disable
      ROKUBAN_TEST_REDIS_URL: redis://localhost:6379/0
      # 実 ffmpeg / ffprobe を回すテスト（この変数を見るもの）を
      # skip させない。ライブの音声 rendition の並びと PDT を実経路で見ているのはそれらだけ。
      ROKUBAN_REQUIRE_FFMPEG: "1"
    steps:
      - uses: actions/checkout@v7
      # setup-go の cache は使わず、モジュールと build キャッシュは下の actions/cache で持つ。
      # setup-go の README: 「By default, the action looks for `go.mod` in the repository root and
      # uses its hash as part of the cache key.」 shard が復元する setup-go キャッシュは 52 MiB で、
      # hit した後も shard のログに `go: downloading` が出た。誰が保存したかは確かめていない。
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - id: go-dirs
        shell: bash
        run: |
          {
            echo "gocache=$(go env GOCACHE)"
            echo "gomodcache=$(go env GOMODCACHE)"
          } >> "$GITHUB_OUTPUT"
      # build キャッシュは古いキーの中身でも再利用してよい。`go help cache` が「correctly accounts for
      # changes to Go source files, compilers, compiler options, and so on」と書いており、中身が
      # 合わなければ使われないだけで誤った結果にはならないため。
      # キーは shard ごとに、go.mod と go.sum のハッシュで分ける。依存が変わったときだけ新しいキーになり、
      # 直前のキーの中身は restore-keys の前方一致で読む。
      # 保存は main への push で、完全一致が無かったときだけ行う（actions/cache の README:
      # 「If the provided `key` matches an existing cache, a new cache is not created」）。
      # PR は読むだけ。PR が main の cache を読めるのは actions/cache の README（Cache scopes 節）の
      # 「The default branch cache is available to other branches.」による。
      # ponytail: キーは go.mod / go.sum が変わるまで同じなので、中身は最初に保存した時点のまま残る。main が進むと、
      # 自前パッケージのビルド結果は当たらなくなっていき、確実に効くのは std・race ランタイム・依存だけになる。
      # ci-matrix の振り分けが変わると、shard 番号と中身もずれる。保存は 3 件で計 608 MiB（圧縮後）。
      # 振り分けが変わった直後の PR の実測で、テストのビルドは 38〜92 秒から 8〜24 秒に縮んだ。
      # 効きが落ちたら、run ごとのキーにして古い entry を消す形へ移る。
      - id: race-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.go-dirs.outputs.gocache }}
            ${{ steps.go-dirs.outputs.gomodcache }}
          key: go-race-build-${{ runner.os }}-${{ matrix.id }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-race-build-${{ runner.os }}-${{ matrix.id }}-
      - uses: ./.github/actions/install-apt-cached
      # API / streamer のテストは DistFS に fstest.MapFS を渡し、go:embed all:dist の置き場は追跡済みの web/dist/.gitkeep が満たす。そのためフロントエンドのビルドは要らない。
      # DB を使うテストはパッケージごとに専用データベースを作るため（internal/testutil.SetupDB）、
      # 待ち合わせも踏み合いもなく並行実行できる。
      # POSTGRES_USER はこのインスタンスの initdb 時に作られる初期ロールなので CREATE DATABASE 権限を持つ。
      # 全パッケージに -race を掛ける。goroutine を持つパッケージは worker / streamer に限らず
      # 散らばっていて、並行性で選別すると漏れる（選び漏らした側の data race は通常実行では通ってしまう）。
      # -timeout は各テストバイナリごとの制限。最長パッケージ（internal/worker。race 付きで数分）の
      # 実測に対して 2 倍以上の余裕を取る。実測が 10 分の半分に近づいたら、-timeout を上げる前に
      # 実時間の待ち（WaitDelay・ポーリング・バックオフ）を疑う。
      # -p はパッケージの同時実行数。既定は GOMAXPROCS（ランナーでは 4）で、import path 順に
      # 詰めるので長いパッケージが後ろに回ると、ステップ長が「シャード内の合計 ÷ 4」で決まる。
      # 同時実行数を上げると CPU を取り合って各パッケージは遅くなるが、後ろの長いパッケージの
      # 開始が早まるので、ステップ全体は縮む。
      - name: Run go test shard
        shell: bash
        env:
          PACKAGES: ${{ matrix.packages }}
          TIMING_FILE: timing-${{ matrix.id }}.json
        run: |
          read -r -a pkgs <<< "$PACKAGES"
          go run gotest.tools/gotestsum@v1.13.0 --jsonfile "$TIMING_FILE" -- -race -p 8 -count=1 -timeout 10m "${pkgs[@]}"
      # restore が完全一致しなかった main の実行だけ保存する。cache-hit は完全一致のときだけ 'true'
      # （actions/cache の README: 「A string value to indicate an exact match was found for the key.」）。
      # main は cancel-in-progress で止めないので、続けて push されると 2 つの run が両方 miss して
      # 同じキーを save しうる。2 本目の save の振る舞いは README に書かれていない。キャッシュ保存の
      # 失敗でテストジョブを赤くしないため continue-on-error にする。
      - name: Save go build cache
        if: github.event_name == 'push' && steps.race-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.go-dirs.outputs.gocache }}
            ${{ steps.go-dirs.outputs.gomodcache }}
          key: go-race-build-${{ runner.os }}-${{ matrix.id }}-${{ hashFiles('go.mod', 'go.sum') }}
      - uses: actions/upload-artifact@v7
        with:
          name: go-test-timing-${{ matrix.id }}
          path: timing-${{ matrix.id }}.json
          # 同じ run の test-timings に渡すだけ。残すのは cache 側。
          retention-days: 1

  mysql-contract-test:
    name: mysql contract test (${{ matrix.mysql }})
    needs: plan
    if: needs.plan.outputs.run_mysql_contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mysql: ["9.7"]
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ROKUBAN_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/
      ROKUBAN_REQUIRE_MYSQL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run MySQL store contract tests
        run: |
          read -r -a pkgs <<< "$MYSQL_CONTRACT_PACKAGES"
          go test -race -count=1 "${pkgs[@]}"

  # main の実行だけが見積もりを更新する。PR はこの保存を行わず、main のキャッシュを読むだけ。
  test-timings:
    needs: test-shard
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: go-test-timing-*
          merge-multiple: true
          path: timings
      - uses: actions/cache/save@v6
        with:
          path: timings
          key: go-test-timings-${{ github.run_id }}

  # 必須チェック名 test を保つ集約ジョブ。判定は alls-green（冒頭の役割分担に従う）。
  test:
    needs: [plan, test-shard]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: ${{ needs.plan.outputs.test_planned_skip == 'true' && 'test-shard' || '' }}

  # rokuban が mirakc に期待する API 挙動を実物のコンテナに対して判定する。
  # 各病態ケースは独立したパッケージなので、長い EventIDReset / ingest resume / TestRecordLifecycle なども
  # パッケージ単位で分散できる。Postgres は ingestresume がどのシャードへ入っても使えるよう全てに置く。
  # 必須チェック名 `mirakc-conformance` は下の集約ジョブが担う。
  mirakc-conformance-shard:
    name: mirakc-conformance (${{ matrix.description }})
    needs: plan
    if: needs.plan.outputs.mirakc_conformance_planned_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 43
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.mirakc_conformance_matrix) }}
    # harness はコンテナ名を t.Name() と PID で一意にする。シャード内のパッケージは -p 1 で直列にし、
    # mirakc コンテナ同時起動による時刻判定の揺れを避ける。並列化はランナーを分ける matrix が担う。
    # -timeout は各パッケージの test binary ごとに掛かる。named wait の積算では
    # EventIDReset が約 320s（コンテナ起動 40s + service 60s + schedule retry 120s +
    # record 45s + finished / settle 55s）、他の最大は live release 約 295s、
    # RecordLifecycle 約 288s、ingest resume 約 280s。38m はビルド・image pull・環境遅延にも
    # 十分な余裕を残す保守的な上限。docker run 中の image pull も 38m を消費する。
    # timeout-minutes 43 は setup・Postgres 起動・終了処理の 5m を加える。
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: conformance
          POSTGRES_PASSWORD: conformance
          POSTGRES_DB: conformance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conformance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ROKUBAN_CONFORMANCE_TEST_DATABASE_URL: postgres://conformance:conformance@localhost:5432/conformance_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run conformance shard
        shell: bash
        env:
          PACKAGES: ${{ matrix.packages }}
          JSONFILE: mirakc-conformance-timing-${{ matrix.id }}.json
        run: |
          read -r -a pkgs <<< "$PACKAGES"
          go run gotest.tools/gotestsum@v1.13.0 --jsonfile "$JSONFILE" -- -tags conformance -p 1 -count=1 -timeout 38m -v "${pkgs[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mirakc-conformance-timing-${{ matrix.id }}
          path: mirakc-conformance-timing-${{ matrix.id }}.json
          if-no-files-found: warn
          retention-days: 1

  mirakc-conformance-timings:
    needs: mirakc-conformance-shard
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: mirakc-conformance-timing-*
          merge-multiple: true
          path: timings
      - uses: actions/cache/save@v6
        with:
          path: timings
          key: mirakc-conformance-timings-${{ github.run_id }}

  # 必須チェック名 mirakc-conformance を保つ。判定は alls-green（冒頭の役割分担に従う）。
  mirakc-conformance:
    needs: [plan, mirakc-conformance-shard]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: ${{ needs.plan.outputs.mirakc_conformance_planned_skip == 'true' && 'mirakc-conformance-shard' || '' }}

  # S3 API の互換性をダイジェスト固定した RustFS イメージで検査する。
  s3-conformance:
    needs: plan
    if: needs.plan.outputs.run_s3_conformance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: conformance
          POSTGRES_PASSWORD: conformance
          POSTGRES_DB: conformance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conformance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rustfs:
        image: *rustfs_image
        env:
          RUSTFS_ACCESS_KEY: rokuban
          RUSTFS_SECRET_KEY: rokuban-rustfs-conformance
          RUSTFS_VOLUMES: /data
        ports:
          - 9000:9000
        # 起動の待ちは health check が持つ（healthy まで job の step より前に待つ）。上限は 2 秒 × 30 回の約 60 秒。
        options: >-
          --health-cmd "curl -sf http://127.0.0.1:9000/health"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
        command: /data
    env:
      ROKUBAN_S3_CONFORMANCE_ENDPOINT: http://127.0.0.1:9000
      ROKUBAN_S3_CONFORMANCE_REGION: us-east-1
      ROKUBAN_S3_CONFORMANCE_BUCKET: rokuban-conformance
      ROKUBAN_S3_CONFORMANCE_ACCESS_KEY_ID: rokuban
      ROKUBAN_S3_CONFORMANCE_SECRET_ACCESS_KEY: rokuban-rustfs-conformance
      ROKUBAN_S3_CONFORMANCE_CREATE_BUCKET: "true"
      ROKUBAN_TEST_DATABASE_URL: postgres://conformance:conformance@localhost:5432/conformance_test?sslmode=disable
      AWS_ACCESS_KEY_ID: rokuban
      AWS_SECRET_ACCESS_KEY: rokuban-rustfs-conformance
      AWS_REGION: us-east-1
      # 固定した RustFS は 6 機能すべて対応する。記録がこれと違えば退行として落とす。
      ROKUBAN_S3_CONFORMANCE_EXPECT: conditional-writes=supported,multipart-upload-and-abort=supported,multipart-abort-gone=supported,multipart-resume=supported,head-checksum-sha256=supported,presigned-get-range=supported
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run S3 API conformance tests
        run: go test -tags s3conformance ./internal/objstore/conformance -count=1 -timeout 5m -v
      - name: Run shared object store contract and upload token tests against RustFS
        run: go test -tags s3conformance ./internal/objstore/s3store -run '^(TestStoreContract|TestPutStoresUploadToken)$' -count=1 -timeout 5m -v
      - name: Run encrypted S3 contract and rclone compatibility tests
        run: go test -tags s3conformance ./internal/objstore/s3store -run '^(TestCryptStoreRustFSContract|TestCryptRcloneRoundTrip|TestCryptRcloneNames)$' -count=1 -timeout 5m -v
      - name: Run S3 publication and recovery tests
        run: go test -tags s3conformance ./internal/storagemaint -run '^TestS3DerivedObjectPublicationAndRecovery$' -count=1 -timeout 5m -v
      - name: Run S3 encode retry and generation test
        run: go test -tags s3conformance ./internal/encode -run '^TestS3EncodeRetryReservesNewGeneration$' -count=1 -timeout 5m -v
      - name: Run S3 thumbnail reselection test
        run: go test -tags s3conformance ./internal/thumbnail -run '^TestThumbnailReselectionReadsEncodedInputFromS3$' -count=1 -timeout 5m -v
      - name: RustFS logs on failure
        if: failure()
        env:
          RUSTFS_CONTAINER_ID: ${{ job.services.rustfs.id }}
        run: docker logs "$RUSTFS_CONTAINER_ID" || true

  # 生成物（sqlc/oapi-codegen/orval）が openapi.yaml / マイグレーションからの再生成と一致するかを
  # 検証する。生成物はコミット済みなので他 job（build/test）は再生成漏れがあっても普通に緑になる。
  # ツールの版は go.mod の tool ディレクティブが固定し、手元と CI は同じ版を使う。
  generated-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # このジョブだけが `go tool` で sqlc / oapi-codegen をビルドするため、専用のキャッシュキーにする。
      # go.sum だけのキーは他ジョブと共有され、先に保存したジョブの中身になるため、ツールのビルド結果がキャッシュに乗らない。
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            sqlc.yaml
      - uses: ./.github/actions/setup-web
      # 公式 Go バイナリと web/dist に入る本番依存の LICENSE / NOTICE / PATENTS を
      # lockfile と実ビルド依存から再生成し、コミット済み notice との差分を検出する。
      # Go の依存は go list -deps で、Web の依存は pnpm install 後の node_modules から辿るので、pnpm build は要らない。
      - name: Check third-party notices
        run: npm run third-party-notices -- --check
      - run: go tool sqlc generate
      # internal/api/gen.go の //go:generate directive をそのまま踏む。ここで直接
      # oapi-codegen を呼ぶと directive の増減・フラグ変更を検知できないまま緑になる。
      - run: go generate ./internal/api/
      - run: pnpm exec orval
        working-directory: web
      # 適用後スキーマのダンプ（internal/db/schema.sql）。マイグレーションを足して再生成し忘れると
      # 下の差分検査で落ちる。PostgreSQL はスクリプトが自分でコンテナを起動する（版の固定もそこ）。
      - run: scripts/schemadump.sh
      # 新規ファイル（クエリ追加で sqlcgen 配下のファイルが増える等）も検出するため
      # git add -A で拾ってから差分を見る。パスは絞らない —— 出力先を列挙すると
      # sqlc.yaml の out / oapi-codegen.yaml の output / orval.config.ts の target が
      # 変わったとき（orval の mode: split で生成先が増えたとき等）に、このジョブが
      # 黙って緑のまま検知力を失う。ここで拾いすぎる untracked は .gitignore 側で
      # 除外する（node_modules 等は既に無視されており、他のステップは追跡ファイルを
      # 変えない）。
      - name: 再生成漏れがあれば失敗させる
        run: |
          git add -A
          git diff --cached --exit-code \
            || { echo "::error::生成物が古い。go tool sqlc generate / go generate ./internal/api/ / (cd web && pnpm exec orval) / scripts/schemadump.sh を実行してコミットしてください"; exit 1; }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-web
      - run: pnpm lint
        working-directory: web
      # トークン外の生の色値の検出（docs/frontend/design.md）。実ブラウザを要しないのでここで回す。
      - run: pnpm check:colors
        working-directory: web
      # golangci-lint は本物の dist を読まず、go:embed の置き場は追跡済みの web/dist/.gitkeep が満たす。そのためフロントエンドのビルドは要らない。
      # go.mod より古い Go でビルドされた golangci-lint は起動を拒む。v2.12.2 は
      # go1.26 ビルドなので go.mod の go 1.27.1 では動かない。v2.13.2 は go1.27.0
      # ビルド（比較は major.minor なので 1.27.1 を通す）。
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  # 保守対象の Markdown（対象の権威は package.json の docs:lint）を textlint で検査する。プロファイルは 1 本で、違反 0 件が gate。
  # 必須チェック名 docs-lint を担うので、ジョブは毎回走らせ、入力が変わらない PR では step だけ飛ばす。
  # PR で Markdown だけが変わったときは、変わったファイルだけを検査する。ルールはファイルごとに完結し
  # （scripts/textlint-allow.js の冒頭）、ファイルをまたぐ検査は check-allow-total.mjs が担う。main への push は全件を回す。
  # filter は docs:lint の一覧を写す形にし（job 内で組むより単純）、ずれは scripts/docslintpaths/ のテストが落とす。
  docs-lint:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        if: github.event_name == 'pull_request'
        with:
          list-files: json
          # md_lint は md と同じ一覧を added|modified に限ったもの（削除されたファイルを除く）。
          # md は削除を含むので、Check allow counts の gate に使う。ずれは scripts/docslintpaths のテストが落とす。
          filters: |
            md: &md_patterns
              - 'README.md'
              - 'CLAUDE.md'
              - 'deploy/**/*.md'
              - 'docs/**/*.md'
              - 'web/e2e/**/*.md'
            md_lint:
              - added|modified: *md_patterns
            config:
              - '.textlintrc.json'
              - 'scripts/textlint-rules/**'
              - 'scripts/textlint-*.js'
              - 'scripts/*.allow.json'
              - 'scripts/check-allow-total.mjs'
              - 'package.json'
              - 'package-lock.json'
              - '.node-version'
              - '.github/**'
      - uses: actions/setup-node@v7
        if: &docs_lint_needed ${{ github.event_name == 'push' || steps.changes.outputs.md == 'true' || steps.changes.outputs.config == 'true' }}
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        if: *docs_lint_needed
      - run: npm run docs:lint
        if: ${{ github.event_name == 'push' || steps.changes.outputs.config == 'true' }}
      # 変わった Markdown だけを検査する。一覧は added|modified のフィルタが作るので、削除・改名で消えたファイルは入らない。
      # 一覧が空のとき（削除だけの PR）は step ごと飛ばす。ファイル名は env で渡す（run: に埋め込むと、ファイル名によるスクリプト注入になる）。
      - name: Lint changed Markdown only
        if: ${{ github.event_name == 'pull_request' && steps.changes.outputs.md_lint == 'true' && steps.changes.outputs.config != 'true' }}
        env:
          MD_FILES: ${{ steps.changes.outputs.md_lint_files }}
        run: |
          # プロセス置換の中の jq の失敗は -e で止まらない。textlint はファイルを渡さないと help を出して exit 0 になる（手元で実測）ので、代入で受けて step に伝える。
          list=$(jq -r '.[]' <<< "$MD_FILES")
          mapfile -t files <<< "$list"
          npm run docs:lint:files -- "${files[@]}"
      # 許容が base より増えていないこと（scripts/check-allow-total.mjs）。PR だけ見る。
      - name: Check allow counts
        if: ${{ github.event_name == 'pull_request' && (steps.changes.outputs.md == 'true' || steps.changes.outputs.config == 'true') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          # base 側にスクリプトがあればそれを実行する（同じ PR でスクリプトを弱めても捕まる）。
          # 無い初回だけ PR 側を使う。
          if git cat-file -e "origin/$BASE_REF:scripts/check-allow-total.mjs"; then
            git show "origin/$BASE_REF:scripts/check-allow-total.mjs" > "$RUNNER_TEMP/check-allow-total.mjs"
            node "$RUNNER_TEMP/check-allow-total.mjs" "origin/$BASE_REF"
          else
            npm run docs:allow-total -- "origin/$BASE_REF"
          fi

  # deploy/k8s/ のマニフェスト検査（不変条件 8 はマニフェストにも適用する）。
  #
  # ここで見るのは「YAML として組めるか」（kustomize build）と「各オブジェクトが
  # k8s のスキーマに合うか」（kubeconform）の 2 つだけ。**オブジェクト間の参照と
  # ConfigMap の中身はどちらも見ない** --- 存在しない ConfigMap を envFrom に書いても
  # 両方緑になる（実測。deploy/k8s/manifests_test.go の冒頭コメント）。
  # そちらは go test ./deploy/k8s/（test ジョブ）が見る。
  #
  # ツールは版を固定する。runner イメージの同梱物に依存すると、イメージ更新で
  # 黙って挙動が変わる（kustomize は runner に入っているが版が動く）。
  manifests:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - name: Install kustomize, kubeconform and shellcheck
        run: |
          curl -sSfL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin kustomize
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin kubeconform
          # **shellcheck も版を固定する**（runner にも入っているが版が動く）。
          # 実際、runner 同梱の版は「間接的にしか呼ばれない関数」を SC2329 では
          # なく **SC2317** で報告し、手元では緑のジョブが赤くなった。
          curl -sSfL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | sudo tar xJ -C /usr/local/bin --strip-components=1 shellcheck-v0.11.0/shellcheck
      # **build と検証をパイプで繋がない。** `run:` の既定シェルは `bash -e` で
      # pipefail が付かないため、パイプの終了コードは kubeconform のものになる。
      # kubeconform は標準入力が空でも exit 0 を返すので、kustomize build が
      # エラーで何も出さなくてもジョブは緑になる（実測:
      # `bash -e -c 'kustomize build /nonexistent | kubeconform -strict -summary -'`
      # は「0 resource found parsing stdin」で exit 0）。
      - name: Build manifests
        run: |
          kustomize build deploy/k8s/base > /tmp/base.yaml
          # **サイト 1 組ぶんも単体で組む。** overlay 経由でしか組まないと、
          # site/ だけが壊れているのか overlay の patch が壊れているのかを
          # 出力から切り分けられない。
          kustomize build deploy/k8s/site > /tmp/site.yaml
          kustomize build deploy/k8s/overlays/kind > /tmp/overlay-kind.yaml
          kustomize build deploy/k8s/overlays/e2e > /tmp/overlay-e2e.yaml
          # asynq 構成（ジョブエンジンを Redis にする）の 2 overlay。River 側と同じく組んでスキーマに掛ける。
          kustomize build deploy/k8s/overlays/asynq > /tmp/overlay-asynq.yaml
          kustomize build deploy/k8s/overlays/e2e-asynq > /tmp/overlay-e2e-asynq.yaml
          # 置き場ごとの層も単体で組み、2 つの置き場を持つ overlay も組む。
          kustomize build deploy/k8s/store > /tmp/store.yaml
          kustomize build deploy/k8s/overlays/e2e-two-stores > /tmp/overlay-e2e-two-stores.yaml
      # **スキーマの版も固定する。** 既定は master なので、リポジトリ側の変更ゼロで
      # 上流 k8s のリリースだけで検査内容が動く。値は docs/runbook/k8s.md で
      # 実機確認した版のマイナー（実機は v1.36.1。スキーマはマイナー単位で公開
      # されている）。上げるときは両方を同じ PR で動かす。
      # **CRD（KEDA の ScaledJob）はリポジトリに置いたスキーマで検査する。**
      # `-ignore-missing-schemas` は採らない --- 未知の kind を黙って飛ばすので
      # `kind: ScaledJobb` のような typo も一緒に飛ばす。スキーマの出どころと、
      # `-strict` を有効にするための加工（`additionalProperties: false`）は
      # deploy/k8s/schemas/README.md。**ファイル名が小文字なのは
      # `{{.ResourceKind}}` が小文字化した名前を埋めるため**で、大文字にすると
      # macOS では通って Linux の CI だけが落ちる。
      #
      # スキーマがあるので、fixture の ScaledJob もここで検査対象に入る。
      # **足場も fixture も glob で拾う。** 名前で列挙すると、ハーネスに
      # マニフェストを 1 つ足した日にそれだけが検査から漏れる。
      - name: Validate against the Kubernetes schema
        run: |
          kubeconform -strict -summary -kubernetes-version 1.36.0 \
            -schema-location default \
            -schema-location 'deploy/k8s/schemas/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/base.yaml /tmp/site.yaml /tmp/store.yaml /tmp/overlay-kind.yaml /tmp/overlay-e2e.yaml /tmp/overlay-e2e-two-stores.yaml /tmp/overlay-asynq.yaml /tmp/overlay-e2e-asynq.yaml \
            deploy/k8s/e2e/cluster/*.yaml \
            deploy/k8s/e2e/fixtures/*.yaml
      # ハーネスの純粋な部分（対象の探索と watch ログの読み取り）はクラスタを
      # 要らないのでここで回す。**1 巡目のレビュー修正がここにテストを持たず、
      # 「複数一致は FAIL」の経路が大域変数の代入が子シェルに閉じるせいで
      # 一度も動いていなかった**のを、実機 2 周でも変異注入でも捕まえられ
      # なかった（変異がその状態を作らなかったため）。
      - name: e2e harness lib self-test
        run: ./deploy/k8s/e2e/lib/selftest.sh
      # ハーネスは全部シェルなので、静的検査もここで掛ける（版は上で固定した）。
      # SC2317 / SC2329（到達しない・使われないように見えるコード）を外して
      # いるのは、判定の述語を retry_until と trap に間接的に渡す形が多いため。
      # 番号が 2 つあるのは版によってどちらで報告されるかが違うから。
      - name: Shellcheck the e2e harness
        run: |
          shellcheck --version
          shellcheck -x -e SC1091,SC2034,SC2317,SC2329 \
            deploy/k8s/e2e/run.sh deploy/k8s/e2e/oracles.sh \
            deploy/k8s/e2e/faults/*.sh \
            deploy/k8s/e2e/lib/*.sh deploy/k8s/e2e/checks/*.sh
      # **受け入れ判定・故障注入ハーネス（deploy/k8s/e2e）そのものは CI で回さない。**
      # 回すのは人間で、タイミングと理由は docs/runbook/k8s.md
      # §受け入れ判定ハーネス に書いてある。ここで見るのは、ハーネスが持つ
      # マニフェスト（overlays/e2e / 足場 / CRD を含まない fixture）が YAML と
      # して組めてスキーマに合うことまで --- 回さないものが腐るのを、せめて
      # ここで止める。ConfigMap の中身（overlay の config.yml）は kustomize にも
      # kubeconform にも不透明なので、そちらは go test ./deploy/k8s/ が見る
      # （TestOverlayConfigsLoad）。

  # イメージをローカルビルドして起動を検査する自己完結ジョブ。publish に依存しないので
  # fork PR（GITHUB_TOKEN に packages:write が無く GHCR へ push できない）でも回る。
  # publish と同じ docker-bake.hcl で組むので、bake の定義が壊れたら main に入る前にここで落ちる。
  # gha キャッシュも bake の定義が持ち、publish-sha.yml / release.yml と共有する。
  # ただし組むのは amd64 だけで、arm64 へのクロスビルドは publish-sha.yml でしか通らない。
  # PR では gha への書き出しを止める。書いたキャッシュは上限を超えると最終アクセスの古い順に追い出され、
  # main の buildkit キャッシュや go-test-timings- まで消えるため。読み取りは残すので、PR は main のキャッシュを読む。
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # rokuban:test は migrate 用の ffmpeg 非同梱イメージ。server --all は
      # その上に ffmpeg を積んだ Dockerfile.full（rokuban:test-full）で起動する。
      - uses: docker/bake-action@v7
        with:
          source: .
          files: ./docker-bake.hcl
          targets: image,full
          load: true
          set: |
            *.platform=linux/amd64
            image.tags=rokuban:test
            full.tags=rokuban:test-full
        env:
          GHA_CACHE_WRITE: ${{ github.event_name != 'pull_request' }}
      - name: JLSE binaries start with their runtime libraries
        run: |
          docker run --rm --entrypoint sh rokuban:test-full -eu -c '
            for tool in chapter_exe logoframe join_logo_scp; do
              test -x "/usr/local/bin/$tool"
              if ldd "/usr/local/bin/$tool" 2>&1 | grep -F "not found"; then exit 1; fi
            done
          '
      # /mnt/media（storage.media_dir 既定値）と /var/tmp/rokuban
      # （storage.scratch_dir 既定値）が実行ユーザーから書けること。
      # 修正前のイメージでは media 側が Permission denied で落ちる。
      # uid も一緒に主張するのは、Dockerfile.full 末尾の `USER nobody` が
      # 将来落ちたときにこのステップが名前だけ嘘のまま pass しないため
      # （root なら書けてしまう）。scratch_dir 側はベースイメージの /var/tmp が
      # 1777 であることに依存しているだけなので、イメージを差し替えたときに
      # 黙って壊れないようここで一緒に押さえる。
      - name: Media and scratch dirs are writable as nobody
        run: |
          docker volume create rokuban-media-probe
          docker run --rm --entrypoint sh -v rokuban-media-probe:/mnt/media rokuban:test-full \
            -c 'test "$(id -u)" = 65534 && mkdir -p /mnt/media/probe/nested && touch /mnt/media/probe/nested/file && mkdir -p /var/tmp/rokuban'
      - name: Remove probe volume
        if: always()
        run: docker volume rm -f rokuban-media-probe
      - name: Start containers
        run: docker compose -f docker-compose.test.yml up --wait --wait-timeout 60
      - name: Check health
        run: curl -sf http://localhost:40773/healthz
      - name: Check SPA assets and fallback
        run: node web/scripts/check-spa-served.mjs http://localhost:40773
      # 上の probe は touch/mkdir であって Go の os.MkdirAll / os.Create を
      # 通っていない。catalog_export は RunOnStart の定期ジョブなので、
      # 起動直後に実バイナリが nobody として media volume へ世代ディレクトリを
      # 書く。healthz はジョブが落ちても通るため、ジョブ状態を明示的に見る。
      # 修正前のイメージではここが state=retryable + permission denied になる。
      - name: catalog_export wrote to the media volume
        run: |
          for _ in $(seq 1 30); do
            state=$(docker compose -f docker-compose.test.yml exec -T postgres \
              psql -U rokuban -d rokuban -tAc \
              "SELECT state FROM river_job WHERE kind='catalog_export' ORDER BY id DESC LIMIT 1")
            case "$state" in
              completed) break ;;
            esac
            sleep 2
          done
          docker compose -f docker-compose.test.yml exec -T postgres \
            psql -U rokuban -d rokuban -c \
            "SELECT id, kind, state, attempt, errors FROM river_job WHERE kind='catalog_export'"
          test "$state" = completed
          docker compose -f docker-compose.test.yml exec -T rokuban \
            sh -c 'test -f "$(ls -d /mnt/media/catalog/catalog-*/ | tail -1)/manifest.json"'
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
