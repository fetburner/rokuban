name: CI

on:
  # 全ブランチの commit で SHA イメージを publish する。tag は release.yml が持つので除外。
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rokuban
          POSTGRES_PASSWORD: rokuban
          POSTGRES_DB: rokuban_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rokuban"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ROKUBAN_TEST_DATABASE_URL: postgres://rokuban:rokuban@localhost:5432/rokuban_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # web/dist/ を go:embed するため、Go ビルド前にフロントエンドをビルド
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      # DB を使うテストはパッケージごとに専用データベースを作るため（internal/testutil.SetupDB）、
      # 待ち合わせも踏み合いもなく並行実行できる。-timeout はハングを早期検知するため既定の 10m より短くする。
      # POSTGRES_USER はこのインスタンスの initdb 時に作られる初期ロールなので CREATE DATABASE 権限を持つ。
      - run: go test ./... -timeout 5m

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: pnpm lint
        working-directory: web
      # トークン外の生の色値の検出（docs/frontend/design.md）。実ブラウザは
      # 要らないのでここで回す。色そのものの合否は `pnpm e2e:design`（ローカル）
      - run: pnpm check:colors
        working-directory: web
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  # 全ブランチの push で公式イメージ（ffmpeg 非同梱）を SHA タグで ghcr へ公開する。
  # arm64 は QEMU を避けてネイティブ runner でビルドし、arch ごとに SHA サフィックス付きで
  # push、publish-manifest でまとめる。タグ付けは docker/metadata-action に委ねる。
  publish-arch:
    # pull_request（特に fork）では GITHUB_TOKEN に packages:write が無い。
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.sha }},suffix=-${{ matrix.arch }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  publish-manifest:
    if: github.event_name == 'push'
    needs: publish-arch
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # main は branch protection で検証済みの前提なので無条件に latest を付ける。
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
      # 各 arch イメージを 1 つの multi-arch manifest にまとめ、meta の全タグに付ける。
      - name: Create multi-arch manifest
        run: |
          for tag in $TAGS; do
            IMAGETOOLS_ARGS+=(-t "$tag")
          done
          docker buildx imagetools create "${IMAGETOOLS_ARGS[@]}" \
            "ghcr.io/${{ github.repository }}:${{ github.sha }}-amd64" \
            "ghcr.io/${{ github.repository }}:${{ github.sha }}-arm64"
        env:
          TAGS: ${{ steps.meta.outputs.tags }}

  docker:
    needs: publish-manifest
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 公開した SHA タグそのものを検査する。migrate は ffmpeg 非同梱イメージ、
      # server --all はその上に ffmpeg を積んだ Dockerfile.full で起動する。
      - name: Prepare smoke-test images
        run: |
          docker pull "ghcr.io/${{ github.repository }}:${{ github.sha }}"
          docker tag "ghcr.io/${{ github.repository }}:${{ github.sha }}" rokuban:test
          docker build -f Dockerfile.full \
            --build-arg "BASE=ghcr.io/${{ github.repository }}:${{ github.sha }}" \
            -t rokuban:test-full .
      - name: Smoke test
        run: |
          docker compose -f docker-compose.test.yml up --wait --wait-timeout 60
          curl -sf http://localhost:40773/healthz
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
