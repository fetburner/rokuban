name: CI

on:
  # 全ブランチの commit で SHA イメージを publish する。tag は release.yml が持つので除外。
  push:
    branches: ['**']
  pull_request:

jobs:
  web-test:
    runs-on: ubuntu-latest
    # vitest がハングしても既定の 6h でランナーを占有させない（go test の -timeout と同じ狙い）。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      # コンポーネント／lib のロジック回帰は CI では Vitest でしか止まらない（build は型エラーしか
      # 拾わない。web/e2e/ もロジック回帰を止めうるが、CI では回さずローカル専用）。
      # Go toolchain も postgres service も要らないので独立した job にして test job の信号と混ぜない。
      - run: pnpm test
        working-directory: web

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rokuban
          POSTGRES_PASSWORD: rokuban
          POSTGRES_DB: rokuban_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rokuban"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ROKUBAN_TEST_DATABASE_URL: postgres://rokuban:rokuban@localhost:5432/rokuban_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # web/dist/ を go:embed するため、Go ビルド前にフロントエンドをビルド
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      # DB を使うテストはパッケージごとに専用データベースを作るため（internal/testutil.SetupDB）、
      # 待ち合わせも踏み合いもなく並行実行できる。-timeout はハングを早期検知するため既定の 10m より短くする。
      # POSTGRES_USER はこのインスタンスの initdb 時に作られる初期ロールなので CREATE DATABASE 権限を持つ。
      - run: go test ./... -timeout 5m

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: pnpm lint
        working-directory: web
      # トークン外の生の色値の検出（docs/frontend/design.md）。実ブラウザは
      # 要らないのでここで回す。色そのものの合否は `pnpm e2e:design`（ローカル）
      - run: pnpm check:colors
        working-directory: web
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  # 利用者向け文書（README / CLAUDE / configuration / operations / runbook）の文体を
  # textlint で検査する。深い設計文書は対象外（`npm run docs:lint:all` で手動実行できる）。
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:lint

  # 全ブランチの push で公式イメージ（ffmpeg 非同梱）を SHA タグで ghcr へ公開する。
  # arm64 は QEMU を避けてネイティブ runner でビルドし、arch ごとに SHA サフィックス付きで
  # push、publish-manifest でまとめる。タグ付けは docker/metadata-action に委ねる。
  publish-arch:
    # pull_request（特に fork）では GITHUB_TOKEN に packages:write が無い。
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.sha }},suffix=-${{ matrix.arch }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  publish-manifest:
    if: github.event_name == 'push'
    needs: publish-arch
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # main は branch protection で検証済みの前提なので無条件に latest を付ける。
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
      # 各 arch イメージを 1 つの multi-arch manifest にまとめ、meta の全タグに付ける。
      - name: Create multi-arch manifest
        run: |
          for tag in $TAGS; do
            IMAGETOOLS_ARGS+=(-t "$tag")
          done
          docker buildx imagetools create "${IMAGETOOLS_ARGS[@]}" \
            "ghcr.io/${{ github.repository }}:${{ github.sha }}-amd64" \
            "ghcr.io/${{ github.repository }}:${{ github.sha }}-arm64"
        env:
          TAGS: ${{ steps.meta.outputs.tags }}

  # イメージをローカルビルドして起動を検査する自己完結ジョブ。publish に依存しないので
  # fork PR（GITHUB_TOKEN に packages:write が無く GHCR へ push できない）でも回る。
  # amd64 の重い層は publish-arch と gha キャッシュ（scope=amd64）を共有する。
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # migrate 用の ffmpeg 非同梱イメージ。
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rokuban:test
          cache-from: type=gha,scope=amd64
      # server --all はその上に ffmpeg を積んだ Dockerfile.full で起動する。
      - run: docker build -f Dockerfile.full --build-arg BASE=rokuban:test -t rokuban:test-full .
      # /mnt/media（storage.media_dir 既定値）と /var/tmp/rokuban
      # （storage.scratch_dir 既定値）が実行ユーザーから書けること。
      # 修正前のイメージでは media 側が Permission denied で落ちる。
      # uid も一緒に主張するのは、Dockerfile.full 末尾の `USER nobody` が
      # 将来落ちたときにこのステップが名前だけ嘘のまま pass しないため
      # （root なら書けてしまう）。scratch_dir 側はベースイメージの /var/tmp が
      # 1777 であることに依存しているだけなので、イメージを差し替えたときに
      # 黙って壊れないようここで一緒に押さえる。
      - name: Media and scratch dirs are writable as nobody
        run: |
          docker volume create rokuban-media-probe
          docker run --rm --entrypoint sh -v rokuban-media-probe:/mnt/media rokuban:test-full \
            -c 'test "$(id -u)" = 65534 && mkdir -p /mnt/media/probe/nested && touch /mnt/media/probe/nested/file && mkdir -p /var/tmp/rokuban'
      - name: Remove probe volume
        if: always()
        run: docker volume rm -f rokuban-media-probe
      - name: Smoke test
        run: |
          docker compose -f docker-compose.test.yml up --wait --wait-timeout 60
          curl -sf http://localhost:40773/healthz
      # 上の probe は touch/mkdir であって Go の os.MkdirAll / os.Create を
      # 通っていない。catalog_export は RunOnStart の定期ジョブなので、
      # 起動直後に実バイナリが nobody として media volume へ世代ディレクトリを
      # 書く。healthz はジョブが落ちても通るため、ジョブ状態を明示的に見る。
      # 修正前のイメージではここが state=retryable + permission denied になる。
      - name: catalog_export wrote to the media volume
        run: |
          for _ in $(seq 1 30); do
            state=$(docker compose -f docker-compose.test.yml exec -T postgres \
              psql -U rokuban -d rokuban -tAc \
              "SELECT state FROM river_job WHERE kind='catalog_export' ORDER BY id DESC LIMIT 1")
            case "$state" in
              completed) break ;;
            esac
            sleep 2
          done
          docker compose -f docker-compose.test.yml exec -T postgres \
            psql -U rokuban -d rokuban -c \
            "SELECT id, kind, state, attempt, errors FROM river_job WHERE kind='catalog_export'"
          test "$state" = completed
          docker compose -f docker-compose.test.yml exec -T rokuban \
            sh -c 'test -f "$(ls -d /mnt/media/catalog/catalog-*/ | tail -1)/manifest.json"'
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
