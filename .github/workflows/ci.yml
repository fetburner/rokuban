name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rokuban
          POSTGRES_PASSWORD: rokuban
          POSTGRES_DB: rokuban_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rokuban"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ROKUBAN_TEST_DATABASE_URL: postgres://rokuban:rokuban@localhost:5432/rokuban_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # web/dist/ を go:embed するため、Go ビルド前にフロントエンドをビルド
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      # -p 1: DB テストが同一 postgres に対してマイグレーションを実行するためパッケージ直列化
      - run: go test -p 1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: pnpm lint
        working-directory: web
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rokuban:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # compose で postgres + rokuban を起動し、healthcheck が通ることを確認
      - name: Smoke test
        run: |
          docker compose -f docker-compose.test.yml up --wait --wait-timeout 60
          curl -sf http://localhost:40773/healthz
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
