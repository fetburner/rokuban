name: Publish SHA image

on:
  # 全ブランチの commit で公式イメージ（ffmpeg 非同梱）を SHA タグで ghcr へ公開する。
  # tag は release.yml が持つので、この workflow では対象にしない。
  push:
    branches: ['**']

jobs:
  # arm64 は QEMU を避けてネイティブ runner でビルドし、arch ごとに SHA サフィックス付きで
  # push、publish-manifest でまとめる。タグ付けは docker/metadata-action に委ねる。
  publish-arch:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.sha }},suffix=-${{ matrix.arch }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  publish-manifest:
    needs: publish-arch
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # main は branch protection で検証済みの前提なので無条件に latest を付ける。
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
      # 各 arch イメージを 1 つの multi-arch manifest にまとめ、meta の全タグに付ける。
      - name: Create multi-arch manifest
        run: |
          for tag in $TAGS; do
            IMAGETOOLS_ARGS+=(-t "$tag")
          done
          docker buildx imagetools create "${IMAGETOOLS_ARGS[@]}" \
            "ghcr.io/${{ github.repository }}:${{ github.sha }}-amd64" \
            "ghcr.io/${{ github.repository }}:${{ github.sha }}-arm64"
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
