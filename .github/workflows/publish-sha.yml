name: Publish SHA image

on:
  # 全ブランチの commit で公式イメージ（ffmpeg 非同梱）を SHA タグで ghcr へ公開する。
  # tag は release.yml が持つので、この workflow では対象にしない。
  push:
    branches: ['**']

jobs:
  # amd64 runner 1 台で両 arch を組む。Dockerfile / Dockerfile.full の重いステージは
  # $BUILDPLATFORM で動く（Go と JLSE はクロスコンパイル）ので、QEMU で動くのは
  # 最終ステージの apt-get だけ。定義は docker-bake.hcl、タグは docker/metadata-action。
  publish:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # main は branch protection で検証済みの前提なので無条件に latest を付ける。
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
      # ffmpeg 入りイメージはメンテナの自宅クラスタ用の private パッケージ
      # （docs/overview.md §イメージ戦略と配布物）。公開配布物ではないので main だけ push し、
      # ブランチごとの SHA で private の容量を食わない。push できるのは、パッケージの
      # 「Manage Actions access」でこのリポジトリに Write を付けてあるため。
      # source ラベルはパッケージを紐付けたリポジトリに合わせる（既定はこのリポジトリになる）。
      - uses: docker/metadata-action@v6
        id: meta-full
        with:
          images: ghcr.io/${{ github.repository_owner }}/rokuban-full
          bake-target: docker-metadata-full
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/homelab-infra
      - uses: docker/bake-action@v7
        with:
          source: .
          files: |
            ./docker-bake.hcl
            ${{ steps.meta.outputs.bake-file }}
            ${{ steps.meta-full.outputs.bake-file }}
          targets: ${{ github.ref_name == github.event.repository.default_branch && 'image,full' || 'image' }}
          push: true
          vars: VERSION=${{ github.sha }}
          set: |
            image.cache-from=type=gha,scope=image
            image.cache-to=type=gha,mode=max,scope=image
            full.cache-from=type=gha,scope=full
            full.cache-to=type=gha,mode=max,scope=full
