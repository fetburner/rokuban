name: Publish SHA image

on:
  # 全ブランチの commit で公式イメージ（ffmpeg 非同梱）を SHA タグで ghcr へ公開する。
  # tag は release.yml が持つので、この workflow では対象にしない。
  push:
    branches: ['**']

jobs:
  # Go と Node のステージは Dockerfile の --platform=$BUILDPLATFORM でホスト上で走り、
  # Go は GOARCH で arm64 へクロスコンパイルする。QEMU を通るのは最終ステージの
  # apt-get と mkdir だけ。タグ付けは docker/metadata-action に委ねる。
  publish:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # main は branch protection で検証済みの前提なので無条件に latest を付ける。
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=multi
          cache-to: type=gha,mode=max,scope=multi

  # 実験: push したマルチアーキテクチャのイメージを各アーキテクチャのネイティブ
  # runner で pull し、ci.yml の docker ジョブと同じスモークテストを回す。
  smoke:
    needs: publish
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            elf_machine: "3e00"
          - arch: arm64
            runner: ubuntu-24.04-arm
            elf_machine: "b700"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and tag
        run: |
          docker pull "ghcr.io/${{ github.repository }}:${{ github.sha }}"
          docker tag "ghcr.io/${{ github.repository }}:${{ github.sha }}" rokuban:test
      # manifest がこの runner のアーキテクチャを返し、中のバイナリもそのアーキテクチャで
      # あること。ELF の e_machine（offset 18, 2 byte LE）を見る。
      - name: Image and binary are ${{ matrix.arch }}
        run: |
          test "$(docker image inspect --format '{{.Architecture}}' rokuban:test)" = "${{ matrix.arch }}"
          got=$(docker run --rm --entrypoint od rokuban:test -An -tx1 -j18 -N2 /usr/local/bin/rokuban | tr -d ' \n')
          echo "e_machine=$got"
          test "$got" = "${{ matrix.elf_machine }}"
      - run: docker run --rm rokuban:test --help
      - run: docker build -f Dockerfile.full --build-arg BASE=rokuban:test -t rokuban:test-full .
      - name: Smoke test
        run: |
          docker compose -f docker-compose.test.yml up --wait --wait-timeout 60
          curl -sf http://localhost:40773/healthz
      - name: catalog_export wrote to the media volume
        run: |
          for _ in $(seq 1 30); do
            state=$(docker compose -f docker-compose.test.yml exec -T postgres \
              psql -U rokuban -d rokuban -tAc \
              "SELECT state FROM river_job WHERE kind='catalog_export' ORDER BY id DESC LIMIT 1")
            case "$state" in
              completed) break ;;
            esac
            sleep 2
          done
          test "$state" = completed
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
