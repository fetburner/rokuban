name: Weekly mirakc conformance

on:
  # 可動タグの drift を週 1 回検知する。PR の検証とは別系統で、失敗しても PR をブロックしない。
  schedule:
    - cron: '17 0 * * 1'
  workflow_dispatch:
    inputs:
      mirakc_image:
        description: mirakc image to test
        required: false
        type: string

permissions:
  contents: read

jobs:
  mirakc-conformance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: conformance
          POSTGRES_PASSWORD: conformance
          POSTGRES_DB: conformance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conformance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ROKUBAN_CONFORMANCE_MIRAKC_IMAGE: ${{ github.event.inputs.mirakc_image || 'docker.io/mirakc/mirakc:main-debian' }}
      ROKUBAN_CONFORMANCE_TEST_DATABASE_URL: postgres://conformance:conformance@localhost:5432/conformance_test?sslmode=disable
    # `go test` はパッケージごとに test binary を作り、-p 1 で直列実行する。
    # -timeout は各 binary に掛かる。named wait の積算は EventIDReset 約 320s、
    # live release 約 295s、RecordLifecycle 約 288s、ingest resume 約 280s。
    # 4 病態パッケージと他の conformance package を直列に回すので、ジョブ全体の時間は
    # それぞれの積算時間の合計になる。PR をブロックする ci.yml と同じ -timeout 38m を保つ。
    timeout-minutes: 43
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Pull mirakc image and print digest
        run: |
          docker pull "$ROKUBAN_CONFORMANCE_MIRAKC_IMAGE"
          docker inspect --format '{{index .RepoDigests 0}}' "$ROKUBAN_CONFORMANCE_MIRAKC_IMAGE"
      - run: go test -tags conformance -p 1 ./internal/mirakc/conformance/... -timeout 38m -v
