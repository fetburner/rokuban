version: 2

updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: monthly
    # sqlc と oapi-codegen は go.mod の依存ではなく、generated-diff ジョブで
    # バージョンを pin したローカルバイナリとして管理しているため対象外。
    groups:
      # river はジョブ実行そのものを担うので、minor でも観測できる挙動が変わる
      # （0.44.0 で「shutdown 中に ctx を切られたジョブを error として数えない」
      # に変わり、drain のテストと k8s.md の実測値が同時に古くなった）。
      # 他の bump と束ねると、テストと docs を直すまでグループ PR 全体が止まる。
      # exclude ではなく専用グループにするのは、riverqueue が 5 つのモジュール
      # パスに分かれており、束ねないとモジュールごとに別 PR が来て版がずれる
      # ため。**minor-patch より前に置くこと** --- dependabot は最初に一致した
      # グループに入れるので、パターンを持たない minor-patch が先だと全部
      # そちらに吸われる。
      river:
        patterns:
          - "github.com/riverqueue/*"
        update-types:
          - minor
          - patch
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: monthly
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # go.mod の go ディレクティブと Dockerfile の FROM golang: は同じ PR で
      # 更新するため、自動更新しない。gomod ecosystem は go ディレクティブを
      # 触らないので、ここを自動で上げるとテストを通したコンパイラと出荷
      # バイナリのコンパイラがずれる。
      - dependency-name: golang
      # Dockerfile の FROM node: だけを上げる PR は .node-version と食い違うので
      # 単体ではマージできない（両者を同じ PR で揃える規約。CLAUDE.md）。
      # npm ecosystem 側に置いていた ignore は node が /web の依存ではないので
      # 効かず、実際に Dockerfile 単独の bump PR が来た。
      - dependency-name: node
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
