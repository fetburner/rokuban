version: 2

updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: monthly
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: monthly
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # go.mod の go ディレクティブと Dockerfile の FROM golang: は同じ PR で
      # 更新するため、自動更新しない。gomod ecosystem は go ディレクティブを
      # 触らないので、ここを自動で上げるとテストを通したコンパイラと出荷
      # バイナリのコンパイラがずれる。
      - dependency-name: golang
      # Dockerfile の FROM node: だけを上げる PR は .node-version と食い違い、
      # `scripts/versioncheck` の検査で落ちるので単体ではマージできない（両者を同じ PR で揃える）。
      # npm ecosystem 側に置いていた ignore は node が /web の依存ではないので
      # 効かず、実際に Dockerfile 単独の bump PR が来た。
      - dependency-name: node
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
