version: 2

updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: monthly
    # sqlc と oapi-codegen は go.mod の依存ではなく、generated-diff ジョブで
    # バージョンを pin したローカルバイナリとして管理しているため対象外。
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: monthly
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # Dockerfile の FROM node: だけを上げる PR は .node-version と食い違うので
      # 単体ではマージできない（両者を同じ PR で揃える規約。CLAUDE.md）。
      # npm ecosystem 側に置いていた ignore は node が /web の依存ではないので
      # 効かず、実際に Dockerfile 単独の bump PR が来た。
      - dependency-name: node
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
