# 判定 6 の派生物の置き場（S3 互換）。**製品のマニフェストではない**（overlays/e2e-two-stores 限り）。
#
# 派生物は S3 か FS のどちらでもよい。ここは S3 の経路（objstore の s3store）を判定するために
# RustFS の公式イメージを使う。イメージは CI（.github/workflows/ci.yml の RUSTFS_IMAGE）と同じダイジェストで固定し、
# 一致は deploy/k8s/two_stores_test.go が見る。kind には load せず、kind node が registry から pull する
# （172b0b24 で load をやめた。理由は commit に書かれておらず未確認。kind load はダイジェスト固定の ref と組み合わせて未検証）。
#
# RustFS の data と log は read-only root filesystem の外に出す。両方 emptyDir にして、
# Pod の fsGroup と合わせる。資格情報は製品用 rokuban-secrets の AWS_* を RUSTFS_* に渡す。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  labels:
    app.kubernetes.io/name: rokuban-e2e
    app.kubernetes.io/component: rustfs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rokuban-e2e
      app.kubernetes.io/component: rustfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rokuban-e2e
        app.kubernetes.io/component: rustfs
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
          imagePullPolicy: IfNotPresent
          args: ["/data"]
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rokuban-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rokuban-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_OBS_LOG_DIRECTORY
              value: /logs
            - name: HOME
              value: /tmp
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health
              port: s3
            periodSeconds: 2
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
