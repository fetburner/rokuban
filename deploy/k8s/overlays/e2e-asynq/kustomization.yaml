            metadata:
              url: "http://rokuban-notifier.rokuban-e2e.svc.cluster.local:40773/internal/queues/ingest_sitea/deliverable-count"
              valueLocation: value
              targetValue: "1"
  - target:
      kind: ScaledJob
      name: rokuban-worker-epg-sitea
    patch: |-
      - op: replace
        path: /spec/triggers
        value:
