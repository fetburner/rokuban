      name: rokuban-worker-reconciler-sitea
    patch: |-
      - op: replace
        path: /spec/triggers
        value:
          - type: metrics-api
            metadata:
              url: "http://rokuban-notifier.rokuban-e2e.svc.cluster.local:40773/internal/queues/reconciler_sitea/deliverable-count"
              valueLocation: value
              targetValue: "1"
  - target:
      kind: ScaledJob
      name: rokuban-worker-record-sweep-sitea
    patch: |-
      - op: replace
