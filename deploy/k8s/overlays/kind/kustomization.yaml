apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# kind での動作確認用（手順は docs/runbook/k8s.md）。
#
# **base の `images:` を実際に使う唯一の利用者。** ここを使わずに
# `kustomize build base | sed 's|ghcr.io/...|...|'` で済ませると、overlay から
# image を差し替えられるという決定が一度も通らないまま残る。
#
# `:latest` 以外のタグにしているのは、`latest` だと imagePullPolicy の既定が
# Always になり、`kind load` で入れたローカルイメージではなく ghcr の公式
# イメージを引いてしまうため。
#
# **単一サイト構成の site ワークロードは patch を 1 つも書かない。** `../../site`
# は site 名 `default`（base/config.yml の `mirakcs:` 1 要素目と同じ名前）で
# 書いてあるので、そのまま噛み合う。**置き場も同じ** --- `../../store` は置き場名 `main`
# （base/config.yml の `storage.stores` の唯一の要素）で書いてあるので patch が要らない。
# Ingress のライブ経路と置き場の経路だけは、共通 Ingress に具体的な Service を追加する
# ためここで patch する。

resources:
  - ../../base
  - ../../site
  - ../../store

images:
  - name: ghcr.io/fetburner/rokuban
    newName: rokuban
    newTag: kind-test
  # ffmpeg / JLSE 入り（`Dockerfile.full`）。**同じイメージに寄せない** --- 寄せると
  # 「追加ツールを要る役だけ別イメージ」という決定が overlay 側で消える。
  # ビルド手順は docs/runbook/k8s.md。
  - name: ghcr.io/fetburner/rokuban-full
    newName: rokuban-full
    newTag: kind-test

# 使い捨てのパスワード。base は Secret を出荷しないので、ここが唯一の供給元。
# 実運用の overlay ではここに平文を書かない（`envs:` + .gitignore / SOPS /
# sealed-secrets / External Secrets Operator）。
#
# generator なので名前にハッシュが付く。値を変えれば apply でそのまま rollout が
# 起きる（外で `kubectl create secret` する形だと名前が変わらないので起きない）。
#
# **`POSTGRES_CONNECTION_STRING` は KEDA の operator が読む**（Job の Pod では
# ない）ので、ホスト名はクラスタ内 FQDN で書く。名前空間は overlay で決まる
# ので、素の apply（`kubectl` の現在の context の名前空間）に合わせてある ---
# 別の名前空間に入れるならここも直す。
secretGenerator:
  - name: rokuban-secrets
    literals:
      - POSTGRES_PASSWORD=kindtest
      - POSTGRES_CONNECTION_STRING=postgresql://rokuban:kindtest@postgres.default.svc.cluster.local:5432/rokuban?sslmode=disable

patches:
  # `/api/sites/<site>/networks` は site 名を具体化しないと標準 Ingress で backend を
  # 一意に決められない。単一サイト overlay の Service 名は suffix 無しの
  # `rokuban-live-streamer` である。`/api/media/stores/<置き場>` も同じで、
  # 単一置き場 overlay の Service 名は suffix 無しの `rokuban-recording-hls`。
  - target:
      kind: Ingress
      name: rokuban-ingress
    patch: |-
      - op: add
        path: /spec/rules/0/http/paths/-
        value:
          path: /api/sites/default/networks
          pathType: Prefix
          backend:
            service:
              name: rokuban-live-streamer
              port:
                name: http
      - op: add
        path: /spec/rules/0/http/paths/-
        value:
          path: /api/media/stores/main
          pathType: Prefix
          backend:
            service:
              name: rokuban-recording-hls
              port:
                name: http
  # central streamer は派生物（`storage.derived` = `main`、FS）を配るので、その置き場を
  # マウントする。base は置き場を持たない（`--stores=`）。argv の index 5 が `--stores`。
  - target:
      kind: Deployment
      name: rokuban-streamer
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/5
        value: --stores=main
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: media
          mountPath: /mnt/media
          readOnly: true
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: media
          persistentVolumeClaim:
            claimName: rokuban-media
