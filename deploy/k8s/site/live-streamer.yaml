# site ごとのライブ視聴 streamer。
#
# 生 TS は mirakc の隣で読み、HLS になった後だけ Ingress の外へ出す。Service は
# site overlay が nameSuffix で固有名にし、Ingress の `/api/sites/<site>/networks`
# Prefix からこの site の Pod へ送る。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rokuban-live-streamer
  labels:
    app.kubernetes.io/name: rokuban
    app.kubernetes.io/component: streamer
    rokuban.fetburner.net/streamer-scope: site
    rokuban.fetburner.net/site-scoped: "true"
spec:
  # 既定は 1。増やす場合は前段で (site, networkId, serviceId) の consistent
  # hash を設定する（docs/operations/k8s-streamer.md §5）。cookie affinity は使わない。
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rokuban
      app.kubernetes.io/component: streamer
      rokuban.fetburner.net/streamer-scope: site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rokuban
        app.kubernetes.io/component: streamer
        rokuban.fetburner.net/streamer-scope: site
        rokuban.fetburner.net/site-scoped: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "40773"
        prometheus.io/path: /metrics
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        # PVC には Docker の named volume の copy-up が無い。media を読む
        # streamer も fsGroup で uid/gid 65534 の所有権を確実に受ける。
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: live-streamer
          image: ghcr.io/fetburner/rokuban-full:latest
          # **argv の 5 番目（index 4）が site 名。** site overlay の patch は
          # watcher と同じ位置を差し替える。
          args: ["server", "--roles", "streamer", "--sites", "default", "--config", "/etc/rokuban/config.yml"]
          ports:
            - name: http
              containerPort: 40773
          envFrom:
            - secretRef:
                name: rokuban-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          volumeMounts:
            - name: config
              mountPath: /etc/rokuban
              readOnly: true
            - name: media
              mountPath: /mnt/media
              readOnly: true
            # live.segment_dir は録画バッファと共有しない Pod 内 tmpfs。
            - name: live-segments
              mountPath: /dev/shm/rokuban-live
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              # request には普段は空の tmpfs を含めない。4 セッション × 実測 FFmpeg peak
              # 173Mi + アプリ 128Mi = 820Mi を 1Gi に丸める。
              memory: 1Gi
            limits:
              # live.max_sessions は 4。FFmpeg 1 本ぶんに 512Mi（実測 peak 173Mi の約 3 倍）を
              # 取り、tmpfs の 1Gi を足す: 1Gi + 4*512Mi = 3Gi。余りは Rokuban 本体と
              # コーデックによるぶれも吸収する。tmpfs のページはこの container の limit に算入される。
              # FFmpeg の peak: 参照クラスタ（K3s v1.36.2+k3s1）、Debian FFmpeg 7.1.5。
              # 合成 1440x1080i MPEG-TS を 720p libx264 veryfast、AAC 3 rendition、
              # 2 秒 HLS に変換し、/proc/<pid>/status の VmHWM を 100ms 間隔で採取:
              # 176596KiB（173MiB）。参考（数値には使っていない）: 実放送の地上波
              # 1440x1080i TS 150 秒を macOS の FFmpeg 9.0.2 で変換した最大 RSS は
              # 271MiB で、512Mi の枠に収まる。
              memory: 3Gi
      volumes:
        - name: config
          configMap:
            name: rokuban-config
        - name: media
          persistentVolumeClaim:
            claimName: rokuban-media
        - name: live-segments
          emptyDir:
            medium: Memory
            # ノードの RAM は約 4Gi。scratch は 1Gi で頭打ちにする。満杯になると
            # ENOSPC で書き込みが止まり（Pod は evict されない）、満杯で止まる値として
            # 置いている。ライブ・追っかけ・原本 VOD で共有する。
            # 16Mi の超過 probe は 16Mi 書いた後に ENOSPC になり、Pod は Running のまま
            # だった（観察時間は記録していない）。
            # 実測 2.2 Mbit/s（実放送 1440x1080i の NHK、同梱 h264 profile、CRF 未指定
            # なので bitrate は絵柄で変わる）では、1Gi は 1 セッションで約 64 分、
            # 4 セッションなら各約 16 分。
            # 根拠: docs/operations/k8s-streamer.md。
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rokuban-live-streamer
  labels:
    app.kubernetes.io/name: rokuban
    app.kubernetes.io/component: streamer
    rokuban.fetburner.net/streamer-scope: site
    rokuban.fetburner.net/site-scoped: "true"
spec:
  type: ClusterIP
  # sticky / sessionAffinity は書かない。ライブの URL がサービス同定子を持つため
  # 前段の consistent hash に任せ、cookie affinity には依存しない。
  selector:
    app.kubernetes.io/name: rokuban
    app.kubernetes.io/component: streamer
    rokuban.fetburner.net/streamer-scope: site
  ports:
    - name: http
      port: 40773
      targetPort: http
