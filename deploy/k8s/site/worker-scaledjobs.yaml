---
# `watcher` キュー（record_sweep）。**watcher ロールとは別物である** ---
# 論理キュー名が `watcher` なだけで、これを引くのは worker ロールの Job である
# （`internal/worker` の recordSweepQueue）。同じ名前の Deployment（watcher ロール）
# は `site/watcher.yaml` にあり、そちらは常駐して mirakc の SSE を張る。
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: rokuban-worker-record-sweep
  labels:
    app.kubernetes.io/name: rokuban
    app.kubernetes.io/component: worker
    rokuban.fetburner.net/queue: watcher
    rokuban.fetburner.net/site-scoped: "true"
spec:
  pollingInterval: 30
  maxReplicaCount: 2
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  scalingStrategy:
    strategy: accurate
  rollout:
    strategy: gradual
  jobTargetRef:
    backoffLimit: 0
    template:
      metadata:
        labels:
          app.kubernetes.io/name: rokuban
          app.kubernetes.io/component: worker
      spec:
        restartPolicy: Never
        enableServiceLinks: false
        automountServiceAccountToken: false
        terminationGracePeriodSeconds: 30
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: worker
            image: ghcr.io/fetburner/rokuban:latest
            args:
              - server
              - --roles
              - worker
              - --once
              - --queues
              - watcher
              - --sites
              - default
              - --soft-stop-timeout
              - 5s
              - --config
              - /etc/rokuban/config.yml
            env:
              - name: POSTGRES_CONNECTION_STRING
                valueFrom:
                  secretKeyRef:
                    name: rokuban-secrets
                    key: POSTGRES_CONNECTION_STRING
            envFrom:
              - secretRef:
                  name: rokuban-secrets
            volumeMounts:
              - name: config
                mountPath: /etc/rokuban
                readOnly: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
        volumes:
          - name: config
            configMap:
              name: rokuban-config
  triggers:
    - type: postgresql
      metadata:
        query: >-
          SELECT count(*) FROM river_job WHERE queue = 'watcher_default' AND state IN ('available','retryable')
        targetQueryValue: "1"
        connectionFromEnv: POSTGRES_CONNECTION_STRING
