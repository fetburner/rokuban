  #
  # **`ruler` キューは site 修飾されない**（`RulerPassArgs.Site` はクエリの
  # 絞り込みで、キュー名には出ない。docs/operations.md §5 のキュー表）。
  # つまり投入はサイトごとだが、消化するのは中央の ScaledJob 1 本である
  # （`deploy/k8s/base/worker-scaledjobs.yaml`）。
  schedule: "*/10 * * * *"
  startingDeadlineSeconds: 300
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rokuban
            app.kubernetes.io/component: enqueue
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: enqueue
              image: ghcr.io/fetburner/rokuban:latest
              args: ["enqueue", "ruler-pass", "--site", "default", "--config", "/etc/rokuban/config.yml"]
              envFrom:
