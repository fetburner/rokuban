              volumeMounts:
                - name: config
                  mountPath: /etc/rokuban
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  memory: 128Mi
          volumes:
            - name: config
              configMap:
                name: rokuban-config
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rokuban-enqueue-reconcile-pass
  labels:
    app.kubernetes.io/name: rokuban
    app.kubernetes.io/component: enqueue
    rokuban.fetburner.net/site-scoped: "true"
spec:
  # **in-process の既定は 30 秒だが、CronJob の分解能は 1 分である。**
  # ここだけ「実運用の間隔 = 毎分」になるので、`overlays/e2e` の毎分 patch と
  # 見分けが付かない。**判定 2 が測る CronJob は epg-sync のほうである**
  # （`deploy/k8s/workloads_test.go` の TestCronSchedulesAreProductionValues が
  # 見ているのもそちら）。
  #
  # レベルトリガー設計なので、投入が遅れても取りこぼしは次のパスが拾う
  # （docs/recording.md）。30 秒との差は「予約が mirakc に届くまでの遅延の上限」に
  # だけ効く。
  schedule: "* * * * *"
  # 毎分なので、取りこぼしを次の分まで引きずらない短い幅にする。
  startingDeadlineSeconds: 45
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rokuban
            app.kubernetes.io/component: enqueue
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: enqueue
              image: ghcr.io/fetburner/rokuban:latest
              args: ["enqueue", "reconcile-pass", "--site", "default", "--config", "/etc/rokuban/config.yml"]
              envFrom:
                - secretRef:
                    name: rokuban-secrets
              volumeMounts:
                - name: config
                  mountPath: /etc/rokuban
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  memory: 128Mi
          volumes:
            - name: config
              configMap:
                name: rokuban-config
---
