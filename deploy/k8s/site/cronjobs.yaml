# site 束縛の定期投入（`rokuban enqueue <ジョブ名> --site <site>`）。サイト 1 つぶん。
#
# 共通の規律（argv を平たく書く理由 / `enqueue` の冪等性 / base に実運用の
# schedule を書く理由）は `deploy/k8s/base/cronjobs.yaml` の冒頭にまとめてある。
#
# **argv の 4 番目（index 3）が site 名**で、5 本とも同じ位置に揃えてある
# （`site/kustomization.yaml` のコメント）。
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rokuban-enqueue-epg-sync
  labels:
    app.kubernetes.io/name: rokuban
    app.kubernetes.io/component: enqueue
    rokuban.fetburner.net/site-scoped: "true"
spec:
  # in-process の既定は 10 分（internal/worker の defaultEpgSyncInterval）。
  schedule: "*/10 * * * *"
  startingDeadlineSeconds: 300
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rokuban
            app.kubernetes.io/component: enqueue
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: enqueue
              image: ghcr.io/fetburner/rokuban:latest
              args: ["enqueue", "epg-sync", "--site", "default", "--config", "/etc/rokuban/config.yml"]
              envFrom:
                - secretRef:
                    name: rokuban-secrets
              volumeMounts:
                - name: config
                  mountPath: /etc/rokuban
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  memory: 128Mi
          volumes:
            - name: config
              configMap:
                name: rokuban-config
---
