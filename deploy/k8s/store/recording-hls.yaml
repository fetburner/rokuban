# 置き場 1 つぶんの配信 streamer（世代付き録画 HLS と原本の file / frame）。
#
# **1 プロセスは 1 つの置き場だけを配る。** 録画 HLS は複数の置き場をマウントした
# プロセスを起動時に拒む（cmd/rokuban/server.go）ので、置き場を増やすと
# この Deployment と Service が 1 組増える。Ingress は
# `/api/media/stores/<置き場>` の Prefix で置き場ごとの Service へ送る
# （`overlays/*` が行を足す）。原本の `file` / `frame` も同じ Prefix の下にあるので
# 同じ Pod が答える。派生物（thumbnail / seek-tiles / encoded）は置き場を
# 持たない `/api/media/recordings` で、central streamer が答える。
#
# **argv の 6 番目（index 5）が置き場名。** 置き場 overlay の patch が差し替える。
#
# 世代付き録画 HLS を配信する専用 streamer。
# 録画ごとの変換状態とセグメントキャッシュはプロセス内にあるため replicas は 1。
# 増やすときは録画 id で consistent hash する Ingress/controller が必要になる。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rokuban-recording-hls
  labels:
    app.kubernetes.io/name: rokuban
    app.kubernetes.io/component: recording-hls
    rokuban.fetburner.net/store-scoped: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rokuban
      app.kubernetes.io/component: recording-hls
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rokuban
        app.kubernetes.io/component: recording-hls
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "40773"
        prometheus.io/path: /metrics
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: recording-hls
          image: ghcr.io/fetburner/rokuban-full:latest
          args: ["server", "--roles", "streamer", "--sites=", "--stores", "main", "--config", "/etc/rokuban/config.yml"]
          ports:
            - name: http
              containerPort: 40773
          envFrom:
            - secretRef:
                name: rokuban-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          volumeMounts:
            - name: config
              mountPath: /etc/rokuban
              readOnly: true
            - name: media
              mountPath: /mnt/media
              readOnly: true
            - name: recording-hls-scratch
              mountPath: /dev/shm
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 3584Mi
      volumes:
        - name: config
          configMap:
            name: rokuban-config
        - name: media
          persistentVolumeClaim:
            claimName: rokuban-media
        - name: recording-hls-scratch
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rokuban-recording-hls
  labels:
    app.kubernetes.io/name: rokuban
    app.kubernetes.io/component: recording-hls
    rokuban.fetburner.net/store-scoped: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rokuban
    app.kubernetes.io/component: recording-hls
  ports:
    - name: http
      port: 40773
      targetPort: http
