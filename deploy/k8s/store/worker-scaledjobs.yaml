# 置き場束縛キューの worker（KEDA ScaledJob）。置き場 1 つぶん。
#
# **置き場で修飾するキューは `deploy/k8s/base` に置かない。** 物理キュー名は
# `<論理名>_<置き場>`（`internal/jobs` の `PhysicalStoreQueueName`）で、worker は
# その置き場の PVC を**置き場の root に**マウントしなければならない。置き場を
# 増やすことは「`storage.stores` に 1 要素足して、この 1 組をもう 1 つ生やす」
# ことである（`deploy/k8s/store/kustomization.yaml`）。
#
# **argv の 9 番目（index 8）が置き場名**で、7 本とも同じ位置に揃えてある。
# `--once` は物理キューをちょうど 1 本しか取れないので、1 本の ScaledJob は
# 論理キュー 1 つ × 置き場 1 つになる。トリガも `<論理名>_<置き場>` を数える。
#
# 共通の規律（`--once` / `backoffLimit: 0` / `rollout.strategy: gradual` /
# トリガが数える状態 / 接続先を FQDN にする理由）は
# `deploy/k8s/base/worker-scaledjobs.yaml` の冒頭にまとめてある。
---
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: rokuban-worker-ts-scan
  labels:
    app.kubernetes.io/name: rokuban
    app.kubernetes.io/component: worker
    rokuban.fetburner.net/queue: ts_scan
    rokuban.fetburner.net/store-scoped: "true"
spec:
  pollingInterval: 30
  # TS scan reads each original from start to finish. Keep concurrent archive reads bounded.
  maxReplicaCount: 1
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  scalingStrategy:
    strategy: accurate
  rollout:
    strategy: gradual
  jobTargetRef:
    backoffLimit: 0
    template:
      metadata:
        labels:
          app.kubernetes.io/name: rokuban
          app.kubernetes.io/component: worker
      spec:
        restartPolicy: Never
        enableServiceLinks: false
        automountServiceAccountToken: false
        terminationGracePeriodSeconds: 30
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: worker
            image: ghcr.io/fetburner/rokuban:latest
            args:
              - server
              - --roles
              - worker
              - --once
              - --queues
              - ts_scan
              - --sites=
              - --stores
              - main
              - --soft-stop-timeout
              - 5s
              - --config
              - /etc/rokuban/config.yml
            env:
              - name: POSTGRES_CONNECTION_STRING
                valueFrom:
                  secretKeyRef:
                    name: rokuban-secrets
                    key: POSTGRES_CONNECTION_STRING
            envFrom:
              - secretRef:
                  name: rokuban-secrets
            volumeMounts:
              - name: config
                mountPath: /etc/rokuban
                readOnly: true
              - name: media
                mountPath: /mnt/media
                readOnly: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
        volumes:
          - name: config
            configMap:
              name: rokuban-config
          - name: media
            persistentVolumeClaim:
              claimName: rokuban-media
  triggers:
    - type: postgresql
      metadata:
        query: >-
          SELECT count(*) FROM river_job WHERE queue = 'ts_scan_main' AND state IN ('available','retryable')
        targetQueryValue: "1"
        connectionFromEnv: POSTGRES_CONNECTION_STRING
---
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: rokuban-worker-encode
  labels:
    app.kubernetes.io/name: rokuban
    app.kubernetes.io/component: worker
    rokuban.fetburner.net/queue: encode
    rokuban.fetburner.net/store-scoped: "true"
spec:
  pollingInterval: 30
  # **`encode` キューには 2 種類のジョブが載る。** 実エンコード（`encode`）と
  # `encode_reconcile`（全件のバックストップと録画単位の即時パス）である
  # （internal/jobs の各 InsertOpts）。明示的な作り直し要求は DB に保存し、
  # reconcile が通常の encode を投入する。
  #
  # **`1` にすると reconcile が実エンコードの裏で待たされる。** 1 件消化モード
  # では 1 Job = 1 アイテムなので、数時間のエンコードが走っている間、KEDA は
  # `maxReplicaCount - 実行中 = 0` と数えて新しい Job を起こさない ---
  # ヒントを落とした録画を拾うための経路が、まさにその「時間のかかる
  # エンコード」に塞がれる。レベルトリガーなので取りこぼしはしない（エンコードが
  # 終われば次のパスが拾う）が、遅れはエンコードの長さぶんになる。
  #
  # **2 にしてある。** 代償は「実エンコードが 2 本同時に走りうる」こと ---
  # CPU を 1 本に抑えたいなら 1 に落とし、上の遅れを受け入れること
  # （`encode.concurrency` は 1 プロセス内の MaxWorkers なので、1 件消化モードでは
  # 常に 1 であり、クラスタ全体の本数を決めるのはこちらである）。
  maxReplicaCount: 2
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  scalingStrategy:
    strategy: accurate
  rollout:
    strategy: gradual
  jobTargetRef:
    backoffLimit: 0
    template:
      metadata:
        labels:
          app.kubernetes.io/name: rokuban
          app.kubernetes.io/component: worker
      spec:
        restartPolicy: Never
        enableServiceLinks: false
        automountServiceAccountToken: false
        # **drain と対で引き上げる。** 10s + `--soft-stop-timeout` 1h + 10s を
        # 包む（docs/operations.md §5）。片方だけ上げても短い側が先に効く。
        # 猶予の外に出すと SIGKILL が先に来て、実行中のジョブの行が一時的に
        # `running` のまま残る。encode は次の `encode_reconcile` が job-id lock の
        # 解放を確認して旧行を終端化し、代替ジョブを投入するが、猶予はその遅延を
        # 避けるためにも十分に取る。
        terminationGracePeriodSeconds: 3660
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 65534
          # **ScaledJob はキューアイテムごとに新しい Pod を作る。** 既定の
          # `Always` だと、ジョブが起きるたびにアーカイブ全体の再帰 chown を
          # 待つことになる（理由の全文は deploy/k8s/base/streamer.yaml）。
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: worker
            # **encode / thumbnail キュー（thumbnail_reconcile を含む）を購読する worker だけ
            # ffmpeg 入りのイメージを使う**（公式イメージは ffmpeg を同梱しないので起動時に
            # fail-fast する。`jobs.RequiresEncodeTools`）。image 名を分けて
            # あるのは、kustomize の `images:` が名前ごとの置換だからである ---
            # 分けないと「ffmpeg 入りに差し替えたら api も一緒に変わる」になる。
            image: ghcr.io/fetburner/rokuban-full:latest
            args:
              - server
              - --roles
              - worker
              - --once
              - --queues
              - encode
              - --sites=
              - --stores
              - main
              - --soft-stop-timeout
              - 1h
              - --config
              - /etc/rokuban/config.yml
            env:
              - name: POSTGRES_CONNECTION_STRING
                valueFrom:
                  secretKeyRef:
                    name: rokuban-secrets
                    key: POSTGRES_CONNECTION_STRING
            envFrom:
              - secretRef:
                  name: rokuban-secrets
            volumeMounts:
              - name: config
                mountPath: /etc/rokuban
                readOnly: true
              - name: media
                mountPath: /mnt/media
              # `readOnlyRootFilesystem: true` なので、スクラッチは明示的に
              # 書ける場所を与える（`storage.scratch_dir`）。**アーカイブと
              # 同じディスクに置かない**方針（docs/operations.md §3 / §4）を
              # 満たすため、PVC ではなくノードローカルの emptyDir にする。
              - name: scratch
                mountPath: /var/tmp/rokuban
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
        volumes:
          - name: config
            configMap:
              name: rokuban-config
          - name: media
            persistentVolumeClaim:
              claimName: rokuban-media
          - name: scratch
            emptyDir: {}
  triggers:
    - type: postgresql
      metadata:
        query: >-
          SELECT count(*) FROM river_job WHERE queue = 'encode_main' AND state IN ('available','retryable')
        targetQueryValue: "1"
        connectionFromEnv: POSTGRES_CONNECTION_STRING
---
apiVersion: keda.sh/v1alpha1
