              - name: media
                mountPath: /mnt/media
              - name: scratch
                mountPath: /var/tmp/rokuban
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
        volumes:
          - name: config
            configMap:
              name: rokuban-config
          - name: media
            persistentVolumeClaim:
              claimName: rokuban-media
          - name: scratch
            emptyDir: {}
  triggers:
    - type: postgresql
      metadata:
        query: >-
          SELECT count(*) FROM river_job WHERE queue = 'thumbnail_main' AND state IN ('available','retryable')
        targetQueryValue: "1"
        connectionFromEnv: POSTGRES_CONNECTION_STRING
