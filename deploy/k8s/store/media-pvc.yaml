# 置き場 1 つぶんの PVC（置き場の root にマウントされる）。置き場を増やすとこの PVC も 1 本増える。
#
# **置き場 1 つにつき PVC は 1 本で、複数 Pod が同時にマウントする**
# （その置き場の worker / ingest / streamer。docs/storage.md §5）---
# `ReadWriteMany` が要る。
#
# **RWX を満たす CSI の同定はここではしない**（storageClassName を書いていないので
# クラスタの既定が使われる）。実体の検証は別タスク（`docs/operations.md` §4）。
# kind の既定 StorageClass（rancher.io/local-path）は RWX を拒否する
# （`NodePath only supports ReadWriteOnce`）。そのため e2e overlay は RWO に落としている。
#
# **未解決: マウントの所有権。** `/mnt/media` の所有者と mode は、PVC のマウント元の
# ストレージが決める。PVC には named volume の copy-up が無いためである。
# `fsGroup: 65534`（media をマウントする Pod の securityContext）は、CSI ドライバが
# `fsGroupPolicy: File` を宣言するとき、または RWO のときだけ効く補助である。RWX の
# media PVC では既定ポリシーのドライバで効かない。ストレージ別の決まり方と手当ては
# docs/operations/k8s.md の「PVC マウントの所有権」節を見る。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rokuban-media
  labels:
    app.kubernetes.io/name: rokuban
    app.kubernetes.io/component: media
    rokuban.fetburner.net/store-scoped: "true"
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      # 参照実装としての最小値。実運用では録画の本数ぶんに合わせて overlay で
      # patch する（縮小はできないので、増やす方向にだけ動かせる）。
      storage: 32Gi
