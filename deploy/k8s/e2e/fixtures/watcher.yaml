# オラクル自己検査用の身代わり（判定 4）。製品のマニフェストではない。
#
# **ここだけは本物の rokuban を動かす。** 判定 4 が見ているのは
# `pg_try_advisory_lock` の実効なので、身代わりの中身を psql にすると
# 「身代わりが排他できた」だけを見ることになり、製品のコードを一度も通らない。
#
# レプリカ数はハーネスが 2 に上げる（判定 4 の中で scale する）。ここでは 1。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-fx-watcher-__SITE_A__
  labels:
    app.kubernetes.io/name: rokuban
    app.kubernetes.io/component: watcher
    rokuban-e2e/fixture: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rokuban
      app.kubernetes.io/component: watcher
      rokuban-e2e/fixture: "true"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rokuban
        app.kubernetes.io/component: watcher
        rokuban-e2e/fixture: "true"
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: watcher
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          args: ["server", "--roles", "watcher", "--sites", "__SITE_A__", "--config", "/etc/rokuban/config.yml"]
          envFrom:
            - secretRef:
                name: rokuban-secrets
          volumeMounts:
            - name: config
              mountPath: /etc/rokuban
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: e2e-toolbox-config
