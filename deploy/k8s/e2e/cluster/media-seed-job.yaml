# 判定 3 の足場。**製品のマニフェストではない。**
#
# media ボリュームに「エンコードする原本」を 1 つ書くだけの使い捨て Job。
#
# **なぜ Job なのか。** 原本は製品の PVC（`rokuban-media`）の上に無ければ
# ならない --- encode の worker が `storage.media_dir` から相対パスで開くため。
# ツールボックス Pod にその PVC を挿すこともできるが、ツールボックスは製品の
# マニフェストより先に立つので、まだ存在しない PVC を要求して Pending のまま
# 止まる。**書き込む側を後から立てるほうが、足場の起動順を壊さない。**
#
# ファイルのバイト数は標準出力に `SIZE=<n>` で出す（`media_assets.size_bytes`
# に入れる。呼び出し側は `kubectl logs` で読む）。**ツールボックスから
# `stat` できない**（media を挿していない）ので、書いた側に言わせている。
apiVersion: batch/v1
kind: Job
metadata:
  name: e2e-media-seed
  labels:
    app.kubernetes.io/name: rokuban-e2e
    app.kubernetes.io/component: media-seed
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rokuban-e2e
        app.kubernetes.io/component: media-seed
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        # PVC には copy-up が無いので、イメージ側の所有権は効かない
        # （deploy/k8s/base/media-pvc.yaml の「未解決」）。
        fsGroup: 65534
        # 製品側と同じ形にしておく（理由は deploy/k8s/base/streamer.yaml）。
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: seed
          # ffmpeg 入り（`Dockerfile.full`）。ENTRYPOINT は rokuban なので上書きする。
          image: __FULL_IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              out="/mnt/media/__ENCODE_REL_PATH__"
              mkdir -p "$(dirname "$out")"
              rm -f "$out"
              # 合成映像を MPEG-TS で書く。
              #
              # **長さがそのまま「エンコードが走り続ける時間」になる。**
              # 判定 3 は 3.2 と 3.3 でそれぞれ `2 × pollingInterval`（e2e では
              # 20 秒）の窓を取り、**窓の中で完走すると「殺されなかった」では
              # なく TODO で抜ける**。実測: 60 秒の原本では e2e-slow の
              # エンコードが 40〜50 秒で終わり、**周回によって 3.3 が TODO に
              # 落ちた**（1 周目は生き残り、2 周目は完走した）。240 秒にすると
              # エンコードは 3 分前後になり、窓の合計 40 秒に対して十分な余裕が
              # できる。**「速いマシンなら足りる」に賭けない** --- 遅い側で
              # 転ぶのではなく速い側で転ぶ判定なので、余裕は長さで取る。
              #
              # ビットレートを落としてあるのは原本のサイズ対策（240 秒 × 4Mbps
              # だと 120MB になる）。エンコードの所要は画素数と preset で決まる
              # ので、これを下げても窓との関係は変わらない。
              ffmpeg -nostdin -loglevel error -y \
                -f lavfi -i "testsrc2=size=640x480:rate=30" \
                -f lavfi -i "sine=frequency=440:sample_rate=48000" \
                -t 240 -c:v mpeg2video -b:v 1500k -c:a aac -f mpegts "$out"
              echo "SIZE=$(wc -c < "$out")"
          volumeMounts:
            - name: media
              mountPath: /mnt/media
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: rokuban-media
