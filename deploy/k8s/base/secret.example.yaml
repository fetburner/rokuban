# **このファイルは apply されない**（`kustomization.yaml` の `resources` に無い）。
# base が要求する Secret の「形」を書いた参考であり、テストはこのファイルを
# キー名の権威として読む（`manifests_test.go` の externalSecrets）。
#
# **base は Secret を出荷しない。** プレースホルダを出荷すると、
# `kustomize build base | kubectl apply -f -` が外で作った本物のパスワードを
# 上書きしてしまう。しかも env は起動時に読まれているので、上書きした瞬間は
# 何も壊れず、次の rollout やノード退避で初めて全 Pod が起動不能になる
# （そのときクラスタからパスワードも消えている）。
#
# Secret が無い状態で apply すると、Pod は `CreateContainerConfigError`
# （`secret "rokuban-secrets" not found`）で起動しない --- 秘密が無いことは
# `kubectl get pods` の 1 行で分かる。
#
# 供給の仕方は 2 つ。
#
# 1. 外で作る:
#
#      kubectl create secret generic rokuban-secrets \
#        --from-literal=POSTGRES_PASSWORD='...' \
#        --from-literal=POSTGRES_CONNECTION_STRING='postgresql://rokuban:...@postgres.<ns>.svc.cluster.local:5432/rokuban?sslmode=disable'
#
#    この形はパスワードを変えても Pod が入れ替わらない（Secret の名前が
#    変わらないため）。ローテーション時は `kubectl rollout restart` を打つ。
#
# 2. overlay の secretGenerator（`overlays/kind` が実例）:
#
#      secretGenerator:
#        - name: rokuban-secrets
#          literals: [POSTGRES_PASSWORD=...]
#
#    名前にハッシュが付くので、値を変えれば apply でそのまま rollout が起きる。
#    平文をコミットしない構成では `envs:` に .gitignore したファイルを指す、
#    または SOPS / sealed-secrets / External Secrets Operator を使う。
#
# パスワードの制約: 改行を含むものは使えない（前後の空白は落ちる）。config.yml 参照。
#
# **キーは 2 つある。** `POSTGRES_CONNECTION_STRING` は KEDA の postgresql
# トリガが読む接続文字列で、rokuban 自身は使わない（config.yml は
# `POSTGRES_PASSWORD` だけを展開する）。**接続を張るのは Job の Pod ではなく
# keda 名前空間の operator なので、ホスト名はクラスタ内 FQDN で書くこと** ---
# 短い Service 名は operator 側の search domain で解決されず、ScaledJob は
# `Ready=False / ScaledJobCheckFailed` のまま Job を一度も起こさない
# （症状は「KEDA が壊れた」ではなく「いつまでもスケールしない」。kind で実測）。
#
#   POSTGRES_CONNECTION_STRING=postgresql://rokuban:...@postgres.<ns>.svc.cluster.local:5432/rokuban?sslmode=disable
#
# 2 つに割れているのはパスワードが 2 か所へ届く必要があるためで、**出どころは
# 1 つにすること**（片方だけ回すと、症状は「api は動くがスケールしない」になる）。
apiVersion: v1
kind: Secret
metadata:
  name: rokuban-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: ""
  POSTGRES_CONNECTION_STRING: ""
