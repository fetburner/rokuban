# site 非依存キューの worker（KEDA ScaledJob）。
#
# **1 キュー = 1 ScaledJob = 1 Job = 1 アイテム。**
#
#   - **ScaledJob はロールではなくキュー単位に作る**（docs/operations.md §5
#     「worker: KEDA ScaledJob」）。切る軸は「寿命 × site 束縛」の 2 つで、
#     長時間ジョブ（`encode` / `cm_detect`）と短いジョブ（`ruler` / `storage`）を混ぜない ---
#     `terminationGracePeriodSeconds` が桁で違うので、混ぜると短い側に合わせて
#     長いジョブが殺されるか、長い側に合わせて全体のスケールインが遅くなる
#   - **site 束縛キューはここに無い**（`ingest` / `epg` / `reconciler` /
#     `watcher`）。混ぜると中央のジョブがサイト側で起きる。それらは
#     `deploy/k8s/site/` にサイト 1 組ぶんとして置いてある
#   - **置き場束縛キューもここに無い**（`transfer` / `encode` / `thumbnail` /
#     `cm_detect` / `ts_scan` / `original` / `storage`）。置き場の PVC を
#     マウントする Pod が要るので、`deploy/k8s/store/` に置き場 1 組ぶんとして
#     置いてある。ここに残るのは DB だけを触る `ruler` と `cleanup`
#   - **`--once` で 1 件消化して自分で終了する。** ScaledJob は Job の自己終了を
#     前提にした機構で、常駐する `--roles worker` を載せると Job が `succeeded` に
#     到達しない。`--once` は成功・失敗を問わず exit 0 なので、k8s 側は
#     `backoffLimit: 0` / `restartPolicy: Never` にして二重にリトライしない
#   - **キューは argv（`--queues`）で絞る。** ConfigMap は 1 個で全 Pod が同じ
#     config.yml を共有するので、キューを config キー（`worker.queues`）で
#     しか指定できないと ScaledJob の数だけ ConfigMap が増える。**共有する
#     config.yml に `worker.queues` を書くと、`--queues` を渡している worker が
#     すべて起動エラーになる**（両方指定は排他）
#
# **`default` キューの ScaledJob は無い。** 現在どのジョブも
# `river.QueueDefault` に入らない（すべて `Queue:` を明示している。
# internal/jobs）。誰も入れないキューに ScaledJob を置くと、トリガが常に 0 を
# 返すだけのオブジェクトが残る。**ジョブを 1 つでも default に入れたら
# ここに 1 本足すこと** --- `deploy/k8s/workloads_test.go` の
# TestScaledJobsCoverEveryQueue は `internal/jobs` を走査していて、
# `Queue: river.QueueDefault` が現れた日に落ちる。
#
# **トリガが数えるのは `available` と `retryable` の 2 つ。** notifier 上の常駐
# client が JobScheduler を動かすため、`retryable` の昇格は one-shot Pod に依存しない。
# retryable も数えるのはバックオフ中から KEDA の backlog に含めるためで、まだ
# claim できない job のために起きた Pod は `--once-idle-timeout` で終了する。
# この空振り起動は ingest / encode など定期パス以外の kind だけで起きる。定期パスは
# MaxAttempts=1 で、失敗しても `retryable` にならず discarded になるので起きない。
# **受け入れ判定ハーネスの「滞留」の定義（`deploy/k8s/e2e/lib/kube.sh` の
# `riverBacklogStates`）と同じ集合にすること。**
#
# **`rollout.strategy: gradual` は書き忘れてはならない 1 行である。**
# 省略も `immediate` も、Pod テンプレートの更新で実行中の Job が消える（kind で
# 実測。docs/operations.md §5 の表）。運用でこれを踏むのはイメージのタグを
# 上げたときで、症状は「デプロイしたら録画のエンコードが飛ぶ」になる。
#
# **postgresql トリガの接続先は FQDN で書く。** 接続を張るのは Job の Pod では
# なく keda 名前空間の operator なので、短い Service 名は operator 側の search
# domain で解決されない。このとき ScaledJob は `Ready=False /
# ScaledJobCheckFailed` のまま Job を一度も起こさず、**症状は「KEDA が壊れた」
# ではなく「いつまでもスケールしない」**になる（kind で実測）。接続文字列は
# Secret の `POSTGRES_CONNECTION_STRING`（`base/secret.example.yaml`）。
---
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: rokuban-worker-ruler
  labels:
    app.kubernetes.io/name: rokuban
    app.kubernetes.io/component: worker
    rokuban.fetburner.net/queue: ruler
spec:
  pollingInterval: 30
  # ruler_pass は UniqueOpts で合流するので、待ち行列に積み上がるのは高々
  # 数件である。上限は「ヒントが刺さった直後に少し並ぶ」ぶんだけ。
  maxReplicaCount: 3
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  scalingStrategy:
    # 1 Job = 1 アイテムなので、待ち行列の件数がそのまま欲しい Job 数になる。
    strategy: accurate
  rollout:
    strategy: gradual
  jobTargetRef:
    backoffLimit: 0
    template:
      metadata:
        labels:
          app.kubernetes.io/name: rokuban
          app.kubernetes.io/component: worker
      spec:
        restartPolicy: Never
        enableServiceLinks: false
        automountServiceAccountToken: false
        # preStop 0s + 停止待ち 10s + drain 5s + 畳み 10s = 25s（docs/operations.md
        # §5「Deployment 併用時」の足し算）。**等号にしない。**
        terminationGracePeriodSeconds: 30
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: worker
            # ruler は DB しか見ない（docs/operations.md §5 のキュー表）ので
            # 公式イメージで足りる。
            image: ghcr.io/fetburner/rokuban:latest
            args:
              - server
              - --roles
              - worker
              - --once
              - --queues
              - ruler
              - --sites=
              - --stores=
              - --soft-stop-timeout
              - 5s
              - --config
              - /etc/rokuban/config.yml
            env:
              # KEDA の postgresql トリガが読む接続文字列（`connectionFromEnv`）。
              # **env として宣言するのは、参照解決の検査（manifests_test.go）に
              # キー名を見せるため** --- `envFrom` だけだとキー名を誰も見ない。
              - name: POSTGRES_CONNECTION_STRING
                valueFrom:
                  secretKeyRef:
                    name: rokuban-secrets
                    key: POSTGRES_CONNECTION_STRING
            envFrom:
              - secretRef:
                  name: rokuban-secrets
            volumeMounts:
              - name: config
                mountPath: /etc/rokuban
                readOnly: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
        volumes:
          - name: config
            configMap:
              name: rokuban-config
  triggers:
    - type: postgresql
      metadata:
        query: >-
          SELECT count(*) FROM river_job WHERE queue = 'ruler' AND state IN ('available','retryable')
        targetQueryValue: "1"
        connectionFromEnv: POSTGRES_CONNECTION_STRING
---
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: rokuban-worker-cleanup
  labels:
    app.kubernetes.io/name: rokuban
    app.kubernetes.io/component: worker
    rokuban.fetburner.net/queue: cleanup
spec:
  pollingInterval: 30
  # cleanup は DB だけを触る reconcile（encode / thumbnail / cm_detect / ts_scan /
  # storage_transfer / label_rule）の置き場である。ジョブを積む側が置き場を選んで、
  # ファイルを触る仕事を `<queue>_<store>` のキューへ積み直す。
  maxReplicaCount: 2
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  scalingStrategy:
    strategy: accurate
  rollout:
    strategy: gradual
  jobTargetRef:
    backoffLimit: 0
    template:
      metadata:
        labels:
          app.kubernetes.io/name: rokuban
          app.kubernetes.io/component: worker
      spec:
        restartPolicy: Never
        enableServiceLinks: false
        automountServiceAccountToken: false
        # 10s + 60s + 10s を包む。
        terminationGracePeriodSeconds: 90
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: worker
            # DB だけを触るのでファイルシステムも ffmpeg も要らない。置き場は
            # マウントしない（`--stores=`）。
            image: ghcr.io/fetburner/rokuban:latest
            args:
              - server
              - --roles
              - worker
              - --once
              - --queues
              - cleanup
              - --sites=
              - --stores=
              - --soft-stop-timeout
              - 60s
              - --config
              - /etc/rokuban/config.yml
            env:
              - name: POSTGRES_CONNECTION_STRING
                valueFrom:
                  secretKeyRef:
                    name: rokuban-secrets
                    key: POSTGRES_CONNECTION_STRING
            envFrom:
              - secretRef:
                  name: rokuban-secrets
            volumeMounts:
              - name: config
                mountPath: /etc/rokuban
                readOnly: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 96Mi
              limits:
                memory: 512Mi
        volumes:
          - name: config
            configMap:
              name: rokuban-config
  triggers:
    - type: postgresql
      metadata:
        query: >-
          SELECT count(*) FROM river_job WHERE queue = 'cleanup' AND state IN ('available','retryable')
        targetQueryValue: "1"
        connectionFromEnv: POSTGRES_CONNECTION_STRING
