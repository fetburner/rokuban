                valueFrom:
                  secretKeyRef:
                    name: rokuban-secrets
                    key: POSTGRES_CONNECTION_STRING
            envFrom:
              - secretRef:
                  name: rokuban-secrets
            volumeMounts:
              - name: config
                mountPath: /etc/rokuban
                readOnly: true
              - name: media
                mountPath: /mnt/media
              - name: scratch
                mountPath: /var/tmp/rokuban
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
        volumes:
          - name: config
            configMap:
              name: rokuban-config
          - name: media
            persistentVolumeClaim:
              claimName: rokuban-media
          - name: scratch
            emptyDir: {}
  triggers:
    - type: postgresql
      metadata:
        query: >-
          SELECT count(*) FROM river_job WHERE queue = 'thumbnail' AND state IN ('available','retryable')
        targetQueryValue: "1"
        connectionFromEnv: POSTGRES_CONNECTION_STRING
---
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: rokuban-worker-cleanup
  labels:
    app.kubernetes.io/name: rokuban
    app.kubernetes.io/component: worker
    rokuban.fetburner.net/queue: cleanup
spec:
  pollingInterval: 30
  # delete_reconcile と catalog_export はそれぞれ UniqueOpts で自分自身の重複を
  # 防ぐので、「両方が同時に 1 本ずつ走れる」ぶんだけあればよい
  # （internal/worker の defaultCleanupConcurrency と同じ根拠）。
  maxReplicaCount: 2
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  scalingStrategy:
    strategy: accurate
  rollout:
    strategy: gradual
  jobTargetRef:
    backoffLimit: 0
    template:
      metadata:
        labels:
          app.kubernetes.io/name: rokuban
          app.kubernetes.io/component: worker
      spec:
        restartPolicy: Never
        enableServiceLinks: false
        automountServiceAccountToken: false
        # 10s + 60s + 10s を包む。1 パスの削除件数はサーキットブレーカー
        # （`cleanup.max_deletes_per_pass`）で上限があるので、猶予は
        # 「アーカイブの walk が終わるまで」の側で決まる（**未測定**）。
        terminationGracePeriodSeconds: 90
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 65534
          # **ScaledJob はキューアイテムごとに新しい Pod を作る。** 既定の
          # `Always` だと、ジョブが起きるたびにアーカイブ全体の再帰 chown を
          # 待つことになる（理由の全文は deploy/k8s/base/streamer.yaml）。
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: worker
            # cleanup（delete_reconcile / catalog_export）はファイルシステムを
            # 要求するが ffmpeg は要求しない（`worker.RequiresEncodeTools` は
            # encode / thumbnail だけ）。
            image: ghcr.io/fetburner/rokuban:latest
            args:
              - server
              - --roles
              - worker
              - --once
              - --queues
              - cleanup
              - --sites=
              - --soft-stop-timeout
              - 60s
              - --config
              - /etc/rokuban/config.yml
            env:
              - name: POSTGRES_CONNECTION_STRING
                valueFrom:
                  secretKeyRef:
                    name: rokuban-secrets
                    key: POSTGRES_CONNECTION_STRING
            envFrom:
              - secretRef:
                  name: rokuban-secrets
            volumeMounts:
              - name: config
                mountPath: /etc/rokuban
                readOnly: true
              - name: media
                mountPath: /mnt/media
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 96Mi
              limits:
                memory: 512Mi
        volumes:
          - name: config
            configMap:
              name: rokuban-config
          - name: media
            persistentVolumeClaim:
              claimName: rokuban-media
  triggers:
    - type: postgresql
      metadata:
        query: >-
          SELECT count(*) FROM river_job WHERE queue = 'cleanup' AND state IN ('available','retryable')
        targetQueryValue: "1"
        connectionFromEnv: POSTGRES_CONNECTION_STRING
---
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: rokuban-worker-storage
  labels:
    app.kubernetes.io/name: rokuban
    app.kubernetes.io/component: worker
    rokuban.fetburner.net/queue: storage
spec:
  pollingInterval: 30
  maxReplicaCount: 1
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  scalingStrategy:
    strategy: accurate
  rollout:
    strategy: gradual
  jobTargetRef:
    backoffLimit: 0
    template:
      metadata:
        labels:
          app.kubernetes.io/name: rokuban
          app.kubernetes.io/component: worker
      spec:
        restartPolicy: Never
        enableServiceLinks: false
        automountServiceAccountToken: false
        terminationGracePeriodSeconds: 30
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 65534
          # **ScaledJob はキューアイテムごとに新しい Pod を作る。** 既定の
          # `Always` だと、ジョブが起きるたびにアーカイブ全体の再帰 chown を
          # 待つことになる（理由の全文は deploy/k8s/base/streamer.yaml）。
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
        containers:
