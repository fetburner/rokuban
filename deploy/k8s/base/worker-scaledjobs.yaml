        labels:
          app.kubernetes.io/name: rokuban
          app.kubernetes.io/component: worker
      spec:
        restartPolicy: Never
        enableServiceLinks: false
        automountServiceAccountToken: false
        # 10s + 60s + 10s を包む。encode と同じ ffmpeg でも、サムネイルは
        # 1 フレームの seek + デコードなので桁が違う（**測ってはいない**。
        # encode と同じ猶予を与えない理由がこちら側にある、という以上のことは
        # 言えない）。
        terminationGracePeriodSeconds: 90
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 65534
          # **ScaledJob はキューアイテムごとに新しい Pod を作る。** 既定の
          # `Always` だと、ジョブが起きるたびにアーカイブ全体の再帰 chown を
          # 待つことになる（理由の全文は deploy/k8s/base/streamer.yaml）。
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: worker
            image: ghcr.io/fetburner/rokuban-full:latest
            args:
              - server
