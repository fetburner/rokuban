# site 非依存の定期投入（`rokuban enqueue <ジョブ名>`）。
#
# **`worker.periodic_jobs: false` で出荷しているので、投入するのはここだけである。**
# true だと ScaledJob の 1 件消化モード（`--once`）が起動を拒むので、投入元は
# CronJob に一本化してある（docs/data.md §2）。
#
# 規律が 3 つある。
#
#   - **argv は平たい要素で書く。** `sh -c "rokuban enqueue ..."` でくるむと、
#     受け入れ判定ハーネスが投入側の CronJob を見つけられない（探索は argv の
#     要素として `enqueue` と ジョブ名 と `--site <site>` を見る。
#     `deploy/k8s/e2e/lib/kube.sh`）。**シェルを挟まないことは運用上も安い** ---
#     シェルを挟むと `rokuban` の終了コードがシェルのものに化ける
#   - **`enqueue` は同じジョブが待機中なら投入せず exit 0 を返す**（UniqueOpts で
#     合流する）。重ねて叩いても CronJob が失敗扱いにならないので、
#     `concurrencyPolicy` と schedule を厳密に噛み合わせる必要はない
#   - **schedule は実運用の間隔を書く。** 受け入れ判定は 180 秒以内の自然発火を
#     要求するが、そのために base を短くしない --- 判定用の間隔は
#     `overlays/e2e` が patch で当てる（`deploy/k8s/workloads_test.go` の
#     TestCronSchedulesAreProductionValues が両方を固定している）
#
# 間隔は in-process の定期ジョブ（`worker.periodic_jobs: true` の monolith）の
# 既定値に合わせてある。**ここを変えるときは monolith 側の既定と揃えるか、
# 揃えない理由を書くこと** --- 揃っていないと「docker-compose では 15 分で
# 走るのに k8s では走らない」という、構成ごとに挙動が違う形になる。
#
# **site 束縛のジョブ（`epg-sync` / `tuner-sync` / `ruler-pass` /
# `reconcile-pass` / `record-sweep`）はここに無い。** サイト 1 組ぶんとして
# `deploy/k8s/site/` にある。
#
# **置き場束縛のジョブ（`catalog-export` / `delete-reconcile` / `storage-sync`）は
# ここに無い。** 置き場 1 つぶんとして `deploy/k8s/store/` にある。

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rokuban-enqueue-thumbnail-reconcile
  labels:
    app.kubernetes.io/name: rokuban
    app.kubernetes.io/component: enqueue
spec:
  # in-process の既定は 15 分（cmd/rokuban/workerspec.go の newWorkerSpec）。
  # ヒントを落としたサムネイルを拾い直す唯一の定期経路。
  schedule: "*/15 * * * *"
  startingDeadlineSeconds: 600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rokuban
            app.kubernetes.io/component: enqueue
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: enqueue
              image: ghcr.io/fetburner/rokuban:latest
              args: ["enqueue", "thumbnail-reconcile", "--config", "/etc/rokuban/config.yml"]
              envFrom:
                - secretRef:
                    name: rokuban-secrets
              volumeMounts:
                - name: config
                  mountPath: /etc/rokuban
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  memory: 128Mi
          volumes:
            - name: config
              configMap:
                name: rokuban-config
