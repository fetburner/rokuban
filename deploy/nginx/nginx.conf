# Rokuban の前段に置く nginx のリファレンス構成。
#
# このファイルを /etc/nginx/nginx.conf として使う。次の値は環境に合わせて
# 変更すること:
#   - server_name と /etc/letsencrypt/live/... のドメイン
#   - upstream の Rokuban の listen アドレス
#   - root の web/dist 配置先
#   - /etc/nginx/htpasswd/rokuban の Basic 認証ファイル
#
# Rokuban 側は次の設定に揃える:
#   server.allowed_hosts: [rokuban.example.com]
#   server.trust_forwarded_host: false
#   storage.accel_location: /_media/
#   storage.media_dir: /mnt/media
#
# upstream を 127.0.0.1 のまま使えるのは nginx と Rokuban が同じホストに
# いる場合。nginx をコンテナで動かす場合は、同じネットワークのサービス名か
# host.docker.internal に変更する。

worker_processes auto;
pid /tmp/rokuban-nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    upstream rokuban {
        server 127.0.0.1:40773;
    }

    # すべてのアプリ向けリクエストに同じ転送ヘッダーを付ける。
    # Rokuban は Host を検証し、X-Forwarded-Host は trust_forwarded_host=true
    # のときだけ検証に使う。この構成では Host に公開ホスト名をそのまま渡すため、
    # trust_forwarded_host は false のままにする。
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;

    # 未知の Host は静かに捨てる。TLS の証明書は名前付き server と同じものを
    # 指すが、正しい Host の server に転送しない。
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    # Let's Encrypt の HTTP-01 challenge だけは HTTPS へリダイレクトしない。
    server {
        listen 80;
        server_name rokuban.example.com;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
            auth_basic off;
        }

        # 監視用 liveness は認証なしで通す。Rokuban 側もこのパスを Host 検証から
        # 免除している。通常の API / UI は HTTPS 側でのみ公開する。
        location = /healthz {
            proxy_pass http://rokuban;
        }

        location / {
            return 308 https://$host$request_uri;
        }
    }

    # 未知の HTTPS Host を捨てる default server。
    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate /etc/letsencrypt/live/rokuban.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rokuban.example.com/privkey.pem;
        return 444;
    }

    server {
        listen 443 ssl;
        server_name rokuban.example.com;

        ssl_certificate /etc/letsencrypt/live/rokuban.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rokuban.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:rokuban_ssl:10m;
        ssl_session_timeout 10m;

        # /api、録画ファイル、SSE、SPA のすべてを同じ認証境界に置く。
        # internal な /_media/ と監視用パスだけは下の location で明示的に除外する。
        auth_basic "Rokuban";
        auth_basic_user_file /etc/nginx/htpasswd/rokuban;

        # ビルド済み SPA は nginx が配る。クライアント側ルートは index.html に落とす。
        # API のパスは先に proxy へ送るため、API の 404 が HTML になることはない。
        root /srv/rokuban/web/dist;
        index index.html;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
            auth_basic off;
        }

        # 監視エンドポイントは外部プローブから叩けるようにする。
        location = /healthz {
            auth_basic off;
            proxy_pass http://rokuban;
        }

        location = /readyz {
            auth_basic off;
            proxy_pass http://rokuban;
        }

        # metrics は機密性のある運用情報を含むため、Basic 認証を継承する。
        location = /metrics {
            proxy_pass http://rokuban;
        }

        # 末尾スラッシュの無い /api も SPA に落とさない。
        location = /api {
            proxy_pass http://rokuban;
        }

        # SSE はイベントを nginx に溜めず、Rokuban の 25 秒 ping で接続を維持する。
        location = /api/events {
            proxy_buffering off;
            proxy_cache off;
            proxy_pass http://rokuban;
        }

        # 録画配信、REST、ライブ HLS を含む API はアプリへ送る。ライブ HLS は
        # /_media/ に移さず、アプリ配信のままにする（idle GC が要求を観測するため）。
        location ^~ /api/ {
            proxy_pass http://rokuban;
        }

        # X-Accel-Redirect の宛先。外部からの直接アクセスは internal により 404 で、
        # アプリの認可を経た内部リダイレクトだけがここへ入れる。
        # alias の末尾スラッシュは location の末尾スラッシュと対にする。
        location ^~ /_media/ {
            internal;
            auth_basic off;
            alias /mnt/media/;
        }

        # Vite のハッシュ付き成果物は存在しない場合に index.html へ落とさない。
        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # SPA のディープリンク（例: /recordings/123）を index.html へフォールバックする。
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
