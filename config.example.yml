# Rokuban 設定ファイル
# ${VAR} で環境変数を参照、${VAR:-default} でデフォルト値指定、$$ でリテラル $ をエスケープ

# HTTP を持つロール (api, streamer, notifier) 共通
server:
  listen: ":40773"               # mirakc の 40772 の隣
  allowed_hosts: [rokuban.local] # Host ヘッダー allowlist。空にするとチェック無効（開発用）

# PostgreSQL 接続情報（必須）
db:
  host: postgres
  port: 5432
  user: ${POSTGRES_USER}
  password: ${POSTGRES_PASSWORD}
  database: rokuban
  sslmode: disable

# mirakc エンドポイント（必須）
mirakc:
  url: http://mirakc.local:40772

# ストレージ（media_dir は必須）
storage:
  media_dir: /mnt/media          # アーカイブ層 (S3-via-CSI 可)
  scratch_dir: /var/tmp/rokuban  # ローカルスクラッチ
  # accel_location: /_media/     # X-Accel-Redirect の internal location。
                                 # 設定すると録画ファイルのバイト転送を nginx に委ねる。
                                 # 空なら Go が直接配る（性能上は十分）

# ingest
ingest:
  concurrency: 2                 # mirakc サイトあたり同時転送数
  stall_timeout: 30s             # 転送中の無進捗検知。この時間バイトが進まないと切断して
                                 # Range 再開する。River の総時間タイムアウトは無効化している
                                 # ため、これが ingest の唯一のタイムアウト。
                                 # 遅い回線や大きな録画で誤爆する場合は延ばす

# EPG プロジェクション
epg:
  sync_interval: 10m             # mirakc から EPG を全量取得する間隔
  retention_grace: 24h           # 放送終了からこの時間で番組を刈り取る

# ルール評価（ruler）
ruler:
  max_deletes_per_pass: 50       # 1 サイト・1 パスで実行してよい導出削除数の上限。超えたら
                                 # 削除を一切実行せず、大量削除サーキットブレーカーとして発動する
                                 # （手動で POST /api/breakers/ruler_deletes/resume するまで
                                 #  止まり続けるラッチ。docs/recording.md §3.2）。
                                 # 下げると: EPG の一時的な欠損やルールの一括編集で発動しやすく
                                 # なる代わりに、誤判定で一気に失う予約の上限が下がる。
                                 # 上げると: 発動しにくくなる代わりに、EPGStation#692 のような
                                 # 障害クラスで一度に失う予約が増える。既定値 50 は、通常運用で
                                 # 1 サイトが同時に抱えるアクティブ予約数を明確に超える値として
                                 # 選んである

# 宣言的同期（reconciler）
reconciler:
  start_delay_grace: 3m          # 開始遅延検出器の猶予。「開始時刻 + この時間」を過ぎても
                                 # recordings.started_at が観測されない予約を検出し、
                                 # slog.Error と rokuban_reconcile_start_delayed ゲージに出す。
                                 # 録画開始は mirakc に全面委譲済みで Rokuban からは防げないが、
                                 # mirakc 側の未知の不具合への保険（EPGStation#724: チューナー
                                 # 再接続ハングで開始が 10 分遅延した実例あり。docs/recording.md
                                 # §3.3）。短くすると: 開始直後は mirakc の SSE 到達と watcher の
                                 # 処理に遅れがあるため、猶予が短すぎると正常な録画開始でも
                                 # 毎回誤検知してアラートが常時鳴る

# worker ロールの River クライアント
worker:
  periodic_jobs: true            # プロセス内で定期ジョブ（epg_sync / ruler_pass / reconcile_pass / record_sweep）を投入するか。
                                 # k8s では false にし、CronJob から rokuban enqueue で投入する
                                 # （River の PeriodicJobs はリーダーだけが投入するため、
                                 #  KEDA で 0 にスケールすると誰も投入しなくなる。docs/data.md §2）
  queues: []                     # 引くキューを絞る。空なら全部。
                                 # ロールを増やさずに「ruler / reconciler だけ別 Pod」を実現するための knob

# エンコード
encode:
  ffmpeg: ffmpeg                 # PATH 検索。フルパス指定可
  ffprobe: ffprobe
  # profiles:
  #   - name: h264

# ログ
log:
  level: info                    # debug | info | warn | error
  format: json                   # json | text
