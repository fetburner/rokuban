# Rokuban 設定ファイル
# ${VAR} で環境変数を参照、${VAR:-default} でデフォルト値指定、$$ でリテラル $ をエスケープ

# HTTP を持つロール (api, streamer, notifier) 共通
server:
  listen: ":40773"               # mirakc の 40772 の隣
  allowed_hosts: [rokuban.local] # Host ヘッダー allowlist。空にするとチェック無効（開発用）
  # trust_forwarded_host: true # リバースプロキシ前段で X-Forwarded-Host を検証対象にする（既定 false）。
  # 前段にプロキシが無い直接露出構成（--all の既定）では有効にしないこと。X-Forwarded-Host は
  # クライアントが自由に送れる自己申告値なので、プロキシ無しで信頼すると Host allowlist
  # （DNS rebinding 対策）を迂回できてしまう。信頼できるプロキシが必ず前段に居り、かつ
  # プロキシが外来の X-Forwarded-Host を上書きする構成でのみ true にする

# PostgreSQL 接続情報（必須）
db:
  host: postgres
  port: 5432
  user: ${POSTGRES_USER}
  password: ${POSTGRES_PASSWORD}
  database: rokuban
  sslmode: disable
  # max_conns: 20                # このプロセスが持つ唯一のコネクションプールの上限。
                                 # プロセスは常に 1 個のプールしか持たず全ロールが共有するため、
                                 # 「ロール別プール上限」はこの 1 個の上限を決めることを指す。
                                 # 未指定（0）なら、起動時の roles（--all / --roles）から
                                 # ロールごとの budget（api:10 / worker:8 / watcher:3 /
                                 # notifier:3 / streamer:4）を合計して自動算出する
                                 # （docs/operations.md §3「輻輳時の隔離」）
  # api_statement_timeout: 30s   # api ロールを含むプロセスのプールにだけ適用する
                                 # statement_timeout。未指定（0）なら既定値 30s。
                                 # api ロールを含まないプロセス（worker/watcher 単独等）には
                                 # 適用されない
  # pooler_compat: false         # true にすると PgBouncer / Neon pooler の transaction
                                 # pooling 越しでも壊れないよう prepared statement キャッシュを
                                 # 無効化する。pooler を通せるのは api ロールと streamer ロールだけ
                                 # —— worker / watcher / notifier と組み合わせると起動時エラーになる
                                 # （LISTEN/NOTIFY と advisory lock がセッション状態に
                                 # 依存するため。docs/operations.md §3）

# mirakc エンドポイント。`mirakcs:` との排他（下）でどちらか一方が必須
mirakc:
  url: http://mirakc.local:40772
  # site: default                # 省略時 "default"。DB 全テーブルと API パスの
                                 # /api/sites/{site}/... をスコープする

# 複数 mirakc。`mirakc:` の代わりにこちらを使う。
# `mirakc:` は `mirakcs:` の 1 要素と等価に解決される糖衣なので、両方を同時に
# 書くと起動エラーになる。site 名は ^[a-z0-9]([_-]?[a-z0-9])*$ / 53 文字以内、
# catalog / thumbnails は予約名で使えない。プロセスがどのサイトに束縛されるかは
# `rokuban server --sites <site>` で指定する（config キーではない）。
# mirakcs:
#   - site: tokyo
#     url: http://mirakc-tokyo:40772
#   - site: takamatsu
#     url: http://mirakc-takamatsu:40772

# ストレージ（media_dir は必須）
storage:
  media_dir: /mnt/media          # アーカイブ層 (S3-via-CSI 可)
  scratch_dir: /var/tmp/rokuban  # ローカルスクラッチ
  # accel_location: /_media/     # X-Accel-Redirect の internal location。
                                 # 設定すると録画ファイルのバイト転送を nginx に委ねる。
                                 # 空なら Go が直接配る（性能上は十分）

# ingest
ingest:
  concurrency: 2                 # mirakc サイトあたり同時転送数
  stall_timeout: 30s             # 転送中の無進捗検知。この時間バイトが進まないと切断して
                                 # Range 再開する。River の総時間タイムアウトは無効化している
                                 # ため、これが ingest の唯一のタイムアウト。
                                 # 遅い回線や大きな録画で誤爆する場合は延ばす

# EPG プロジェクション
epg:
  sync_interval: 10m             # mirakc から EPG を全量取得する間隔
  retention_grace: 24h           # 放送終了からこの時間で番組を刈り取る。EPG 射影
                                 # （epg_programs）と ruler の GC（予約・意図・上書き）の
                                 # 両方の窓がこの 1 つの値で決まる。
                                 # 後者があるので、これが「encode 意図が生き残る滞留の上限」に
                                 # もなる。エッジのリングバッファを N 日分でサイジングするなら
                                 # N 以上にする。ただし上げると EPG 射影の窓も一緒に広がる
                                 # （放送済み番組が長く残り、never-scheduled 行を作る窓も広がる）
                                 # docs/storage.md §6「凍結が依存する寿命と、エッジの滞留の交点」
                                 # / docs/operations.md §4

# ルール評価（ruler）
ruler:
  max_deletes_per_pass: 50       # 1 サイト・1 パスで実行してよい導出削除数の上限。超えたら
                                 # 削除を一切実行せず、大量削除サーキットブレーカーとして発動する
                                 # （手動で
                                 #  POST /api/sites/{site}/breakers/ruler_deletes/resume
                                 #  するまで止まり続けるラッチ。docs/recording.md §3.2）。
                                 # 下げると: EPG の一時的な欠損やルールの一括編集で発動しやすく
                                 # なる代わりに、誤判定で一気に失う予約の上限が下がる。
                                 # 上げると: 発動しにくくなる代わりに、EPGStation#692 のような
                                 # 障害クラスで一度に失う予約が増える。既定値 50 は、通常運用で
                                 # 1 サイトが同時に抱えるアクティブ予約数を明確に超える値として
                                 # 選んである

# 宣言的同期（reconciler）
reconciler:
  start_delay_grace: 3m          # 開始遅延検出器の猶予。「開始時刻 + この時間」を過ぎても
                                 # recordings.started_at が観測されない予約を検出し、
                                 # slog.Error と rokuban_reconcile_start_delayed ゲージに出す。
                                 # 録画開始は mirakc に全面委譲済みで Rokuban からは防げないが、
                                 # mirakc 側の未知の不具合への保険（EPGStation#724: チューナー
                                 # 再接続ハングで開始が 10 分遅延した実例あり。docs/recording.md
                                 # §3.3）。短くすると: 開始直後は mirakc の SSE 到達と watcher の
                                 # 処理に遅れがあるため、猶予が短すぎると正常な録画開始でも
                                 # 毎回誤検知してアラートが常時鳴る

# worker ロールの River クライアント
worker:
  periodic_jobs: true            # プロセス内で定期ジョブ（epg_sync / tuner_sync / ruler_pass /
                                 # reconcile_pass / record_sweep / catalog_export /
                                 # delete_reconcile / storage_sync）を投入するか。
                                 # k8s では false にし、CronJob から rokuban enqueue で投入する
                                 # （River の PeriodicJobs はリーダーだけが投入するため、
                                 #  KEDA で 0 にスケールすると誰も投入しなくなる。docs/data.md §2）
  queues: []                     # 引くキューを絞る。空なら全部。
                                 # ロールを増やさずに「ruler / reconciler だけ別 Pod」を実現するための knob

# エンコード（プロファイルはデプロイ属性。DB のルールからは名前参照）
encode:
  ffmpeg: ffmpeg                 # PATH 検索。フルパス指定可。worker 起動時に存在検査
  ffprobe: ffprobe
  concurrency: 1                 # encode キューの MaxWorkers
  thumbnail_concurrency: 1       # thumbnail キューの MaxWorkers
  # profiles:
  #   - name: h264
  #     container: mp4           # mp4 | mkv
  #     video_codec: libx264
  #     audio_codec: aac
  #     height: 1080             # 0 or omit = スケールしない
  #     crf: 23                  # qp との同時指定は起動エラー
  #     preset: medium           # optional
  #     extra_args: []           # コーデック/品質/スケールの後・アプリ所有の末尾
                                 # （-f/-progress/出力パス）の前。許可済みオプションのみ
                                 # （自由形式 cmd 全体は禁止。docs/configuration.md 参照）
  #   # VAAPI（Intel/AMD）。device のマウントはデプロイ側の話 --- k8s なら
  #   # resources.limits、Docker なら --device。**起動時に device の存在は検査しない**
  #   # ので、無い device を書いたプロファイルはジョブ失敗として現れる
  #   - name: h264_vaapi
  #     container: mp4
  #     video_codec: h264_vaapi
  #     audio_codec: aac
  #     height: 720
  #     scaler: vaapi            # software（既定）| vaapi。height があるときだけ効く
  #     qp: 24                   # VAAPI は -crf を解さない（crf との同時指定は起動エラー）
  #     hwaccel:                 # このブロックだけが -i より前に出る
  #       kind: vaapi            # -hwaccel vaapi
  #       device: /dev/dri/renderD128   # -hwaccel_device（例示）
  #       output_format: vaapi   # -hwaccel_output_format（scale_vaapi へ HW フレームで渡す）
  #     input_extra_args: []     # -i の直前に足す許可済み引数（自由形式 cmd 全体は禁止）

# ライブ視聴（streamer ロールのみ使う）
live:
  enabled: false                 # true のときだけライブのルートを登録し、ffmpeg の
                                 # LookPath 検査も行う。公式イメージ（ffmpeg 無し）で
                                 # streamer ロールを起動する構成を壊さないための既定 false
  # ffmpeg: ffmpeg                # 既定は PATH 検索
  # segment_dir: /dev/shm/rokuban-live  # HLS セグメント/プレイリストの書き出し先。
                                 # **既定値を持たない --- enabled: true なら必須**
                                 # （空だと起動時エラー）。録画バッファとは別ディスク
                                 # （tmpfs 前提）。起動時（HTTP リスナーが立つ前）に
                                 # このディレクトリ全体を掃く --- tmpfs はノード再起動
                                 # でしか消えないため、前回プロセスの残骸を毎起動で
                                 # 必ず消す。**複数プロセス/レプリカで共有しないこと**
                                 # ---共有すると後発の起動が先発のセッションディレクトリ
                                 # を消し、視聴が一度途切れる（次のプレイリスト要求で
                                 # 自己修復はする）
  # max_sessions: 4                # このプロセスの同時ライブセッション数上限
                                 # （プロセスローカル。グローバルな天井はチューナー数）
  # idle_timeout: 30s              # サービス単位の idle GC 猶予
  # tuner_priority: 1              # mirakc への X-Mirakurun-Priority。ruler の schedule
                                 # 既定 priority（10）より低く保ち、チューナー枯渇時に
                                 # 録画側を勝たせる
  # hwaccel:                     # -i より前に出る唯一のブロック。**live セクション直下
                                 # に置く（プロファイル毎ではない）** --- ライブは 1 回の
                                 # ffmpeg で入力 1 本・出力 N 本なので、プロファイル毎に
                                 # 持たせると「プロファイル 2 つが別の hwaccel を要求する」
                                 # という表現できない設定が書けてしまう
  #   kind: vaapi
  #   device: /dev/dri/renderD128
  #   output_format: vaapi
  # input_extra_args: []         # `-f mpegts -i pipe:0` の直前に足す許可済み引数
  # profiles:
  #   - name: h264                 # `?profile=` から参照する名前
  #     video_codec: libx264       # ISDB-T の映像は MPEG-2 なのでブラウザの HLS 経路
                                 #   向けに H.264 へ変換する
  #     audio_codec: aac
  #     height: 720               # 0 or omit = スケールしない
  #     preset: veryfast          # optional
  #     segment_seconds: 2        # 0 なら既定値 2
  #     playlist_size: 6          # 0 なら既定値 6
  #   # VAAPI（scaler/crf/qp はプロファイル毎 --- 出力側オプションなので出力ごとに違ってよい）
  #   - name: h264_vaapi
  #     video_codec: h264_vaapi
  #     audio_codec: aac
  #     height: 720
  #     scaler: vaapi
  #     qp: 26
  #     segment_seconds: 2
  #     playlist_size: 6

# 汎用 webhook（EPGStation の複数種外部コマンドを 1 本の HTTP POST に置き換える）
webhook:
  url: ""                        # 空なら no-op（送らない）。例: https://hooks.example.com/rokuban
  secret: ""                     # 非空なら X-Rokuban-Webhook-Secret ヘッダに載せる
  timeout: 5s                    # 1 回の HTTP 要求タイムアウト。失敗時は同期で 1 回だけ再試行
  events: []                     # 空なら既知の全イベント有効。絞る例:
                                 #   - recording.finished
                                 #   - recording.failed
                                 #   - encode.finished
                                 #   - encode.failed
                                 #   - recording.deleted
                                 # 本処理（ingest 等）は webhook 成否で止めない

# 削除 reconcile（ごみ箱・孤児回収。docs/storage.md §7）
cleanup:
  trash_retention: 720h          # ごみ箱（recordings.deleted_at）の猶予。0 なら既定値（30 日）
  orphan_mtime_grace: 168h       # 孤児候補にするまでの mtime 猶予。これより新しいファイルは
                                 # 孤児候補にしない（正常系の録画→ingest→エンコードは数時間で
                                 # 完結するため）。0 なら既定値（7 日）
  orphan_age: 336h               # 孤児候補が記録されてから実削除されるまでのエイジング期間。
                                 # 0 なら既定値（14 日）
  max_deletes_per_pass: 100      # 一括削除サーキットブレーカーの閾値。ソースを問わず
                                 # 1 パス全体の合計に対して働く（ruler と同じラッチ式。
                                 # 手動で
                                 #  POST /api/sites/{site}/breakers/delete_reconcile/resume
                                 # するまで止まり続ける）。0 なら既定値（100）

# ログ
log:
  level: info                    # debug | info | warn | error
  format: json                   # json | text
