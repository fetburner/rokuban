# Rokuban 設定ファイル
# ${VAR} で環境変数を参照、${VAR:-default} でデフォルト値指定、$$ でリテラル $ をエスケープ

# HTTP を持つロール (api, streamer) 共通
server:
  listen: ":40773"               # mirakc の 40772 の隣
  allowed_hosts: [rokuban.local] # Host ヘッダー allowlist。localhost 系は常に許可

# PostgreSQL 接続情報（必須）
db:
  host: postgres
  port: 5432
  user: ${POSTGRES_USER}
  password: ${POSTGRES_PASSWORD}
  database: rokuban
  sslmode: disable

# mirakc エンドポイント（必須）
mirakc:
  url: http://mirakc.local:40772

# ストレージ（media_dir は必須）
storage:
  media_dir: /mnt/media          # アーカイブ層 (S3-via-CSI 可)
  scratch_dir: /var/tmp/rokuban  # ローカルスクラッチ

# ingest
ingest:
  concurrency: 2                 # mirakc サイトあたり同時転送数

# エンコード
encode:
  ffmpeg: ffmpeg                 # PATH 検索。フルパス指定可
  ffprobe: ffprobe
  # profiles:
  #   - name: h264

# ログ
log:
  level: info                    # debug | info | warn | error
  format: json                   # json | text
