openapi: "3.1.0"
info:
  title: Rokuban API
  version: 0.0.1
  description: Cloud-native recording server API

paths:
  /healthz:
    get:
      operationId: healthz
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/version:
    get:
      operationId: getVersion
      summary: Get server version
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /api/rules:
    get:
      operationId: listRules
      summary: List recording rules
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rule"
    post:
      operationId: createRule
      summary: Create a recording rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400":
          description: Invalid input (e.g. unsupported regex)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/rules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getRule
      summary: Get a recording rule
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateRule
      summary: Update a recording rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteRule
      summary: Delete a recording rule
      description: |
        導出予約の整理を伴う。overrides のない rule 予約は削除し、
        overrides 付きは detached 化して生き残る（recording.md §4.3）。
        応答に影響内訳を載せる。
      responses:
        "200":
          description: Deleted (with impact summary)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteRuleResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reservations:
    get:
      operationId: listReservations
      summary: List reservations
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"
    post:
      operationId: createReservation
      summary: Create a manual reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          description: Program not found in the EPG projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict (duplicate programId)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reservations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getReservation
      summary: Get a reservation
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateReservationOverrides
      summary: Update per-reservation overrides
      description: |
        値を書いたフィールドはそのフィールドの override を設定する。`reset`
        配列に名前を挙げたフィールドは override を削除する（フィールド単位の
        「ルールに戻す」）。どちらにも現れないフィールドは変更しない。

        `null` で消す形にはしない（`*T` は「キーが無い」と `null` を区別できず、
        「消す」が「変更しない」に化けて黙って壊れるため。
        docs/recording.md §4.2「overrides API の形」）。

        同じフィールドを値と `reset` の両方に書いたら 400（意図が不明なので
        推測しない）。`reset` に未知のフィールド名があっても 400。

        `skip` は overrides のキーではない（`program_intents.action` が担う）ので
        ここでは扱わない。取消は `DELETE /api/reservations/{id}`。

        override は `program_overrides` 表（`program_intents` とは別表）に持つ。
        予約単位の「ルールに戻す」は `DELETE /api/reservations/{id}/overrides` で、
        `program_intents` には一切触れない（docs/recording.md §4.2「overrides は
        program_intents とは別の表に置く」）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationOverridesInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteReservation
      summary: Cancel a reservation
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reservations/{id}/overrides:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    delete:
      operationId: resetReservationOverrides
      summary: Reset all overrides for a reservation (revert to rule)
      description: |
        予約単位の「ルールに戻す」。`program_overrides` の行を削除するだけ
        （`DELETE FROM program_overrides WHERE site = $1 AND program_id = $2`）。
        `action`（record/skip。`program_intents` 側）は触らない
        （docs/recording.md §4.2「overrides は program_intents とは別の表に置く」）。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/services:
    get:
      operationId: listServices
      summary: List EPG services (channels)
      description: |
        EPG プロジェクションのサービス一覧。channelType, remoteControlKeyId, serviceId 順。

        サブサービス（ＮＨＫ総合２ 等）も含む全サービスを返す。マルチ編成のない
        サブサービスは番組を持たないため、UI は時間窓内に番組があるサービスだけを
        表示することが期待される（issue #17 の S3）。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"

  /api/programs/search:
    post:
      operationId: searchPrograms
      summary: Search EPG programs by rule-style conditions
      description: |
        ルール条件と同じコンパイラ（internal/rulequery）で epg_programs を検索する。
        ruler 評価と同一の SQL 経路を通る（M2-2）。UI 検索（M2-11）の土台。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramSearchRequest"
      responses:
        "200":
          description: OK（programId の昇順）
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  format: int64
        "400":
          description: Invalid conditions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/programs:
    get:
      operationId: listPrograms
      summary: List EPG programs in a time window
      description: |
        指定した時間窓に**一部でも重なる**番組を start_at 昇順で返す
        （`start_at < end AND end_at > start`）。窓開始前に始まった放送中の番組も含む。

        無限スクロールで窓を継ぎ足す場合、境界をまたぐ番組は隣接する 2 つの窓の
        両方に現れる。クライアントは programId で重複排除すること。

        ページネーショントークンは持たない。時間窓そのものがカーソルであり、
        同じ窓は常に同じ完全な結果を返す。

        レスポンスは一覧向けの軽い形で、extended / video / audios は含まない。
        それらは `GET /api/programs/{programId}` で取得する。
      parameters:
        - name: start
          in: query
          required: true
          description: 時間窓の開始（この時刻より後に終わる番組が対象）
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          required: true
          description: 時間窓の終了（この時刻より前に始まる番組が対象）。start からの幅は最大 7 日
          schema:
            type: string
            format: date-time
        - name: networkId
          in: query
          required: false
          schema:
            type: integer
        - name: serviceId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgramListItem"
        "400":
          description: Invalid time window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/programs/{programId}:
    parameters:
      - name: programId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getProgram
      summary: Get a single EPG program with full detail
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/programs/{programId}/overlaps:
    parameters:
      - name: programId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getProgramOverlaps
      summary: Count reservations overlapping this program's broadcast time
      description: |
        指定番組の放送時間帯（EPG プロジェクションから引く）と半開区間で重なる
        既存予約の件数と内訳を返す（`a.start < b.end AND b.start < a.end`。番組表は
        連続しているため、閉区間で判定すると隣接番組がすべて重なりになってしまう）。

        対象は同じ site の予約のうち、自分自身（同じ programId の予約）を除き、
        `state <> 'orphaned'`、実効オプション（`db.EffectiveOptions`）の `skip` が
        true でないもの。

        **これは重なりの件数だけを返す。チューナー本数との比較や容量超過の判定は
        行わない**（[issue #21](https://github.com/fetburner/rokuban/issues/21) の
        「案 C」、docs/data.md §6.5 が扱う M2-10 の領分）。`count` が 0 より大きくても
        「録画できない」とは限らず（同一物理チャンネルなら 1 本のチューナーで
        複数番組を賄える）、逆に `count` が 0 でも他サイトや mirakc の他の消費者
        （並走 EPGStation・ライブ視聴・EPG 収集）の存在は考慮されていない。
        呼び出し側は件数を「事実」として提示し、勝敗や可否を断定してはならない。

        番組が EPG プロジェクションに無ければ 404。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramOverlaps"
        "404":
          description: Program not found in EPG projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/recordings:
    get:
      operationId: listRecordings
      summary: List recordings
      description: |
        録画履歴。program_start_at の降順。ドロップ統計は PID 別の合計のみを含む。
        PID 別の内訳は `GET /api/recordings/{id}/drop-stats` で取得する。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recording"

  /api/recordings/{id}/drop-stats:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: listRecordingDropStats
      summary: Get per-PID drop statistics for a recording
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DropStat"

  /api/breakers:
    get:
      operationId: listCircuitBreakers
      summary: List tripped circuit breakers
      description: |
        大量削除サーキットブレーカー（docs/recording.md §3.2）の発動状態。
        **行の存在 = 発動中**なので、発動していないブレーカーは結果に現れない
        （すべて停止していなければ空配列）。

        `detail` は発動時に「何が消されようとしていたか」を説明する抜粋で、
        手動確認の材料（`internal/breaker.Sample` と同じ形。最大 20 件）。

        site はパスに含めない。M1/M2 は単一サイト構成（`db.DefaultSite`）で、
        将来の多拠点対応でパスに site を加える可能性がある。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CircuitBreaker"

  /api/breakers/{name}/resume:
    parameters:
      - name: name
        in: path
        required: true
        description: |
          ブレーカー識別子（`internal/breaker` の定数。`ruler_deletes` /
          `reconcile_total_loss`）。未知の値は 400。
        schema:
          type: string
    post:
      operationId: resumeCircuitBreaker
      summary: Resume a tripped circuit breaker (manual acknowledgement)
      description: |
        手動確認後の再開。ブレーカーは人間が確認するまで止まり続けるラッチ
        （docs/recording.md §3.2）なので、確認が済んだことをこの API で明示する。

        `DELETE /api/breakers/{name}` にしていないのは、運用者から見た操作が
        「行を削除する」ではなく「**確認したので再開する**」であるため。DB の行が
        消えるのは実装詳細（`internal/breaker` のラッチが行の存在で表される、という
        設計の帰結）であり、URL に出す概念ではない。

        site はパスに含めない（`GET /api/breakers` と同じ理由。将来の多拠点対応で
        パスに site を加える可能性がある）。
      responses:
        "204":
          description: Resumed
        "400":
          description: Unknown breaker name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not tripped (nothing to resume)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    VersionResponse:
      type: object
      required:
        - version
      properties:
        version:
          type: string
          example: 0.0.1

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string

    Service:
      type: object
      required:
        - networkId
        - serviceId
        - name
        - channelType
        - channel
        - remoteControlKeyId
        - hasLogoData
      properties:
        networkId:
          type: integer
        serviceId:
          type: integer
        name:
          type: string
        channelType:
          type: string
          enum: [GR, BS, CS, SKY]
        channel:
          type: string
        remoteControlKeyId:
          type: integer
        hasLogoData:
          type: boolean

    # 一覧向けの軽い形。extended / video / audios は含まない（転送量のため）。
    ProgramListItem:
      type: object
      required:
        - programId
        - networkId
        - serviceId
        - eventId
        - startAt
        - endAt
        - durationMs
        - name
        - description
        - genres
        - isFree
      properties:
        programId:
          type: integer
          format: int64
        networkId:
          type: integer
        serviceId:
          type: integer
        eventId:
          type: integer
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        genres:
          description: ジャンル絞り込み用の lv1 のみ。詳細は Program.genreDetails
          type: array
          items:
            type: integer
        isFree:
          type: boolean

    # 詳細。ProgramListItem に UI 完全形のペイロードを足したもの。
    Program:
      allOf:
        - $ref: "#/components/schemas/ProgramListItem"
        - type: object
          properties:
            extended:
              description: 拡張形式イベント（出演者等）
              type: object
              additionalProperties:
                type: string
            genreDetails:
              type: array
              items:
                $ref: "#/components/schemas/Genre"
            video:
              $ref: "#/components/schemas/VideoInfo"
            audios:
              type: array
              items:
                $ref: "#/components/schemas/AudioInfo"

    Genre:
      type: object
      required: [lv1, lv2]
      properties:
        lv1:
          type: integer
        lv2:
          type: integer
        un1:
          type: integer
        un2:
          type: integer

    VideoInfo:
      type: object
      properties:
        type:
          type: string
        resolution:
          type: string
        streamContent:
          type: integer
        componentType:
          type: integer

    AudioInfo:
      type: object
      required: [componentType, isMain, samplingRate]
      properties:
        componentType:
          type: integer
        isMain:
          type: boolean
        samplingRate:
          type: integer
        langs:
          type: array
          items:
            type: string

    Recording:
      type: object
      required:
        - id
        - source
        - serviceName
        - channelType
        - channel
        - networkId
        - serviceId
        - eventId
        - title
        - startAt
        - durationMs
        - status
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        reservationId:
          type: integer
          format: int64
        ruleId:
          type: integer
          format: int64
        source:
          type: string
          enum: [rule, manual]
        serviceName:
          type: string
        channelType:
          type: string
          enum: [GR, BS, CS, SKY]
        channel:
          type: string
        networkId:
          type: integer
        serviceId:
          type: integer
        eventId:
          type: integer
        title:
          type: string
        description:
          type: string
        startAt:
          description: 番組の放送開始時刻
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
        status:
          type: string
          enum: [recording, finished, failed]
        startedAt:
          description: 録画の実開始時刻
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        sizeBytes:
          description: 原本の実サイズ。ingest 済み（media_assets 行あり）の場合のみ
          type: integer
          format: int64
        dropSummary:
          $ref: "#/components/schemas/DropSummary"
        qualityEvents:
          description: recording.failed / record-broken / bcas_anomaly の履歴
          type: array
          items:
            type: object
        createdAt:
          type: string
          format: date-time

    # PID 別 drop_stats の合計。内訳は /api/recordings/{id}/drop-stats。
    DropSummary:
      type: object
      required: [packets, drops, errors, scrambled]
      properties:
        packets:
          type: integer
          format: int64
        drops:
          type: integer
          format: int64
        errors:
          type: integer
          format: int64
        scrambled:
          type: integer
          format: int64

    DropStat:
      type: object
      required: [pid, packets, drops, errors, scrambled]
      properties:
        pid:
          type: integer
        packets:
          type: integer
          format: int64
        drops:
          type: integer
          format: int64
        errors:
          type: integer
          format: int64
        scrambled:
          type: integer
          format: int64

    CreateReservationRequest:
      type: object
      required:
        - programId
        - title
        - startAt
        - durationMs
      properties:
        programId:
          type: integer
          format: int64
        title:
          type: string
        startAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
        priority:
          type: integer

    # --- Reservation overrides (M2-4) ---

    ReservationOverridesInput:
      type: object
      description: |
        PATCH /api/reservations/{id} のボディ。値を書いたフィールドは override
        を設定し、`reset` に名前を挙げたフィールドは override を削除する。
        どちらにも現れないフィールドは変更しない。同じフィールドを値と
        `reset` の両方に書いたら 400、`reset` に未知のフィールド名があっても
        400（docs/recording.md §4.2）。
      properties:
        priority:
          type: integer
          description: |
            mirakc の schedule に反映される（reconciler が DELETE + POST で
            schedule を再作成する）。ただし録画開始後の recorder には
            効かない可能性が高い（docs/recording.md §4.5）。
        contentPath:
          type: string
          description: |
            既存の schedule には反映されない。churn を避けるため差分対象外で、
            初回生成値に固定されるため（docs/recording.md §3.2）。まだ
            schedule が作られていない予約にだけ効く（docs/recording.md §4.5）。
        filenameTemplate:
          type: string
          description: |
            Go text/template のテンプレート文字列。既存の schedule には
            反映されず、まだ schedule が作られていない予約にだけ効く
            （docs/recording.md §4.5）。
        keepOriginal:
          type: string
          enum: [always, until_encoded]
          description: |
            ingest 時に評価されるので、録画開始後の変更でも効く
            （M3 で消費。docs/recording.md §4.5）。
        encodeProfiles:
          type: array
          items:
            type: string
          description: |
            ingest 時に評価されるので、録画開始後の変更でも効く
            （M3 で消費。docs/recording.md §4.5）。
        reset:
          type: array
          items:
            type: string
            enum:
              - priority
              - contentPath
              - filenameTemplate
              - keepOriginal
              - encodeProfiles
          description: |
            指定したフィールドの override を削除する（フィールド単位の
            「ルールに戻す」）。値を書いたフィールドと重複して指定すると 400。

    # --- Program search (M2-2) — 条件形はルールと共有 ---

    ProgramSearchRequest:
      type: object
      description: |
        ルール条件の条件部分と同じ形。rulequery.Conditions に写像される。
        site は省略時 default（現状単一サイト）。
      properties:
        site:
          type: string
        isFree:
          type: boolean
          nullable: true
        durationMinMs:
          type: integer
          format: int64
          nullable: true
        durationMaxMs:
          type: integer
          format: int64
          nullable: true
        periodStartAt:
          type: string
          format: date-time
          nullable: true
        periodEndAt:
          type: string
          format: date-time
          nullable: true
        textMatches:
          type: array
          items:
            $ref: "#/components/schemas/RuleTextMatch"
        services:
          type: array
          items:
            $ref: "#/components/schemas/RuleService"
        channelTypes:
          type: array
          items:
            type: string
            enum: [GR, BS, CS, SKY]
        genres:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 15
        times:
          type: array
          items:
            $ref: "#/components/schemas/RuleTimeWindow"
        sites:
          type: array
          items:
            type: string
          description: ルールの rule_sites 相当。空 = 評価 site のみ

    # --- Rules (M2-1) ---

    RuleTextMatch:
      type: object
      required: [target, mode, value]
      properties:
        target:
          type: string
          enum: [name, description, extended]
        mode:
          type: string
          enum: [keyword, regex]
          description: keyword = 部分一致 / regex = POSIX ARE
        value:
          type: string
        caseSensitive:
          type: boolean
          default: false
        negate:
          type: boolean
          default: false
          description: true なら除外条件

    RuleService:
      type: object
      required: [networkId, serviceId]
      properties:
        networkId:
          type: integer
        serviceId:
          type: integer

    RuleTimeWindow:
      type: object
      required: [weekdays, startSec, endSec]
      properties:
        weekdays:
          type: integer
          minimum: 1
          maximum: 127
          description: bit0=月 … bit6=日
        startSec:
          type: integer
          minimum: 0
          maximum: 86400
        endSec:
          type: integer
          minimum: 0
          maximum: 86400
          description: start より小さい場合は翌日跨ぎ

    RuleInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
          default: true
        priority:
          type: integer
          default: 10
        isFree:
          type: boolean
          nullable: true
          description: null = 問わない
        durationMinMs:
          type: integer
          format: int64
          nullable: true
        durationMaxMs:
          type: integer
          format: int64
          nullable: true
        periodStartAt:
          type: string
          format: date-time
          nullable: true
        periodEndAt:
          type: string
          format: date-time
          nullable: true
        textMatches:
          type: array
          items:
            $ref: "#/components/schemas/RuleTextMatch"
        services:
          type: array
          items:
            $ref: "#/components/schemas/RuleService"
        channelTypes:
          type: array
          items:
            type: string
            enum: [GR, BS, CS, SKY]
        genres:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 15
          description: genre lv1
        times:
          type: array
          items:
            $ref: "#/components/schemas/RuleTimeWindow"
        sites:
          type: array
          items:
            type: string
          description: 空または省略 = 全サイト
        dedupeEnabled:
          type: boolean
          default: false
        dedupeThreshold:
          type: number
          format: float
          nullable: true
        dedupeWindowSeconds:
          type: integer
          format: int64
          nullable: true
          description: 重複排除の時間窓（秒）。interval の API 表現
        keepOriginal:
          type: string
          enum: [always, until_encoded]
          default: always
        encodeProfiles:
          type: array
          items:
            type: string
        filenameTemplate:
          type: string
        metadata:
          type: object
          additionalProperties: true

    Rule:
      allOf:
        - $ref: "#/components/schemas/RuleInput"
        - type: object
          required: [id, name, enabled, priority, keepOriginal, createdAt, updatedAt]
          properties:
            id:
              type: integer
              format: int64
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    DeleteRuleResponse:
      type: object
      required: [id, deletedReservations, detachedReservations]
      properties:
        id:
          type: integer
          format: int64
        deletedReservations:
          type: integer
          description: overrides なしで削除した rule 予約の件数
        detachedReservations:
          type: integer
          description: overrides 付きで detached 化した件数

    Reservation:
      type: object
      required:
        - id
        - programId
        - source
        - state
        - title
        - startAt
        - durationMs
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
        programId:
          type: integer
          format: int64
        source:
          type: string
          enum: [rule, manual]
        ruleId:
          type: integer
          format: int64
        state:
          type: string
          enum: [active, detached, orphaned]
        overrides:
          type: object
        title:
          type: string
        startAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # --- 予約の重なり警告 (M2-8, issue #24 / #21) ---
    #
    # チューナー本数を見ない「案 C」。件数と内訳だけを返し、勝敗・可否は主張しない
    # （断定は M2-10 の tuner_sync 射影 + 容量判定の領分。docs/data.md §6.5）。

    ProgramOverlaps:
      type: object
      required:
        - count
        - reservations
      properties:
        count:
          description: 重なっている既存予約の件数（自分自身を除く）
          type: integer
        reservations:
          description: 内訳。件数だけでなく何と重なっているかをユーザーが判断できるようにする
          type: array
          items:
            $ref: "#/components/schemas/OverlappingReservation"

    OverlappingReservation:
      type: object
      required:
        - id
        - programId
        - title
        - startAt
        - durationMs
      properties:
        id:
          type: integer
          format: int64
        programId:
          type: integer
          format: int64
        title:
          type: string
        startAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64

    # --- Circuit breakers (M2-5) ---

    CircuitBreaker:
      type: object
      description: |
        発動中の大量削除サーキットブレーカー 1 件（`circuit_breakers` 行 = 発動中。
        docs/recording.md §3.2）。
      required:
        - site
        - name
        - trippedAt
        - pending
        - threshold
        - detail
      properties:
        site:
          type: string
        name:
          type: string
          enum: [ruler_deletes, reconcile_total_loss]
          description: internal/breaker の定数（RulerDeletes / ReconcileTotalLoss）。
        trippedAt:
          type: string
          format: date-time
          description: |
            発動した時刻（最初の発動時刻。再発動で更新されるのは pending /
            threshold / detail のみ）。
        pending:
          type: integer
          description: 発動時に止めた削除の件数。
        threshold:
          type: integer
          description: 発動時の閾値。
        detail:
          $ref: "#/components/schemas/CircuitBreakerSample"

    CircuitBreakerSample:
      type: object
      description: |
        発動時に「何が消されようとしていたか」を説明する抜粋
        （`internal/breaker.Sample` と同じ形。手動確認の材料）。
      required:
        - total
      properties:
        total:
          type: integer
          description: 止めた削除の総数。
        programs:
          type: array
          description: 先頭いくつかの抜粋（`internal/breaker.MaxSampleSize` 件まで）。
          items:
            $ref: "#/components/schemas/CircuitBreakerSampleProgram"

    CircuitBreakerSampleProgram:
      type: object
      required:
        - programId
      properties:
        programId:
          type: integer
          format: int64
        title:
          type: string
