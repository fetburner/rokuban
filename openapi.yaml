openapi: "3.1.0"
info:
  title: Rokuban API
  version: 0.0.1
  description: Cloud-native recording server API

paths:
  /healthz:
    get:
      operationId: healthz
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/version:
    get:
      operationId: getVersion
      summary: Get server version
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /api/encode-profiles:
    get:
      operationId: listEncodeProfiles
      summary: List configured encode profile names
      description: |
        `config.encode.profiles` に定義されたプロファイルの公開面。UI が
        ルール / overrides の `encodeProfiles` を選ぶために使う（M3-6 / issue #68）。

        **機微情報は載せない。** ffmpeg のパスや extra_args は出さない。
        名前（と表示用の container）だけを返す。
      responses:
        "200":
          description: OK（設定順。未定義なら空配列）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EncodeProfileSummary"

  /api/rules:
    get:
      operationId: listRules
      summary: List recording rules
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rule"
    post:
      operationId: createRule
      summary: Create a recording rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400":
          description: Invalid input (e.g. unsupported regex)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/rules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getRule
      summary: Get a recording rule
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateRule
      summary: Update a recording rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteRule
      summary: Delete a recording rule
      description: |
        導出予約の整理を伴う。overrides のない rule 予約は削除し、
        overrides 付きは detached 化して生き残る（recording.md §4.3）。
        応答に影響内訳を載せる。
      responses:
        "200":
          description: Deleted (with impact summary)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteRuleResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reservations:
    get:
      operationId: listReservations
      summary: List reservations
      description: |
        導出結果の読み取り専用ビュー（issue #29）。書き込みは
        `PUT/DELETE /api/sites/{site}/programs/{programId}/intent` と
        `PATCH/DELETE /api/sites/{site}/programs/{programId}/overrides` で行う
        —— `reservations` の書き手は ruler だけであり、api はここを一切書かない。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"

  /api/reservations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getReservation
      summary: Get a reservation
      description: |
        `reservations.id` は ruler の導出削除・再実体化で変わりうる（寿命が
        保証されていない。issue #29）。読み取りには使えるが、書き込みの宛先には
        使わない —— 意図・上書きは `(site, programId)` を自身のキーとする別の
        エンドポイントに書く。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/sites/{site}/services:
    parameters:
      - $ref: "#/components/parameters/Site"
    get:
      operationId: listServices
      summary: List EPG services (channels)
      description: |
        EPG プロジェクションのサービス一覧。channelType, remoteControlKeyId, serviceId 順。

        サブサービス（ＮＨＫ総合２ 等）も含む全サービスを返す。マルチ編成のない
        サブサービスは番組を持たないため、UI は時間窓内に番組があるサービスだけを
        表示することが期待される（issue #17 の S3）。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
        "404":
          description: Unknown site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/sites/{site}/programs/search:
    parameters:
      - $ref: "#/components/parameters/Site"
    post:
      operationId: searchPrograms
      summary: Search EPG programs by rule-style conditions
      description: |
        ルール条件と同じコンパイラ（internal/rulequery）で epg_programs を検索する。
        ruler 評価と同一の SQL 経路を通る（M2-2）。UI 検索（M2-11）の土台。
        検索対象のサイトはパスの {site}（評価 site）。`sites` フィールドは
        ルールの `rule_sites` 相当の条件（マッチ対象の絞り込み）で、これとは別軸。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramSearchRequest"
      responses:
        "200":
          description: OK（programId の昇順）
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  format: int64
        "400":
          description: Invalid conditions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/sites/{site}/programs:
    parameters:
      - $ref: "#/components/parameters/Site"
    get:
      operationId: listPrograms
      summary: List EPG programs in a time window
      description: |
        指定した時間窓に**一部でも重なる**番組を start_at 昇順で返す
        （`start_at < end AND end_at > start`）。窓開始前に始まった放送中の番組も含む。

        無限スクロールで窓を継ぎ足す場合、境界をまたぐ番組は隣接する 2 つの窓の
        両方に現れる。クライアントは programId で重複排除すること。

        ページネーショントークンは持たない。時間窓そのものがカーソルであり、
        同じ窓は常に同じ完全な結果を返す。

        レスポンスは一覧向けの軽い形で、extended / video / audios は含まない。
        それらは `GET /api/sites/{site}/programs/{programId}` で取得する。
      parameters:
        - name: start
          in: query
          required: true
          description: 時間窓の開始（この時刻より後に終わる番組が対象）
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          required: true
          description: 時間窓の終了（この時刻より前に始まる番組が対象）。start からの幅は最大 7 日
          schema:
            type: string
            format: date-time
        - name: networkId
          in: query
          required: false
          schema:
            type: integer
        - name: serviceId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgramListItem"
        "400":
          description: Invalid time window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/sites/{site}/programs/{programId}:
    parameters:
      - $ref: "#/components/parameters/Site"
      - $ref: "#/components/parameters/ProgramId"
    get:
      operationId: getProgram
      summary: Get a single EPG program with full detail
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/sites/{site}/programs/{programId}/overlaps:
    parameters:
      - $ref: "#/components/parameters/Site"
      - $ref: "#/components/parameters/ProgramId"
    get:
      operationId: getProgramOverlaps
      summary: Count reservations overlapping this program's broadcast time
      description: |
        指定番組の放送時間帯（EPG プロジェクションから引く）と半開区間で重なる
        既存予約の件数と内訳を返す（`a.start < b.end AND b.start < a.end`。番組表は
        連続しているため、閉区間で判定すると隣接番組がすべて重なりになってしまう）。

        対象は同じ site の予約のうち、自分自身（同じ programId の予約）を除き、
        `state <> 'orphaned'`、実効オプション（`db.EffectiveOptions`）の `skip` が
        true でないもの。

        **これは重なりの件数だけを返す。チューナー本数との比較や容量超過の判定は
        行わない**（[issue #21](https://github.com/fetburner/rokuban/issues/21) の
        「案 C」、docs/data.md §6.5 が扱う M2-10 の領分）。`count` が 0 より大きくても
        「録画できない」とは限らず（同一物理チャンネルなら 1 本のチューナーで
        複数番組を賄える）、逆に `count` が 0 でも他サイトや mirakc の他の消費者
        （並走 EPGStation・ライブ視聴・EPG 収集）の存在は考慮されていない。
        呼び出し側は件数を「事実」として提示し、勝敗や可否を断定してはならない。

        番組が EPG プロジェクションに無ければ 404。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramOverlaps"
        "404":
          description: Program not found in the EPG projection, or unknown site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/sites/{site}/programs/{programId}/intent:
    parameters:
      - $ref: "#/components/parameters/Site"
      - $ref: "#/components/parameters/ProgramId"
    put:
      operationId: putProgramIntent
      summary: Assert record/skip intent for a program
      description: |
        ユーザー意図（`program_intents`）を `(site, programId)` を自身のキーとして
        書く（issue #29）。導出行（`reservations`）の有無に依存しないので、
        `base.skip` が立っている番組にも `action=record` を立てられる
        （旧 `POST /api/reservations` は導出行が「無い」ときしか書けなかった）。

        意図だけを書き、`reservations` は同一トランザクションで作らない
        （`reservations` の書き手は ruler だけにする。issue #29 の決定）。
        `insertRulerPassHint` で ruler_pass を即座に投入するので、実体化は
        秒オーダー。フロントエンドは楽観更新で一覧に即時反映する。

        番組が EPG プロジェクションに無ければ 400。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramIntentInput"
      responses:
        "204":
          description: Recorded
        "400":
          description: Program not found in the EPG projection, or invalid action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProgramIntent
      summary: Clear intent for a program (defer to the rule)
      description: |
        `program_intents` の行を削除するだけ（意見なし。純粋にルール由来へ戻す）。
        取消（「録るな」の明示的な主張）は `PUT .../intent {action: skip}`。
        こちらは「何も主張しない」状態に戻す操作で、`program_overrides` には
        一切触れない（別表・別軸。issue #29）。冪等（行が無くても 204）。
      responses:
        "204":
          description: Cleared
        "400":
          description: Unknown site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/sites/{site}/programs/{programId}/overrides:
    parameters:
      - $ref: "#/components/parameters/Site"
      - $ref: "#/components/parameters/ProgramId"
    patch:
      operationId: patchProgramOverrides
      summary: Update per-program overrides
      description: |
        値を書いたフィールドはそのフィールドの override を設定する。`reset`
        配列に名前を挙げたフィールドは override を削除する（フィールド単位の
        「ルールに戻す」）。どちらにも現れないフィールドは変更しない。

        `null` で消す形にはしない（`*T` は「キーが無い」と `null` を区別できず、
        「消す」が「変更しない」に化けて黙って壊れるため。
        docs/recording.md §4.2「overrides API の形」）。

        同じフィールドを値と `reset` の両方に書いたら 400（意図が不明なので
        推測しない）。`reset` に未知のフィールド名があっても 400。

        `skip` は overrides のキーではない（`program_intents.action` が担う）ので
        ここでは扱わない。取消は `PUT .../intent {action: skip}`。

        `(site, programId)` を自身のキーとして `program_overrides` を書く
        （issue #29）。導出行（`reservations`）の有無には依存しない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramOverridesInput"
      responses:
        "204":
          description: Updated
        "400":
          description: Invalid input, or program not found in the EPG projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProgramOverrides
      summary: Reset all overrides for a program (revert to rule)
      description: |
        `program_overrides` の行を削除するだけ。`action`（record/skip。
        `program_intents` 側）は触らない（別表・別軸。docs/recording.md §4.2
        「overrides は program_intents とは別の表に置く」）。冪等（行が無くても 204）。
      responses:
        "204":
          description: Cleared
        "400":
          description: Unknown site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/recordings:
    get:
      operationId: listRecordings
      summary: List recordings
      description: |
        録画履歴。program_start_at の降順。ドロップ統計は PID 別の合計のみを含む。
        PID 別の内訳は `GET /api/recordings/{id}/drop-stats` で取得する。

        既定は生きている録画（`deleted_at IS NULL`）のみ。`trash=true` でごみ箱
        （`deleted_at IS NOT NULL`）を返す。物理削除済み tombstone もここに残るが、
        ファイルは既に無いことがある（M3-8）。
      parameters:
        - name: trash
          in: query
          required: false
          description: true のときごみ箱（論理削除済み）を返す
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recording"

  /api/recordings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    delete:
      operationId: deleteRecording
      summary: Soft-delete a recording (move to trash)
      description: |
        論理削除。`recordings.deleted_at = now()` を立てるだけ。ファイルには触れない
        （docs/storage.md「ごみ箱 = 論理削除」）。既に削除済みなら冪等に 204。
        行が無ければ 404。
      responses:
        "204":
          description: Soft-deleted (or already in trash)
        "404":
          description: Recording not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/recordings/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: restoreRecording
      summary: Restore a soft-deleted recording from trash
      description: |
        `deleted_at` と `purge_after` を消すだけ（ファイル操作ゼロ・即時）。
        ごみ箱に入っていない、または行が無い場合は 404。
        同一イベントに生きている録画があると partial unique index で衝突し 409。
      responses:
        "204":
          description: Restored
        "404":
          description: Not in trash / not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Active recording already exists for the same event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/recordings/{id}/purge:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: purgeRecording
      summary: Mark a recording for immediate physical purge
      description: |
        即時物理削除の要求印。`purge_after = now()` を立て、未 soft-delete なら
        `deleted_at` も同時に立てる。**ファイルは消さない**（M3-8 の削除 reconcile
        がこの印を拾って unlink する）。既に印が付いていても冪等に 204。
      responses:
        "204":
          description: Marked for purge
        "404":
          description: Recording not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/recordings/{id}/drop-stats:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: listRecordingDropStats
      summary: Get per-PID drop statistics for a recording
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DropStat"

  /api/capacity/overages:
    get:
      operationId: listCapacityOverages
      summary: List intervals where tuner capacity is exceeded
      description: |
        チューナーが不足している**区間**を結合済みで返す（M2-10、issue #21 /
        docs/data.md §6.5）。

        **主張は下界に限る。** 「この区間は超過している」は確実だが、返らなかった
        区間が「収まる」ことは保証しない。Rokuban から見えない消費者（並走する
        EPGStation・ライブ視聴・EPG 収集ジョブ）がいるうえ、mirakc の
        `excluded_channels` は `/api/tuners` に載らないため、既知の盲点はすべて
        「警告を見逃す」方向に偏っている。**沈黙を「大丈夫」と読ませてはならない。**

        返すのは区間の性質だけで、**どの番組が負けるかは主張しない**。勝敗を決めるのは
        mirakc であり、Rokuban には見えない消費者がいるので予測できない。UI の文言も
        「この予約は競合しています」ではなく「この時間帯はチューナーが不足しています」。

        需要の単位は予約件数ではなく**異なる物理チャンネル数**（同一物理チャンネルなら
        1 本のチューナーに相乗りできる。副産物としてマルチ編成のサブサービスが
        自然に畳まれる）。数えるのは reconciler が実際に schedule を作る予約だけで、
        `effective.skip` が true の行と `state = 'orphaned'` の行は需要にならない。

        判定は種別部分集合に縮約した Hall 条件（`∀A ⊆ {GR,BS,CS,SKY}:
        Σ_{t∈A} d[t] ≤ cap(A)`）。破れた `A` から不足本数と詰まった種別が
        副産物として出るので、`shortfall` / `jammedTypes` で「BS が 1 本不足」まで言える。
      parameters:
        - name: start
          in: query
          required: true
          description: 時間窓の開始（この時刻より後に終わる区間が対象）
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          required: true
          description: 時間窓の終了（この時刻より前に始まる区間が対象）
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CapacityOverage"
        "400":
          description: 時間窓が不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/breakers:
    get:
      operationId: listCircuitBreakers
      summary: List tripped circuit breakers
      description: |
        大量削除サーキットブレーカー（docs/recording.md §3.2）の発動状態。
        **行の存在 = 発動中**なので、発動していないブレーカーは結果に現れない
        （すべて停止していなければ空配列）。

        `detail` は発動時に「何が消されようとしていたか」を説明する抜粋で、
        手動確認の材料（`internal/breaker.Sample` と同じ形。最大 20 件）。

        site はパスに含めない。M1/M2 は単一サイト構成（`db.DefaultSite`）で、
        将来の多拠点対応でパスに site を加える可能性がある。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CircuitBreaker"

  /api/breakers/{name}/resume:
    parameters:
      - name: name
        in: path
        required: true
        description: |
          ブレーカー識別子（`internal/breaker` の定数。`ruler_deletes` /
          `reconcile_total_loss`）。未知の値は 400。
        schema:
          type: string
    post:
      operationId: resumeCircuitBreaker
      summary: Resume a tripped circuit breaker (manual acknowledgement)
      description: |
        手動確認後の再開。ブレーカーは人間が確認するまで止まり続けるラッチ
        （docs/recording.md §3.2）なので、確認が済んだことをこの API で明示する。

        `DELETE /api/breakers/{name}` にしていないのは、運用者から見た操作が
        「行を削除する」ではなく「**確認したので再開する**」であるため。DB の行が
        消えるのは実装詳細（`internal/breaker` のラッチが行の存在で表される、という
        設計の帰結）であり、URL に出す概念ではない。

        site はパスに含めない（`GET /api/breakers` と同じ理由。将来の多拠点対応で
        パスに site を加える可能性がある）。
      responses:
        "204":
          description: Resumed
        "400":
          description: Unknown breaker name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not tripped (nothing to resume)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    Site:
      name: site
      in: path
      required: true
      description: |
        mirakc インスタンスのサイト名（config.mirakc.site）。programId は
        インスタンス単位のスコープしか持たないため、この site と組にしないと
        資源が一意に定まらない（issue #31）。設定と一致しない site は 404。
      schema:
        type: string
    ProgramId:
      name: programId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    VersionResponse:
      type: object
      required:
        - version
      properties:
        version:
          type: string
          example: 0.0.1

    # --- Encode profiles (M3-6 / issue #68) ---
    #
    # config.encode.profiles の公開面。ffmpeg パスや extra_args は出さない。
    EncodeProfileSummary:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: |
            ルール / overrides の `encodeProfiles` が参照する名前。
            config.encode.profiles[].name と一致する。
        container:
          type: string
          enum: [mp4, mkv]
          description: |
            出力コンテナ（表示用。未注入なら省略）。

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string

    Service:
      type: object
      required:
        - networkId
        - serviceId
        - name
        - channelType
        - channel
        - remoteControlKeyId
        - hasLogoData
      properties:
        networkId:
          type: integer
        serviceId:
          type: integer
        name:
          type: string
        channelType:
          type: string
          enum: [GR, BS, CS, SKY]
        channel:
          type: string
        remoteControlKeyId:
          type: integer
        hasLogoData:
          type: boolean

    # 一覧向けの軽い形。extended / video / audios は含まない（転送量のため）。
    ProgramListItem:
      type: object
      required:
        - programId
        - networkId
        - serviceId
        - eventId
        - startAt
        - endAt
        - durationMs
        - name
        - description
        - genres
        - isFree
      properties:
        programId:
          type: integer
          format: int64
        networkId:
          type: integer
        serviceId:
          type: integer
        eventId:
          type: integer
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        genres:
          description: ジャンル絞り込み用の lv1 のみ。詳細は Program.genreDetails
          type: array
          items:
            type: integer
        isFree:
          type: boolean

    # 詳細。ProgramListItem に UI 完全形のペイロードを足したもの。
    Program:
      allOf:
        - $ref: "#/components/schemas/ProgramListItem"
        - type: object
          properties:
            extended:
              description: 拡張形式イベント（出演者等）
              type: object
              additionalProperties:
                type: string
            genreDetails:
              type: array
              items:
                $ref: "#/components/schemas/Genre"
            video:
              $ref: "#/components/schemas/VideoInfo"
            audios:
              type: array
              items:
                $ref: "#/components/schemas/AudioInfo"

    Genre:
      type: object
      required: [lv1, lv2]
      properties:
        lv1:
          type: integer
        lv2:
          type: integer
        un1:
          type: integer
        un2:
          type: integer

    VideoInfo:
      type: object
      properties:
        type:
          type: string
        resolution:
          type: string
        streamContent:
          type: integer
        componentType:
          type: integer

    AudioInfo:
      type: object
      required: [componentType, isMain, samplingRate]
      properties:
        componentType:
          type: integer
        isMain:
          type: boolean
        samplingRate:
          type: integer
        langs:
          type: array
          items:
            type: string

    Recording:
      type: object
      required:
        - id
        - source
        - serviceName
        - channelType
        - channel
        - networkId
        - serviceId
        - eventId
        - title
        - startAt
        - durationMs
        - status
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        reservationId:
          type: integer
          format: int64
        ruleId:
          type: integer
          format: int64
        source:
          type: string
          enum: [rule, manual]
        serviceName:
          type: string
        channelType:
          type: string
          enum: [GR, BS, CS, SKY]
        channel:
          type: string
        networkId:
          type: integer
        serviceId:
          type: integer
        eventId:
          type: integer
        title:
          type: string
        description:
          type: string
        startAt:
          description: 番組の放送開始時刻
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
        status:
          type: string
          enum: [recording, finished, failed]
        startedAt:
          description: 録画の実開始時刻
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        sizeBytes:
          description: 原本の実サイズ。ingest 済み（media_assets 行あり）の場合のみ
          type: integer
          format: int64
        encodedProfiles:
          description: |
            再生可能な encoded 派生物のプロファイル名（media_assets の active のみ）。
            ブラウザ再生は GET /api/recordings/{id}/file?profile=<name> を使う。
            desired（encode_profiles）ではなく observed。空配列は省略可。
          type: array
          items:
            type: string
        dropSummary:
          $ref: "#/components/schemas/DropSummary"
        qualityEvents:
          description: recording.failed / record-broken / bcas_anomaly の履歴
          type: array
          items:
            type: object
        deletedAt:
          description: |
            論理削除時刻。ごみ箱一覧（`trash=true`）でのみ出現する。
            通常一覧では省略（生きている行は NULL）。
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    # PID 別 drop_stats の合計。内訳は /api/recordings/{id}/drop-stats。
    DropSummary:
      type: object
      required: [packets, drops, errors, scrambled]
      properties:
        packets:
          type: integer
          format: int64
        drops:
          type: integer
          format: int64
        errors:
          type: integer
          format: int64
        scrambled:
          type: integer
          format: int64

    # --- チューナー容量超過 (M2-10, issue #21 / docs/data.md §6.5) ---
    #
    # 区間の性質だけを返す。どの番組・どの予約が負けるかは主張しない。
    CapacityOverage:
      type: object
      required: [site, startAt, endAt, shortfall, jammedTypes]
      properties:
        site:
          description: |
            判定はサイトごとに独立して行う。N 予約の決定（docs/recording.md §3.1）に
            より予約が site に束縛されるため二部グラフがサイトごとに非連結になり、
            Hall の条件を成分ごとに確認すれば十分になる。
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        shortfall:
          description: |
            不足本数。破れた種別部分集合 A の `Σ_{t∈A} d[t] − cap(A)` の最大値。
            1 以上（0 なら超過していないので区間そのものが返らない）
          type: integer
        jammedTypes:
          description: 詰まった種別（Hall 条件を破った部分集合 A）。「BS が 1 本不足」と言うための材料
          type: array
          items:
            type: string
            enum: [GR, BS, CS, SKY]

    DropStat:
      type: object
      required: [pid, packets, drops, errors, scrambled]
      properties:
        pid:
          type: integer
        packets:
          type: integer
          format: int64
        drops:
          type: integer
          format: int64
        errors:
          type: integer
          format: int64
        scrambled:
          type: integer
          format: int64
        pidType:
          description: |
            PID 種別（M2-13, issue #24）。**値はすべて小文字**で、権威は Go 側の定数
            （`internal/tsstat`）。enum にしないのは分類の追加をスキーマ変更なしで
            できるようにするため（`drop_stats.pid_type` に CHECK を置かないのと同じ理由）。

            - `video` / `audio` --- PMT の stream_type から分類した ES
            - `other` --- PMT に載っているが映像でも音声でもない ES（字幕・文字スーパー・
              データ放送はすべてここ。記述子を読まないため字幕と文字スーパーは区別しない）
            - `pat` / `cat` / `nit` / `sdt` / `eit` / `tot` --- 固定 PID（静的表。解析不要）
            - `pmt` --- PAT が PMT の在り処として指した PID

            **分類できなければ省略する**（PSI 解析の失敗は ingest を失敗させない。
            docs/recording.md「例外の境界」）。省略は「分類しなかった」であって
            「該当なし」ではない
          type: string

    # --- Program intent (issue #29) ---

    ProgramIntentInput:
      type: object
      description: |
        PUT /api/sites/{site}/programs/{programId}/intent のボディ。
        `record` は「録れ」（手動予約、およびルール由来予約への上書き）。
        `skip` は「録るな」（どのルール経由でも一貫して除外される）。
      required:
        - action
      properties:
        action:
          type: string
          enum: [record, skip]

    # --- Program overrides (M2-4 / issue #29) ---

    ProgramOverridesInput:
      type: object
      description: |
        PATCH /api/sites/{site}/programs/{programId}/overrides のボディ。
        値を書いたフィールドは override を設定し、`reset` に名前を挙げた
        フィールドは override を削除する。どちらにも現れないフィールドは
        変更しない。同じフィールドを値と `reset` の両方に書いたら 400、
        `reset` に未知のフィールド名があっても 400（docs/recording.md §4.2）。
      properties:
        priority:
          type: integer
          description: |
            mirakc の schedule に反映される（reconciler が DELETE + POST で
            schedule を再作成する）。ただし録画開始後の recorder には
            効かない可能性が高い（docs/recording.md §4.5）。
        contentPath:
          type: string
          description: |
            既存の schedule には反映されない。churn を避けるため差分対象外で、
            初回生成値に固定されるため（docs/recording.md §3.2）。まだ
            schedule が作られていない予約にだけ効く（docs/recording.md §4.5）。
        filenameTemplate:
          type: string
          description: |
            Go text/template のテンプレート文字列。既存の schedule には
            反映されず、まだ schedule が作られていない予約にだけ効く
            （docs/recording.md §4.5）。
        keepOriginal:
          type: string
          enum: [always, until_encoded]
          description: |
            ingest が原本をコミットする tx の中で recordings に焼かれる瞬間まで
            効く。録画開始後の変更でも、放送終了・ingest 完了より前ならこの
            録画に反映されるが、ingest 完了後の変更はこの録画には反映されない
            （docs/recording/reservation-model.md §4.5）。
        encodeProfiles:
          type: array
          items:
            type: string
          description: |
            ingest が原本をコミットする tx の中で recordings に焼かれる瞬間まで
            効く。録画開始後の変更でも、放送終了・ingest 完了より前ならこの
            録画に反映されるが、ingest 完了後の変更はこの録画には反映されない
            （docs/recording/reservation-model.md §4.5）。
        reset:
          type: array
          items:
            type: string
            enum:
              - priority
              - contentPath
              - filenameTemplate
              - keepOriginal
              - encodeProfiles
          description: |
            指定したフィールドの override を削除する（フィールド単位の
            「ルールに戻す」）。値を書いたフィールドと重複して指定すると 400。

    # --- Program search (M2-2) — 条件形はルールと共有 ---

    ProgramSearchRequest:
      type: object
      description: |
        ルール条件の条件部分と同じ形。rulequery.Conditions に写像される。
        検索対象のサイトはパスの {site}（POST /api/sites/{site}/programs/search）。
      properties:
        isFree:
          type: boolean
          nullable: true
        durationMinMs:
          type: integer
          format: int64
          nullable: true
        durationMaxMs:
          type: integer
          format: int64
          nullable: true
        periodStartAt:
          type: string
          format: date-time
          nullable: true
        periodEndAt:
          type: string
          format: date-time
          nullable: true
        textMatches:
          type: array
          items:
            $ref: "#/components/schemas/RuleTextMatch"
        services:
          type: array
          items:
            $ref: "#/components/schemas/RuleService"
        channelTypes:
          type: array
          items:
            type: string
            enum: [GR, BS, CS, SKY]
        genres:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 15
        times:
          type: array
          items:
            $ref: "#/components/schemas/RuleTimeWindow"
        sites:
          type: array
          items:
            type: string
          description: ルールの rule_sites 相当。空 = 評価 site のみ

    # --- Rules (M2-1) ---

    RuleTextMatch:
      type: object
      required: [target, mode, value]
      properties:
        target:
          type: string
          enum: [name, description, extended]
        mode:
          type: string
          enum: [keyword, regex]
          description: keyword = 部分一致 / regex = POSIX ARE
        value:
          type: string
        caseSensitive:
          type: boolean
          default: false
        negate:
          type: boolean
          default: false
          description: true なら除外条件

    RuleService:
      type: object
      required: [networkId, serviceId]
      properties:
        networkId:
          type: integer
        serviceId:
          type: integer

    RuleTimeWindow:
      type: object
      required: [weekdays, startSec, endSec]
      properties:
        weekdays:
          type: integer
          minimum: 1
          maximum: 127
          description: bit0=月 … bit6=日
        startSec:
          type: integer
          minimum: 0
          maximum: 86400
        endSec:
          type: integer
          minimum: 0
          maximum: 86400
          description: start より小さい場合は翌日跨ぎ

    RuleInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
          default: true
        priority:
          type: integer
          default: 10
        isFree:
          type: boolean
          nullable: true
          description: null = 問わない
        durationMinMs:
          type: integer
          format: int64
          nullable: true
        durationMaxMs:
          type: integer
          format: int64
          nullable: true
        periodStartAt:
          type: string
          format: date-time
          nullable: true
        periodEndAt:
          type: string
          format: date-time
          nullable: true
        textMatches:
          type: array
          items:
            $ref: "#/components/schemas/RuleTextMatch"
        services:
          type: array
          items:
            $ref: "#/components/schemas/RuleService"
        channelTypes:
          type: array
          items:
            type: string
            enum: [GR, BS, CS, SKY]
        genres:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 15
          description: genre lv1
        times:
          type: array
          items:
            $ref: "#/components/schemas/RuleTimeWindow"
        sites:
          type: array
          items:
            type: string
          description: 空または省略 = 全サイト
        dedupeEnabled:
          type: boolean
          default: false
        dedupeThreshold:
          type: number
          format: float
          nullable: true
          exclusiveMinimum: 0
          maximum: 1
          description: |
            pg_trgm の similarity() と比較する閾値。similarity() の値域は [0, 1] なので
            この範囲外は無意味。0 を許すと similarity() >= 0 が常に真になり、finished の
            録画が 1 本でもあれば以降の全番組が重複扱いで黙ってスキップされる
            （録画が黙って止まる）。1 を超えると常に偽になり、重複排除が黙って無効化される。
        dedupeWindowSeconds:
          type: integer
          format: int64
          nullable: true
          exclusiveMinimum: 0
          description: |
            重複排除の時間窓（秒）。interval の API 表現。省略（null）が「時間窓なし」で、
            0 はその意味にはならない。0 以下を許すと
            `program_start_at >= now() - window` が現在以降の開始時刻を要求する形になり、
            比較対象は必ず過去の放送なので常に偽（重複排除が黙って無効化される）。
        keepOriginal:
          type: string
          enum: [always, until_encoded]
          default: always
        encodeProfiles:
          type: array
          items:
            type: string
        filenameTemplate:
          type: string
        metadata:
          type: object
          additionalProperties: true

    Rule:
      allOf:
        - $ref: "#/components/schemas/RuleInput"
        - type: object
          required: [id, name, enabled, priority, keepOriginal, createdAt, updatedAt]
          properties:
            id:
              type: integer
              format: int64
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    DeleteRuleResponse:
      type: object
      required: [id, deletedReservations, detachedReservations]
      properties:
        id:
          type: integer
          format: int64
        deletedReservations:
          type: integer
          description: overrides なしで削除した rule 予約の件数
        detachedReservations:
          type: integer
          description: overrides 付きで detached 化した件数

    Reservation:
      type: object
      required:
        - id
        - site
        - programId
        - source
        - state
        - title
        - startAt
        - durationMs
        - createdAt
        - updatedAt
        - skip
      properties:
        id:
          type: integer
          format: int64
        site:
          description: |
            この予約がどのサイト（mirakc インスタンス）のものか。`reservations.site`
            そのままで、設定ファイルで定義されたサイト名（docs/schema.md §1-5）。

            チューナー容量超過の判定はサイトごとに独立しているため
            （docs/data.md §6.5）、予約一覧のバッジはこの値と超過区間の site を
            突き合わせる。M1/M2 は単一サイト構成なので実質 `default` 固定だが、
            **クライアントに定数を持たせない**（他サイトの不足を自分の不足として
            出す形で静かに壊れるのを避ける）。
          type: string
        programId:
          type: integer
          format: int64
        source:
          description: |
            導出値であり、reservations テーブルの列ではない（issue #26）。
            ユーザーが録れと指定した番組（program_intents に action=record の行が
            ある）なら manual、無ければ rule。ルールが今まさにこの予約に
            base を供給しているか（ruleId の有無）とは無関係で、手動予約に
            ルールがマッチしていても manual のまま変わらない。
          type: string
          enum: [rule, manual]
        ruleId:
          type: integer
          format: int64
        state:
          type: string
          enum: [active, detached, orphaned]
        overrides:
          type: object
        title:
          type: string
        startAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        skip:
          description: |
            effective.skip（M2-6, issue #24）。program_intents.action='skip' の
            明示、または意図が無く base.skip（ルールの重複排除判定）が true。
            true の間 reconciler は mirakc に同期しないが、予約行自体は
            「なぜ録られていないか」を説明するため残る。
          type: boolean
        dedupMatchRecordingId:
          description: 履歴ベース重複排除でマッチした録画の ID（マッチが無ければ省略）
          type: integer
          format: int64
        dedupSimilarity:
          description: 上記マッチの pg_trgm 類似度（0.0〜1.0、マッチが無ければ省略）
          type: number
          format: float

    # --- 予約の重なり警告 (M2-8, issue #24 / #21) ---
    #
    # チューナー本数を見ない「案 C」。件数と内訳だけを返し、勝敗・可否は主張しない
    # （断定は M2-10 の tuner_sync 射影 + 容量判定の領分。docs/data.md §6.5）。

    ProgramOverlaps:
      type: object
      required:
        - count
        - reservations
      properties:
        count:
          description: 重なっている既存予約の件数（自分自身を除く）
          type: integer
        reservations:
          description: 内訳。件数だけでなく何と重なっているかをユーザーが判断できるようにする
          type: array
          items:
            $ref: "#/components/schemas/OverlappingReservation"

    OverlappingReservation:
      type: object
      required:
        - id
        - programId
        - title
        - startAt
        - durationMs
      properties:
        id:
          type: integer
          format: int64
        programId:
          type: integer
          format: int64
        title:
          type: string
        startAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64

    # --- Circuit breakers (M2-5) ---

    CircuitBreaker:
      type: object
      description: |
        発動中の大量削除サーキットブレーカー 1 件（`circuit_breakers` 行 = 発動中。
        docs/recording.md §3.2）。
      required:
        - site
        - name
        - trippedAt
        - pending
        - threshold
        - detail
      properties:
        site:
          type: string
        name:
          type: string
          enum: [ruler_deletes, reconcile_total_loss]
          description: internal/breaker の定数（RulerDeletes / ReconcileTotalLoss）。
        trippedAt:
          type: string
          format: date-time
          description: |
            発動した時刻（最初の発動時刻。再発動で更新されるのは pending /
            threshold / detail のみ）。
        pending:
          type: integer
          description: 発動時に止めた削除の件数。
        threshold:
          type: integer
          description: 発動時の閾値。
        detail:
          $ref: "#/components/schemas/CircuitBreakerSample"

    CircuitBreakerSample:
      type: object
      description: |
        発動時に「何が消されようとしていたか」を説明する抜粋
        （`internal/breaker.Sample` と同じ形。手動確認の材料）。
      required:
        - total
      properties:
        total:
          type: integer
          description: 止めた削除の総数。
        programs:
          type: array
          description: 先頭いくつかの抜粋（`internal/breaker.MaxSampleSize` 件まで）。
          items:
            $ref: "#/components/schemas/CircuitBreakerSampleProgram"

    CircuitBreakerSampleProgram:
      type: object
      required:
        - programId
      properties:
        programId:
          type: integer
          format: int64
        title:
          type: string
