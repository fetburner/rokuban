openapi: "3.1.0"
info:
  title: Rokuban API
  version: 0.0.1
  description: Cloud-native recording server API

paths:
  /healthz:
    get:
      operationId: healthz
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/version:
    get:
      operationId: getVersion
      summary: Get server version
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /api/rules:
    get:
      operationId: listRules
      summary: List recording rules
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rule"
    post:
      operationId: createRule
      summary: Create a recording rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400":
          description: Invalid input (e.g. unsupported regex)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/rules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getRule
      summary: Get a recording rule
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateRule
      summary: Update a recording rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteRule
      summary: Delete a recording rule
      description: |
        導出予約の整理を伴う。overrides のない rule 予約は削除し、
        overrides 付きは detached 化して生き残る（recording.md §4.3）。
        応答に影響内訳を載せる。
      responses:
        "200":
          description: Deleted (with impact summary)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteRuleResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reservations:
    get:
      operationId: listReservations
      summary: List reservations
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"
    post:
      operationId: createReservation
      summary: Create a manual reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "400":
          description: Program not found in the EPG projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict (duplicate programId)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reservations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getReservation
      summary: Get a reservation
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteReservation
      summary: Cancel a reservation
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/services:
    get:
      operationId: listServices
      summary: List EPG services (channels)
      description: |
        EPG プロジェクションのサービス一覧。channelType, remoteControlKeyId, serviceId 順。

        サブサービス（ＮＨＫ総合２ 等）も含む全サービスを返す。マルチ編成のない
        サブサービスは番組を持たないため、UI は時間窓内に番組があるサービスだけを
        表示することが期待される（issue #17 の S3）。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"

  /api/programs/search:
    post:
      operationId: searchPrograms
      summary: Search EPG programs by rule-style conditions
      description: |
        ルール条件と同じコンパイラ（internal/rulequery）で epg_programs を検索する。
        ruler 評価と同一の SQL 経路を通る（M2-2）。UI 検索（M2-11）の土台。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramSearchRequest"
      responses:
        "200":
          description: OK（programId の昇順）
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  format: int64
        "400":
          description: Invalid conditions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/programs:
    get:
      operationId: listPrograms
      summary: List EPG programs in a time window
      description: |
        指定した時間窓に**一部でも重なる**番組を start_at 昇順で返す
        （`start_at < end AND end_at > start`）。窓開始前に始まった放送中の番組も含む。

        無限スクロールで窓を継ぎ足す場合、境界をまたぐ番組は隣接する 2 つの窓の
        両方に現れる。クライアントは programId で重複排除すること。

        ページネーショントークンは持たない。時間窓そのものがカーソルであり、
        同じ窓は常に同じ完全な結果を返す。

        レスポンスは一覧向けの軽い形で、extended / video / audios は含まない。
        それらは `GET /api/programs/{programId}` で取得する。
      parameters:
        - name: start
          in: query
          required: true
          description: 時間窓の開始（この時刻より後に終わる番組が対象）
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          required: true
          description: 時間窓の終了（この時刻より前に始まる番組が対象）。start からの幅は最大 7 日
          schema:
            type: string
            format: date-time
        - name: networkId
          in: query
          required: false
          schema:
            type: integer
        - name: serviceId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgramListItem"
        "400":
          description: Invalid time window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/programs/{programId}:
    parameters:
      - name: programId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getProgram
      summary: Get a single EPG program with full detail
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/recordings:
    get:
      operationId: listRecordings
      summary: List recordings
      description: |
        録画履歴。program_start_at の降順。ドロップ統計は PID 別の合計のみを含む。
        PID 別の内訳は `GET /api/recordings/{id}/drop-stats` で取得する。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recording"

  /api/recordings/{id}/drop-stats:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: listRecordingDropStats
      summary: Get per-PID drop statistics for a recording
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DropStat"

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    VersionResponse:
      type: object
      required:
        - version
      properties:
        version:
          type: string
          example: 0.0.1

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string

    Service:
      type: object
      required:
        - networkId
        - serviceId
        - name
        - channelType
        - channel
        - remoteControlKeyId
        - hasLogoData
      properties:
        networkId:
          type: integer
        serviceId:
          type: integer
        name:
          type: string
        channelType:
          type: string
          enum: [GR, BS, CS, SKY]
        channel:
          type: string
        remoteControlKeyId:
          type: integer
        hasLogoData:
          type: boolean

    # 一覧向けの軽い形。extended / video / audios は含まない（転送量のため）。
    ProgramListItem:
      type: object
      required:
        - programId
        - networkId
        - serviceId
        - eventId
        - startAt
        - endAt
        - durationMs
        - name
        - description
        - genres
        - isFree
      properties:
        programId:
          type: integer
          format: int64
        networkId:
          type: integer
        serviceId:
          type: integer
        eventId:
          type: integer
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        genres:
          description: ジャンル絞り込み用の lv1 のみ。詳細は Program.genreDetails
          type: array
          items:
            type: integer
        isFree:
          type: boolean

    # 詳細。ProgramListItem に UI 完全形のペイロードを足したもの。
    Program:
      allOf:
        - $ref: "#/components/schemas/ProgramListItem"
        - type: object
          properties:
            extended:
              description: 拡張形式イベント（出演者等）
              type: object
              additionalProperties:
                type: string
            genreDetails:
              type: array
              items:
                $ref: "#/components/schemas/Genre"
            video:
              $ref: "#/components/schemas/VideoInfo"
            audios:
              type: array
              items:
                $ref: "#/components/schemas/AudioInfo"

    Genre:
      type: object
      required: [lv1, lv2]
      properties:
        lv1:
          type: integer
        lv2:
          type: integer
        un1:
          type: integer
        un2:
          type: integer

    VideoInfo:
      type: object
      properties:
        type:
          type: string
        resolution:
          type: string
        streamContent:
          type: integer
        componentType:
          type: integer

    AudioInfo:
      type: object
      required: [componentType, isMain, samplingRate]
      properties:
        componentType:
          type: integer
        isMain:
          type: boolean
        samplingRate:
          type: integer
        langs:
          type: array
          items:
            type: string

    Recording:
      type: object
      required:
        - id
        - source
        - serviceName
        - channelType
        - channel
        - networkId
        - serviceId
        - eventId
        - title
        - startAt
        - durationMs
        - status
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        reservationId:
          type: integer
          format: int64
        ruleId:
          type: integer
          format: int64
        source:
          type: string
          enum: [rule, manual]
        serviceName:
          type: string
        channelType:
          type: string
          enum: [GR, BS, CS, SKY]
        channel:
          type: string
        networkId:
          type: integer
        serviceId:
          type: integer
        eventId:
          type: integer
        title:
          type: string
        description:
          type: string
        startAt:
          description: 番組の放送開始時刻
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
        status:
          type: string
          enum: [recording, finished, failed]
        startedAt:
          description: 録画の実開始時刻
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        sizeBytes:
          description: 原本の実サイズ。ingest 済み（media_assets 行あり）の場合のみ
          type: integer
          format: int64
        dropSummary:
          $ref: "#/components/schemas/DropSummary"
        qualityEvents:
          description: recording.failed / record-broken / bcas_anomaly の履歴
          type: array
          items:
            type: object
        createdAt:
          type: string
          format: date-time

    # PID 別 drop_stats の合計。内訳は /api/recordings/{id}/drop-stats。
    DropSummary:
      type: object
      required: [packets, drops, errors, scrambled]
      properties:
        packets:
          type: integer
          format: int64
        drops:
          type: integer
          format: int64
        errors:
          type: integer
          format: int64
        scrambled:
          type: integer
          format: int64

    DropStat:
      type: object
      required: [pid, packets, drops, errors, scrambled]
      properties:
        pid:
          type: integer
        packets:
          type: integer
          format: int64
        drops:
          type: integer
          format: int64
        errors:
          type: integer
          format: int64
        scrambled:
          type: integer
          format: int64

    CreateReservationRequest:
      type: object
      required:
        - programId
        - title
        - startAt
        - durationMs
      properties:
        programId:
          type: integer
          format: int64
        title:
          type: string
        startAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
        priority:
          type: integer

    # --- Program search (M2-2) — 条件形はルールと共有 ---

    ProgramSearchRequest:
      type: object
      description: |
        ルール条件の条件部分と同じ形。rulequery.Conditions に写像される。
        site は省略時 default（現状単一サイト）。
      properties:
        site:
          type: string
        isFree:
          type: boolean
          nullable: true
        durationMinMs:
          type: integer
          format: int64
          nullable: true
        durationMaxMs:
          type: integer
          format: int64
          nullable: true
        periodStartAt:
          type: string
          format: date-time
          nullable: true
        periodEndAt:
          type: string
          format: date-time
          nullable: true
        textMatches:
          type: array
          items:
            $ref: "#/components/schemas/RuleTextMatch"
        services:
          type: array
          items:
            $ref: "#/components/schemas/RuleService"
        channelTypes:
          type: array
          items:
            type: string
            enum: [GR, BS, CS, SKY]
        genres:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 15
        times:
          type: array
          items:
            $ref: "#/components/schemas/RuleTimeWindow"
        sites:
          type: array
          items:
            type: string
          description: ルールの rule_sites 相当。空 = 評価 site のみ

    # --- Rules (M2-1) ---

    RuleTextMatch:
      type: object
      required: [target, mode, value]
      properties:
        target:
          type: string
          enum: [name, description, extended]
        mode:
          type: string
          enum: [keyword, regex]
          description: keyword = 部分一致 / regex = POSIX ARE
        value:
          type: string
        caseSensitive:
          type: boolean
          default: false
        negate:
          type: boolean
          default: false
          description: true なら除外条件

    RuleService:
      type: object
      required: [networkId, serviceId]
      properties:
        networkId:
          type: integer
        serviceId:
          type: integer

    RuleTimeWindow:
      type: object
      required: [weekdays, startSec, endSec]
      properties:
        weekdays:
          type: integer
          minimum: 1
          maximum: 127
          description: bit0=月 … bit6=日
        startSec:
          type: integer
          minimum: 0
          maximum: 86400
        endSec:
          type: integer
          minimum: 0
          maximum: 86400
          description: start より小さい場合は翌日跨ぎ

    RuleInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
          default: true
        priority:
          type: integer
          default: 10
        isFree:
          type: boolean
          nullable: true
          description: null = 問わない
        durationMinMs:
          type: integer
          format: int64
          nullable: true
        durationMaxMs:
          type: integer
          format: int64
          nullable: true
        periodStartAt:
          type: string
          format: date-time
          nullable: true
        periodEndAt:
          type: string
          format: date-time
          nullable: true
        textMatches:
          type: array
          items:
            $ref: "#/components/schemas/RuleTextMatch"
        services:
          type: array
          items:
            $ref: "#/components/schemas/RuleService"
        channelTypes:
          type: array
          items:
            type: string
            enum: [GR, BS, CS, SKY]
        genres:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 15
          description: genre lv1
        times:
          type: array
          items:
            $ref: "#/components/schemas/RuleTimeWindow"
        sites:
          type: array
          items:
            type: string
          description: 空または省略 = 全サイト
        dedupeEnabled:
          type: boolean
          default: false
        dedupeThreshold:
          type: number
          format: float
          nullable: true
        dedupeWindowSeconds:
          type: integer
          format: int64
          nullable: true
          description: 重複排除の時間窓（秒）。interval の API 表現
        keepOriginal:
          type: string
          enum: [always, until_encoded]
          default: always
        encodeProfiles:
          type: array
          items:
            type: string
        filenameTemplate:
          type: string
        metadata:
          type: object
          additionalProperties: true

    Rule:
      allOf:
        - $ref: "#/components/schemas/RuleInput"
        - type: object
          required: [id, name, enabled, priority, keepOriginal, createdAt, updatedAt]
          properties:
            id:
              type: integer
              format: int64
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    DeleteRuleResponse:
      type: object
      required: [id, deletedReservations, detachedReservations]
      properties:
        id:
          type: integer
          format: int64
        deletedReservations:
          type: integer
          description: overrides なしで削除した rule 予約の件数
        detachedReservations:
          type: integer
          description: overrides 付きで detached 化した件数

    Reservation:
      type: object
      required:
        - id
        - programId
        - source
        - state
        - title
        - startAt
        - durationMs
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
        programId:
          type: integer
          format: int64
        source:
          type: string
          enum: [rule, manual]
        ruleId:
          type: integer
          format: int64
        state:
          type: string
          enum: [active, detached, orphaned]
        overrides:
          type: object
        title:
          type: string
        startAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
