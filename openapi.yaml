openapi: "3.1.0"
info:
  title: Rokuban API
  version: 0.0.1
  description: Cloud-native recording server API

paths:
  /healthz:
    get:
      operationId: healthz
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/version:
    get:
      operationId: getVersion
      summary: Get server version
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    VersionResponse:
      type: object
      required:
        - version
      properties:
        version:
          type: string
          example: 0.0.1
