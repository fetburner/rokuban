openapi: "3.1.0"
info:
  title: Rokuban API
  version: 0.0.1
  description: Cloud-native recording server API

paths:
  /healthz:
    get:
      operationId: healthz
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      operationId: readyz
      summary: Readiness check (DB ping)
      description: |
        **ロードバランサ（k8s の Service）向けの readiness 専用**。DB への
        ping が通れば 200、通らなければ 503 を返す。

        `/healthz`（liveness）とは目的が違うので分けている。liveness に依存
        チェックを入れると DB の瞬断で全 Pod が同時に再起動する（回復を待つ
        べき状況で、回復を最も妨げる挙動）。一方 readiness で DB を見ないと、
        DB に繋がっていない Pod に Service がトラフィックを振る窓が開く。

        **見るのは DB への ping だけで、mirakc への到達性は見ない**（不変条件
        1「api ロールは mirakc に問い合わせない」。ハイブリッド構成では
        クラウド側 api から mirakc に到達できないのが正常状態）。

        `/healthz` / `/metrics` と同じく Host allowlist を免除する
        （probe は Pod IP で叩くので allowlist に載せようがない）。

        **`/metrics` と違ってこの spec に載せる**のは、JSON を返す
        リクエスト/レスポンスの契約であり、`/healthz` と同じ形だから
        （`/metrics` は Prometheus の text exposition format なので載せない）。
        フロントから呼ぶ面ではないので、生成クライアントの readyz は使われない。
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Not ready (DB ping failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/version:
    get:
      operationId: getVersion
      summary: Get server version
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /api/capabilities:
    get:
      operationId: getCapabilities
      summary: Report which optional features this deployment has enabled
      description: |
        **オプション機能の導線を出してよいかをフロントが判断するための公開面**
        （issue #209）。フロントは config を読めない（api ロールは設定ファイルを
        配らない。不変条件 1）ため、`live.enabled` のように「無効なら導線ごと
        消したい」設定は API で観測できる必要がある。

        **設定値そのものではなく「導線を出してよいか」だけを返す。** 返すのは
        真偽値だけで、config のキー名・値・ffmpeg のパス・プロファイル定義は
        載せない（`GET /api/encode-profiles` / `GET /api/sites` と同じ規律）。

        **機能が「有効」であることは「今すぐ使える」ことを意味しない。**
        `live: true` はこのデプロイの config が `live.enabled: true` である
        ことだけを表し、streamer ロールが実際に動いている / チューナーが空いて
        いることは表さない（後者はプレイリスト取得の 404 / 503 として出る。
        docs/frontend/live.md）。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"

  /api/sites:
    get:
      operationId: listSites
      summary: List the mirakc sites this deployment knows about
      description: |
        `config.mirakc`/`mirakcs` レジストリの公開面（issue #184 M4-12）。api は
        site に束縛されない（不変条件 1）ため、フロントが正しい `{site}` を
        パスに埋めるにはこの一覧が要る（旧 `web/src/lib/site.ts` の
        `DEFAULT_SITE` 決め打ちを撤去する対応）。

        **機微情報は載せない。** mirakc の URL は返さない（site 名の配列のみ。
        `GET /api/encode-profiles` が ffmpeg のパス等を出さないのと同じ規律）。
      responses:
        "200":
          description: OK（レジストリの定義順）
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /api/encode-profiles:
    get:
      operationId: listEncodeProfiles
      summary: List configured encode profile names
      description: |
        `config.encode.profiles` に定義されたプロファイルの公開面。UI が
        ルール / overrides の `encodeProfiles` を選ぶために使う（M3-6 / issue #68）。

        **機微情報は載せない。** ffmpeg のパスや extra_args は出さない。
        名前（と表示用の container）だけを返す。
      responses:
        "200":
          description: OK（設定順。未定義なら空配列）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EncodeProfileSummary"

  /api/rules:
    get:
      operationId: listRules
      summary: List recording rules
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rule"
    post:
      operationId: createRule
      summary: Create a recording rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400":
          description: Invalid input (e.g. unsupported regex)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/rules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getRule
      summary: Get a recording rule
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateRule
      summary: Update a recording rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteRule
      summary: Delete a recording rule
      description: |
        導出予約の整理を伴う。overrides のない rule 予約は削除し、
        overrides 付きは detached 化して生き残る（recording.md §4.3）。
        応答に影響内訳を載せる。
      responses:
        "200":
          description: Deleted (with impact summary)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteRuleResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reservations:
    get:
      operationId: listReservations
      summary: List reservations
      description: |
        導出結果の読み取り専用ビュー（issue #29）。書き込みは
        `PUT/DELETE /api/sites/{site}/programs/{programId}/intent` と
        `PATCH/DELETE /api/sites/{site}/programs/{programId}/overrides` で行う
        —— `reservations` の書き手は ruler だけであり、api はここを一切書かない。

        **全サイトの予約を返す**（issue #184 M4-12）。各要素の `site` で区別する。
        絞り込みパラメータは持たない（不変条件 11: 必要になった時点で足す）。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"

  /api/sites/{site}/programs/{programId}/reservation:
    parameters:
      - $ref: "#/components/parameters/Site"
      - $ref: "#/components/parameters/ProgramId"
    get:
      operationId: getProgramReservation
      summary: Get the reservation for a program, keyed by (site, programId)
      description: |
        `(site, programId)` を宛先に予約を読む（issue #99）。`reservations.id` は
        ruler の導出削除・再実体化で変わりうる不安定な値なので、UI の
        ディープリンク・クエリキャッシュのような恒久的な資源同定には使わない。

        `UNIQUE (site, program_id)` が既に張られているため、このキーで一意に
        予約が定まる。予約行が再実体化されて `id` が変わっても、この URL・
        クエリキーは変わらない —— ブックマーク・共有した URL、TanStack Query の
        クエリキャッシュが再実体化を生き延びる（#98 で recordings.reservation_id /
        放送イベントの識別について踏んだのと同じ形の identity の問題。CLAUDE.md
        不変条件 9「導出器が作るキーを宛先にしない」）。

        指定した番組に対する予約が無ければ 404（`reservations` に行が無い、
        または site が設定と一致しない）。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "404":
          description: No reservation for this (site, programId), or unknown site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/sites/{site}/services:
    parameters:
      - $ref: "#/components/parameters/Site"
    get:
      operationId: listServices
      summary: List EPG services (channels)
      description: |
        EPG プロジェクションのサービス一覧。channelType, remoteControlKeyId, serviceId 順。

        サブサービス（ＮＨＫ総合２ 等）も含む全サービスを返す。マルチ編成のない
        サブサービスは番組を持たないため、UI は時間窓内に番組があるサービスだけを
        表示することが期待される（issue #17 の S3）。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
        "404":
          description: Unknown site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/sites/{site}/tuners:
    parameters:
      - $ref: "#/components/parameters/Site"
    get:
      operationId: listTuners
      summary: List projected tuners
      description: |
        `tuner_sync`（worker が周期で mirakc の `/api/tuners` を投影する使い捨て
        プロジェクション）の行をそのまま返す。導出はしない（不変条件 9・11）。
        列の意味の権威は docs/data/capacity.md §6.5。

        「いまどの局を掴んでいるか」「ライブ視聴が何本か」は `tuner_sync` に
        無いため、このエンドポイントも持たない（watcher の観測対象を広げる
        別の判断）。

        射影が 1 行も無いサイトは空配列を返す（「射影が 1 行も無いサイトは
        何も主張しない」docs/data/capacity.md §6.5）。
      responses:
        "200":
          description: OK（tuner_index 順）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tuner"
        "404":
          description: Unknown site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/sites/{site}/programs/search:
    parameters:
      - $ref: "#/components/parameters/Site"
    post:
      operationId: searchPrograms
      summary: Search EPG programs by rule-style conditions
      description: |
        ルール条件と同じコンパイラ（internal/rulequery）で epg_programs を検索する。
        ruler 評価と同一の SQL 経路を通る（M2-2）。UI 検索（M2-11）の土台。

        **`sites`（絞り込み条件、空または省略 = 全サイト）が検索対象のサイト軸を決める。**
        レスポンスは `{site, programId}` のフラットな配列で、同一放送が複数サイトで
        マッチすれば行が複数出る（畳まない）。ruler はマッチした全サイトで予約を作る
        （N 予約が既定。docs/recording/ruler.md「サイトの扱い」）ため、行数がそのまま
        実体化される予約数になる。

        **非互換の変更**: 旧仕様は `sites` を `rule_sites` 相当の絞り込み（空 = パスの
        {site} のみを評価対象にする）と説明していたが、実際の SQL は `$site = ANY($sites)`
        という両辺が定数でテーブル列を参照しない述語だったため、事実上パスの {site} だけが
        全か無かのゲートとして機能し `sites` は無効だった。新仕様では `sites` が
        `epg_programs.site` に対する実際の絞り込み述語になる。

        **パスの `{site}` は撤去を決定済みだが、この変更では実行しない**（#526 の
        判定基準に照らすと、検索結果は観測の集合でありパスに site を固定する理由がない
        —— 識別子ではなく存在のスコープとして `sites` が担うべき軸のため）。撤去は
        `internal/rulequery.Compile` が空 `Sites` を「述語なし」と解釈すると
        `internal/ruler` の既定（`rule_sites` 省略 = 空）経由で全サイトを読む
        correctness バグになりうるため、api 層が `sites` 省略時にレジストリ全件を埋めて
        `Compile` へ渡す Go 側の修正と同時にしか実行できない。この契約が `sites` の既定を
        「空 = 全サイト」と先に定義しているのは、その Go 修正の前提を満たすため。撤去と
        その Go 修正は後続タスクでまとめて行う。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramSearchRequest"
      responses:
        "200":
          description: OK（programId, site の昇順。同一放送が複数サイトでマッチすると複数行）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgramSearchMatch"
        "400":
          description: Invalid conditions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/sites/{site}/programs:
    parameters:
      - $ref: "#/components/parameters/Site"
    get:
      operationId: listPrograms
      summary: List EPG programs in a time window
      description: |
        指定した時間窓に**一部でも重なる**番組を start_at 昇順で返す
        （`start_at < end AND end_at > start`）。窓開始前に始まった放送中の番組も含む。

        無限スクロールで窓を継ぎ足す場合、境界をまたぐ番組は隣接する 2 つの窓の
        両方に現れる。クライアントは programId で重複排除すること。

        ページネーショントークンは持たない。時間窓そのものがカーソルであり、
        同じ窓は常に同じ完全な結果を返す。

        レスポンスは一覧向けの軽い形で、extended / video / audios は含まない。
        それらは `GET /api/sites/{site}/programs/{programId}` で取得する。
      parameters:
        - name: start
          in: query
          required: true
          description: 時間窓の開始（この時刻より後に終わる番組が対象）
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          required: true
          description: 時間窓の終了（この時刻より前に始まる番組が対象）。start からの幅は最大 7 日
          schema:
            type: string
            format: date-time
        - name: service
          in: query
          style: form
          explode: true
          required: false
          description: |
            `Service.id`（`networkId * 100000 + serviceId`）。複数指定は OR。
          schema:
            type: array
            items:
              type: integer
              format: int64
              minimum: 1
              # networkId / serviceId とも 16bit なので 65535 * 100000 + 65535。
              maximum: 6553565535
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgramListItem"
        "400":
          description: Invalid time window or query filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/sites/{site}/programs/{programId}:
    parameters:
      - $ref: "#/components/parameters/Site"
      - $ref: "#/components/parameters/ProgramId"
    get:
      operationId: getProgram
      summary: Get a single EPG program with full detail
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/sites/{site}/programs/{programId}/overlaps:
    parameters:
      - $ref: "#/components/parameters/Site"
      - $ref: "#/components/parameters/ProgramId"
    get:
      operationId: getProgramOverlaps
      summary: Count reservations overlapping this program's broadcast time
      description: |
        指定番組の放送時間帯（EPG プロジェクションから引く）と半開区間で重なる
        既存予約の件数と内訳を返す（`a.start < b.end AND b.start < a.end`。番組表は
        連続しているため、閉区間で判定すると隣接番組がすべて重なりになってしまう）。

        対象は同じ site の予約のうち、自分自身（同じ programId の予約）を除き、
        `state <> 'orphaned'`、実効オプション（`db.EffectiveOptions`）の `skip` が
        true でないもの。

        **これは重なりの件数だけを返す。チューナー本数との比較や容量超過の判定は
        行わない**（[issue #21](https://github.com/fetburner/rokuban/issues/21) の
        「案 C」、docs/data.md §6.5 が扱う M2-10 の領分）。`count` が 0 より大きくても
        「録画できない」とは限らず（同一物理チャンネルなら 1 本のチューナーで
        複数番組を賄える）、逆に `count` が 0 でも他サイトや mirakc の他の消費者
        （並走 EPGStation・ライブ視聴・EPG 収集）の存在は考慮されていない。
        呼び出し側は件数を「事実」として提示し、勝敗や可否を断定してはならない。

        番組が EPG プロジェクションに無ければ 404。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramOverlaps"
        "404":
          description: Program not found in the EPG projection, or unknown site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/sites/{site}/programs/{programId}/intent:
    parameters:
      - $ref: "#/components/parameters/Site"
      - $ref: "#/components/parameters/ProgramId"
    put:
      operationId: putProgramIntent
      summary: Assert record/skip intent for a program
      description: |
        ユーザー意図（`program_intents`）を `(site, programId)` を自身のキーとして
        書く（issue #29）。導出行（`reservations`）の有無に依存しないので、
        `base.skip` が立っている番組にも `action=record` を立てられる
        （旧 `POST /api/reservations` は導出行が「無い」ときしか書けなかった）。

        意図だけを書き、`reservations` は同一トランザクションで作らない
        （`reservations` の書き手は ruler だけにする。issue #29 の決定）。
        `insertRulerPassHint` で ruler_pass を即座に投入するので、実体化は
        秒オーダー。フロントエンドは楽観更新で一覧に即時反映する。

        番組が EPG プロジェクションに無ければ 400。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramIntentInput"
      responses:
        "204":
          description: Recorded
        "400":
          description: Program not found in the EPG projection, or invalid action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProgramIntent
      summary: Clear intent for a program (defer to the rule)
      description: |
        `program_intents` の行を削除するだけ（意見なし。純粋にルール由来へ戻す）。
        取消（「録るな」の明示的な主張）は `PUT .../intent {action: skip}`。
        こちらは「何も主張しない」状態に戻す操作で、`program_overrides` には
        一切触れない（別表・別軸。issue #29）。冪等（行が無くても 204）。
      responses:
        "204":
          description: Cleared
        "400":
          description: Unknown site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/sites/{site}/programs/{programId}/overrides:
    parameters:
      - $ref: "#/components/parameters/Site"
      - $ref: "#/components/parameters/ProgramId"
    patch:
      operationId: patchProgramOverrides
      summary: Update per-program overrides
      description: |
        値を書いたフィールドはそのフィールドの override を設定する。`reset`
        配列に名前を挙げたフィールドは override を削除する（フィールド単位の
        「ルールに戻す」）。どちらにも現れないフィールドは変更しない。

        `null` で消す形にはしない（`*T` は「キーが無い」と `null` を区別できず、
        「消す」が「変更しない」に化けて黙って壊れるため。
        docs/recording.md §4.2「overrides API の形」）。

        同じフィールドを値と `reset` の両方に書いたら 400（意図が不明なので
        推測しない）。`reset` に未知のフィールド名があっても 400。

        `skip` は overrides のキーではない（`program_intents.action` が担う）ので
        ここでは扱わない。取消は `PUT .../intent {action: skip}`。

        `(site, programId)` を自身のキーとして `program_overrides` を書く
        （issue #29）。導出行（`reservations`）の有無には依存しない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramOverridesInput"
      responses:
        "204":
          description: Updated
        "400":
          description: Invalid input, or program not found in the EPG projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProgramOverrides
      summary: Reset all overrides for a program (revert to rule)
      description: |
        `program_overrides` の行を削除するだけ。`action`（record/skip。
        `program_intents` 側）は触らない（別表・別軸。docs/recording.md §4.2
        「overrides は program_intents とは別の表に置く」）。冪等（行が無くても 204）。
      responses:
        "204":
          description: Cleared
        "400":
          description: Unknown site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/recordings:
    get:
      operationId: listRecordings
      summary: List recordings
      description: |
        録画履歴。既定は program_start_at 降順（`order=asc` で昇順）。ドロップ統計は
        PID 別の合計のみを含む。PID 別の内訳は `GET /api/recordings/{id}/drop-stats`
        で取得する。

        既定は生きている録画（`deleted_at IS NULL`）のみ。`trash=true` でごみ箱
        （`deleted_at IS NOT NULL AND purged_at IS NULL`）を返す。完全削除
        （purge）が完了した tombstone（`purged_at` が立った行、issue #135）は
        ファイルが既に無いため、ごみ箱にも通常一覧にも出ない。`trash` と各
        絞り込み条件は直交する --- `trash=true` でも条件は同じように効く。

        ## 絞り込み

        - `q` はキーワードの部分一致。`qTarget`（既定 `titleDescription`）で対象を
          `title` 単体に絞れる。全角/半角の揺れは `normalize_search_text` で吸収する
          （docs/data.md §5）。`/search`（EPG 検索）と同じ正規化方言を使うが、
          エンジン（`internal/rulequery`）は共有しない --- 理由は docs/data.md §5
          「録画検索は rulequery を共有しない」
        - `genre` は `genre_lv1`（ジャンル大分類。`genres` から生成列で導出）との
          重なりで絞る（複数指定は OR）
        - `site` / `channelType` / `service` は複数指定可（`style: form,
          explode: true`）。`service` は `Service.id`（例: `?service=400101`）。
          **すべての軸は「軸内は OR、軸間は AND」**
        - `status` / `source` / `ruleId` は録画自身の観測・出自での絞り込み
        - `encodeState` は River の active な encode ジョブを待機中 / 実行中で絞る。
        - `from` / `to` は `program_start_at` の範囲（`from` 以上 `to` 未満）

        不正な値（enum に一致しない `status`/`source`/`encodeState`/`qTarget`/`channelType`/
        `order`、ドメイン外の `genre`）は無視・切り詰めせず 400 にする。

        ## ページング（キーセット）

        トークンを発行しない。返った配列の**最後の要素**の `startAt` / `id` を、
        次のリクエストの `before` / `beforeId` にそのまま渡す（EPG の時間窓カーソル
        --- docs/api.md「時間窓がカーソル」--- と同じ思想だが、録画は有界に増え続ける
        ため境界は時間窓ではなく `(program_start_at, id)` の複合キーになる。同一
        `program_start_at` の録画（同時刻開始の別チャンネル）が普通に発生するため、
        `id` を tie-breaker にしないとページ跨ぎで重複・欠落が出る）。`before` /
        `beforeId` は両方揃って初めて有効（片方だけの指定は 400）。`order=asc` では
        カーソルの不等号を反転する。総件数は返さない（別クエリが要り、キーセットの
        利点を打ち消すため。必要になったら別 issue）。`limit` の既定は 50、上限は
        200（超えると 400）。

        `trash=true` でもカーソル軸は `program_start_at` のまま（旧
        `ListTrashRecordings` の `deleted_at` 降順からの意図的な変更。理由は
        docs/api.md「録画一覧: 絞り込み + キーセットページング」参照）。

        **既定では全サイトの録画を返す**（issue #184 M4-12）。`?site=` で
        絞り込める。各要素の `site` フィールドでも区別できる。
      parameters:
        - name: q
          in: query
          required: false
          description: キーワード（部分一致）。qTarget が対象列を決める
          schema:
            type: string
        - name: qTarget
          in: query
          required: false
          schema:
            type: string
            enum: [title, titleDescription]
            default: titleDescription
        - name: genre
          in: query
          style: form
          explode: true
          required: false
          description: genre_lv1（ジャンル大分類）との重なり。複数指定可
          schema:
            type: array
            items:
              type: integer
              minimum: 0
              maximum: 15
        - name: channelType
          in: query
          style: form
          explode: true
          required: false
          schema:
            type: array
            items:
              type: string
              enum: [GR, BS, CS, SKY]
        - name: site
          in: query
          style: form
          explode: true
          required: false
          description: |
            mirakc サイト名。複数指定は OR。site 名の構文は
            `config.mirakc`/`mirakcs` レジストリと同じ（`internal/config` の
            `mirakcSiteNamePattern`）。レジストリに無い名前を渡してもエラーには
            せず 0 件になる --- 絞り込みは「あるものから選ぶ」操作なので、
            存在しない値の指定は空の結果として素直に読める。
          schema:
            type: array
            items:
              type: string
              pattern: '^[a-z0-9](?:[_-]?[a-z0-9])*$'
        - name: service
          in: query
          style: form
          explode: true
          required: false
          description: |
            `Service.id`（`networkId * 100000 + serviceId`）。複数指定は OR。

            **site は含めない**（`site` パラメータが別軸）。他の絞り込み軸と
            同じく「軸内は OR、軸間は AND」で、`?site=tokyo&service=400101` は
            「tokyo の BS 101」を意味する。
          schema:
            type: array
            items:
              type: integer
              format: int64
              minimum: 1
              # networkId / serviceId とも 16bit なので 65535 * 100000 + 65535。
              maximum: 6553565535
        - name: status
          in: query
          required: false
          description: |
            recordings.status の CHECK と一致させた 4 値（'canceled' は issue #130 で
            CHECK に追加済み）。

            `status=failed` は通常一覧（`trash=false`）に限り supersede 済みの
            failed 行を返さない。本物の record が観測されて置き換わった擬似
            failed 行を「録画失敗」として返さないため（ホームの警告が偽陽性を
            出し続けるのを防ぐ）。無条件一覧・`trash=true` は履歴として両行を残す。
          schema:
            type: string
            enum: [recording, finished, canceled, failed]
        - name: encodeState
          in: query
          required: false
          description: |
            active な River encode ジョブの状態。`queued` は `available` /
            `pending` / `scheduled` / `retryable`、`running` は実行中を表す。
            件数は録画数ではなく録画 × プロファイルのジョブ数になる。
          schema:
            type: string
            enum: [queued, running]
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum: [rule, manual]
        - name: ruleId
          in: query
          required: false
          description: 特定ルール由来の録画に絞る
          schema:
            type: integer
            format: int64
        - name: from
          in: query
          required: false
          description: program_start_at がこの時刻以上
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: program_start_at がこの時刻未満
          schema:
            type: string
            format: date-time
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [desc, asc]
            default: desc
        - name: trash
          in: query
          required: false
          description: true のときごみ箱（論理削除済み）を返す
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: before
          in: query
          required: false
          description: キーセットカーソル。前ページ最後の要素の startAt。beforeId と対で使う
          schema:
            type: string
            format: date-time
        - name: beforeId
          in: query
          required: false
          description: キーセットカーソル。前ページ最後の要素の id。before と対で使う
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recording"
        "400":
          description: |
            before / beforeId が片方だけ指定された、limit が範囲外、または
            time window 系の入力が不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/recordings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getRecording
      summary: Get a single recording by id
      description: |
        一覧要素（`GET /api/recordings` の各要素）と同形。単体ページ・skip 理由や
        予約からの導線が着地する先。

        **ごみ箱（`deleted_at IS NOT NULL`）の録画も 200 で返す。** メディア配信の
        404 契約（`recordings.deleted_at IS NOT NULL` を 404 にする。
        docs/api/media.md）とメタデータの可視性は別の判断 --- 一覧が
        `trash=true` で既にごみ箱の録画のメタデータを 200 で返しているため、
        単体 GET だけ厳しくする理由が無い。単体ページ（`/recordings/$id`）は
        この `deletedAt` を見て再生系（プレイヤー・原本リンク）を出さない
        （docs/frontend/recordings.md）。

        **完全削除（purge）済みの tombstone（`purged_at` が立った行、issue
        #135）は 404。** ファイルが既に無く、通常一覧・ごみ箱一覧のどちらにも
        現れない行なので、単体 GET だけ見える形にしない。

        ごみ箱の行では一覧と同じく `encodedAssets` を省略する
        （一覧・単体とも常に射影し、Go 側で落とす。プレイヤーを出さないので
        揃える必要が無い）。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"
        "404":
          description: Recording not found, or fully purged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteRecording
      summary: Soft-delete a recording (move to trash)
      description: |
        論理削除。`recordings.deleted_at = now()` を立てるだけ。ファイルには触れない
        （docs/storage.md「ごみ箱 = 論理削除」）。既に削除済みなら冪等に 204。
        行が無ければ 404。
      responses:
        "204":
          description: Soft-deleted (or already in trash)
        "404":
          description: Recording not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/recordings/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: restoreRecording
      summary: Restore a soft-deleted recording from trash
      description: |
        `deleted_at` を消し、即時削除の要求（`recording_purge_requests` の行）を
        取り消すだけ（ファイル操作ゼロ・即時）。
        ごみ箱に入っていない、または行が無い場合は 404。
        同一イベントに生きている録画があると partial unique index で衝突し 409。
      responses:
        "204":
          description: Restored
        "404":
          description: Not in trash / not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Active recording already exists for the same event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/recordings/{id}/purge:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: purgeRecording
      summary: Mark a recording for immediate physical purge
      description: |
        即時物理削除の要求。`recording_purge_requests` に行を入れ、未 soft-delete
        なら `deleted_at` も同時に立てる。**ファイルは消さない**（M3-8 の削除
        reconcile がこの要求を拾って unlink する）。既に要求済みでも冪等に 204。
      responses:
        "204":
          description: Marked for purge
        "404":
          description: Recording not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/recordings/{id}/encode-profiles:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      operationId: addRecordingEncodeProfiles
      summary: Request additional encode profiles for an already-ingested recording
      description: |
        `recordings.encode_profiles` は ingest 完了時に一度だけ焼き込まれる凍結値
        だが（docs/storage.md §6「原本 TS の保持ポリシー」）、ユーザー起点の事後
        追加だけは凍結の例外として認める（issue #133）。**追加専用**（union +
        dedup）で書き、全置換にはしない --- 誤って他プロファイルの指定を消す事故を
        避けるため。

        原本の media_assets 行が `state = 'active'` でない録画には 409 を返す。
        これは次のいずれかに当たる --- 本当に削除済み（`keep_original=until_encoded`
        でエンコード完了後に原本削除 reconcile が消した等）、`state = 'deleting'`
        （unlink 待ち。一覧では「原本あり」に見えるが事後追加は決定的に 409 になる）、
        またはそもそも ingest が完了しておらず original 行自体が無い。この場合
        `EnqueueMissingEncodes` は黙って no-op になるため、api 層で明示的に
        検査してサイレントな失敗にしない。

        既に完了済み/pending のプロファイル名を再指定してもエラーにはならず
        （River の UniqueOpts が二重投入を防ぐ）、冪等に 204 を返す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddEncodeProfilesInput"
      responses:
        "204":
          description: Accepted（不足分の encode ジョブを投入した）
        "400":
          description: Empty profiles array, or unknown profile name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Recording not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No active original media asset (deleted, deleting, or not yet ingested); cannot add encode profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/recordings/{id}/drop-stats:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: listRecordingDropStats
      summary: Get per-PID drop statistics for a recording
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DropStat"

  /api/capacity/overages:
    get:
      operationId: listCapacityOverages
      summary: List intervals where tuner capacity is exceeded
      description: |
        チューナーが不足している**区間**を結合済みで返す（M2-10、issue #21 /
        docs/data.md §6.5）。

        **主張は下界に限る。** 「この区間は超過している」は確実だが、返らなかった
        区間が「収まる」ことは保証しない。Rokuban から見えない消費者（並走する
        EPGStation・ライブ視聴・EPG 収集ジョブ）がいるうえ、mirakc の
        `excluded_channels` は `/api/tuners` に載らないため、既知の盲点はすべて
        「警告を見逃す」方向に偏っている。**沈黙を「大丈夫」と読ませてはならない。**

        返すのは区間の性質だけで、**どの番組が負けるかは主張しない**。勝敗を決めるのは
        mirakc であり、Rokuban には見えない消費者がいるので予測できない。UI の文言も
        「この予約は競合しています」ではなく「この時間帯はチューナーが不足しています」。

        需要の単位は予約件数ではなく**異なる物理チャンネル数**（同一物理チャンネルなら
        1 本のチューナーに相乗りできる。副産物としてマルチ編成のサブサービスが
        自然に畳まれる）。数えるのは reconciler が実際に schedule を作る予約だけで、
        `effective.skip` が true の行と `state = 'orphaned'` の行は需要にならない。

        判定は種別部分集合に縮約した Hall 条件（`∀A ⊆ {GR,BS,CS,SKY}:
        Σ_{t∈A} d[t] ≤ cap(A)`）。破れた `A` から不足本数と詰まった種別が
        副産物として出るので、`shortfall` / `jammedTypes` で「BS が 1 本不足」まで言える。

        判定はサイトごとに独立に行われ、**全サイトの超過区間を返す**
        （issue #184 M4-12）。各要素の `site` で区別する。
      parameters:
        - name: start
          in: query
          required: true
          description: 時間窓の開始（この時刻より後に終わる区間が対象）
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          required: true
          description: 時間窓の終了（この時刻より前に始まる区間が対象）
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CapacityOverage"
        "400":
          description: 時間窓が不正
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/encode-queue:
    get:
      operationId: getEncodeQueue
      summary: Get active encode job counts
      description: |
        River の active な encode ジョブを待機中と実行中に分けて数える。
        `queued` は `available` / `pending` / `scheduled` / `retryable`、
        `running` は実行中。録画 1 本に複数プロファイルがあれば複数件になる。

        ffmpeg の進捗率を運ぶ `encode-progress` SSE は揮発テレメトリであり、
        待機件数には使わない。River の内部状態名はこの API の外へ出さず、
        UI が必要とする 2 分類だけを返す。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncodeQueueSummary"

  /api/storage:
    get:
      operationId: getStorage
      summary: Get observed storage usage
      description: |
        `storage.media_dir`（アーカイブ）と `storage.scratch_dir`（ローカルスクラッチ）の
        容量観測（issue #238 M7-5）。api ロールはファイルシステムに依存しない
        （不変条件 1）ので、ファイルシステムを持つ worker が定期的に statfs 相当で
        観測して DB に射影し、ここはその射影を読むだけ。

        毎パス全量を作り直す観測値であり、過去の観測を積むログではない
        （不変条件 9）。`observedAt` は「最後にいつ観測できたか」を表し、UI が
        鮮度を示すために必ず使う --- 観測ループが止まっていても行は消えない
        ので、鮮度が古いことだけが異常の手がかりになる（沈黙は保証ではない）。

        `scratch` は `storage.scratch_dir` が設定されているときだけ現れる
        （空文字列に設定を変えると、次の観測パスで消える）。`media` は
        `storage.media_dir` が必須なので常に現れるはずだが、初回の観測パスが
        まだ走っていない/失敗し続けている場合は配列が空になることもある。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StorageRoot"

  /api/breakers:
    get:
      operationId: listCircuitBreakers
      summary: List tripped circuit breakers
      description: |
        大量削除サーキットブレーカー（docs/recording.md §3.2）の発動状態。
        **行の存在 = 発動中**なので、発動していないブレーカーは結果に現れない
        （すべて停止していなければ空配列）。

        `detail` は発動時に「何が消されようとしていたか」を説明する抜粋で、
        手動確認の材料（`internal/breaker.Sample` と同じ形。最大 20 件）。

        site はパスに含めない。全サイトの発動を一望する用途のエンドポイントで、
        レスポンスの各要素に site フィールドがある（issue #102）。個別の再開は
        `POST /api/sites/{site}/breakers/{name}/resume`。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CircuitBreaker"

  /api/sites/{site}/breakers/{name}/resume:
    parameters:
      - $ref: "#/components/parameters/Site"
      - name: name
        in: path
        required: true
        description: |
          ブレーカー識別子（`internal/breaker` の定数。`ruler_deletes` /
          `reconcile_total_loss` / `delete_reconcile`）。未知の値は 400。
        schema:
          type: string
    post:
      operationId: resumeCircuitBreaker
      summary: Resume a tripped circuit breaker (manual acknowledgement)
      description: |
        手動確認後の再開。ブレーカーは人間が確認するまで止まり続けるラッチ
        （docs/recording.md §3.2）なので、確認が済んだことをこの API で明示する。

        `DELETE /api/sites/{site}/breakers/{name}` にしていないのは、運用者から
        見た操作が「行を削除する」ではなく「**確認したので再開する**」であるため。
        DB の行が消えるのは実装詳細（`internal/breaker` のラッチが行の存在で
        表される、という設計の帰結）であり、URL に出す概念ではない。

        site をパスに含めるのは、資源の PK が `(site, name)` であるため
        （issue #102）。`GET /api/breakers` はサイト横断の一覧に価値があるので
        グローバルのまま残すが、再開は行 1 件を特定する操作なので PK と
        一致させる。
      responses:
        "204":
          description: Resumed
        "400":
          description: Unknown site or breaker name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not tripped (nothing to resume)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    Site:
      name: site
      in: path
      required: true
      description: |
        mirakc インスタンスのサイト名。programId はインスタンス単位のスコープ
        しか持たないため、この site と組にしないと資源が一意に定まらない
        （issue #31）。api プロセス自身は特定の site に束縛されない
        （不変条件 1: mirakc にもファイルシステムにも依存しない）ので、権威は
        「`config.mirakc`/`mirakcs` レジストリに存在するか」であり、1 プロセスが
        レジストリの全 site を処理できる（issue #184 M4-12）。レジストリに無い
        site のエラーコードはエンドポイントの HTTP メソッドで決まる —— GET 系は
        404、POST/PUT/PATCH/DELETE 系は 400（他の入力検証と同じ扱い。詳細は各
        エンドポイントの description・レスポンス定義を参照）。存在する site の
        一覧は `GET /api/sites` で取得できる。
      schema:
        type: string
    ProgramId:
      name: programId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    VersionResponse:
      type: object
      required:
        - version
      properties:
        version:
          type: string
          example: 0.0.1

    Capabilities:
      type: object
      required:
        - live
      properties:
        live:
          type: boolean
          description: |
            ライブ視聴（`live.enabled`）が有効か。false のときフロントは
            ライブへの導線（主ナビ・番組行のリンク等）を出さない。
      description: |
        オプション機能のフラグ集合。**すべてのフィールドを required にする** ---
        欠けた項目を「未対応の古いサーバー」として扱うか「無効」として扱うかを
        フロント側で判断させると、判断が導線ごとにばらける。足すときは既定値を
        サーバー側で必ず埋める。

    # --- Encode profiles (M3-6 / issue #68) ---
    #
    # config.encode.profiles の公開面。ffmpeg パスや extra_args は出さない。
    EncodeProfileSummary:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: |
            ルール / overrides の `encodeProfiles` が参照する名前。
            config.encode.profiles[].name と一致する。
        container:
          type: string
          enum: [mp4, mkv]
          description: |
            出力コンテナ（表示用。未注入なら省略）。

    # --- 事後追加のエンコード依頼（issue #133） ---
    #
    # recordings.encode_profiles は ingest 完了時に一度だけ焼き込まれる凍結値だが
    # （docs/storage.md §6「原本 TS の保持ポリシー」）、ユーザー起点の事後追加だけは
    # 凍結の例外として認める。POST /api/recordings/{id}/encode-profiles のボディ。
    AddEncodeProfilesInput:
      type: object
      required:
        - profiles
      properties:
        profiles:
          type: array
          minItems: 1
          items:
            type: string
          description: |
            追加したいエンコードプロファイル名（config.encode.profiles に定義された
            名前のみ許可。未知名は 400）。既存の recordings.encode_profiles には
            **追加専用**（union + dedup）で書かれ、全置換にはならない --- 既存の
            指定を消す事故を避けるため。空配列は 400。

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string

    Service:
      type: object
      required:
        - id
        - networkId
        - serviceId
        - name
        - channelType
        - channel
        - remoteControlKeyId
        - hasLogoData
        - hasPrograms
      properties:
        id:
          type: integer
          format: int64
          description: |
            サービスの一意な識別子。`networkId * 100000 + serviceId`（Mirakurun /
            mirakc の `ServiceId` と同じ合成規則。権威は `internal/mirakc.ServiceID`）。

            **SI の `serviceId` は network をまたぐと一意でない**（BS 101 と
            110度CS 101 は実在する衝突）ため、絞り込み・選択・キャッシュキーの
            identity にはこの値を使う。`?service=` に載るのもこの値。

            **int32 には収まらない**（networkId / serviceId とも 16bit なので
            最大 65535 * 100000 + 65535 = 6,553,565,535）。JavaScript の
            safe integer には収まる。
        networkId:
          type: integer
        serviceId:
          type: integer
        name:
          type: string
        channelType:
          type: string
          enum: [GR, BS, CS, SKY]
        channel:
          type: string
        remoteControlKeyId:
          type: integer
        hasLogoData:
          type: boolean
        hasPrograms:
          type: boolean
          description: |
            EPG プロジェクション全体（表示中の時間窓ではない）に、このサービスの番組が
            1 件でもあるか。マルチ編成のないサブサービスは番組を持たないため false になる。
            このエンドポイント自体はこのフラグで絞り込まない —— ルールはまだ番組を持たない
            サービスも参照できる必要があり、絞り込むと「EPG プロジェクションのサービス
            一覧」という定義に反する構成員を落とすことになる。

    Tuner:
      type: object
      required: [index, name, types, isAvailable, isFault, observedAt]
      description: |
        `tuner_sync` の行をそのまま返す（導出しない）。列の意味の権威は
        docs/data/capacity.md §6.5「チューナー射影と容量超過の判定」。
      properties:
        index:
          type: integer
          description: mirakc の `/api/tuners` レスポンス内の配列インデックス。
        name:
          type: string
        types:
          type: array
          items:
            type: string
            enum: [GR, BS, CS, SKY]
        isAvailable:
          type: boolean
        isFault:
          type: boolean
          description: |
            mirakc の `/api/tuners` が返す値をそのまま射影している。
            Mirakurun 互換 API のフィールドで、Mirakurun 本体ではチューナー
            プロセスの error を 3 回数えたら立つラッチだが、**mirakc は
            実装しておらずリテラルの false を返す**（models.rs が
            `Always false.` と明記）。`isAvailable` も同様に常に true。
        observedAt:
          type: string
          format: date-time
          description: |
            この行を最後に投影した時刻。射影ループが止まっていても行は消えない
            ため、鮮度の手がかりとして必ずこれを使う（`GET /api/storage` の
            `observedAt` と同じ契約）。

    # 一覧向けの軽い形。extended / video / audios は含まない（転送量のため）。
    ProgramListItem:
      type: object
      required:
        - programId
        - networkId
        - serviceId
        - eventId
        - startAt
        - endAt
        - durationMs
        - name
        - description
        - genres
        - isFree
      properties:
        programId:
          type: integer
          format: int64
        networkId:
          type: integer
        serviceId:
          type: integer
        eventId:
          type: integer
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        genres:
          description: ジャンル絞り込み用の lv1 のみ。詳細は Program.genreDetails
          type: array
          items:
            type: integer
        isFree:
          type: boolean

    # 詳細。ProgramListItem に UI 完全形のペイロードを足したもの。
    Program:
      allOf:
        - $ref: "#/components/schemas/ProgramListItem"
        - type: object
          properties:
            extended:
              description: 拡張形式イベント（出演者等）
              type: object
              additionalProperties:
                type: string
            genreDetails:
              type: array
              items:
                $ref: "#/components/schemas/Genre"
            video:
              $ref: "#/components/schemas/VideoInfo"
            audios:
              type: array
              items:
                $ref: "#/components/schemas/AudioInfo"

    Genre:
      type: object
      required: [lv1, lv2]
      properties:
        lv1:
          type: integer
        lv2:
          type: integer
        un1:
          type: integer
        un2:
          type: integer

    VideoInfo:
      type: object
      properties:
        type:
          type: string
        resolution:
          type: string
        streamContent:
          type: integer
        componentType:
          type: integer

    AudioInfo:
      type: object
      required: [componentType, isMain, samplingRate]
      properties:
        componentType:
          type: integer
        isMain:
          type: boolean
        samplingRate:
          type: integer
        langs:
          type: array
          items:
            type: string

    Recording:
      type: object
      required:
        - id
        - site
        - source
        - serviceName
        - channelType
        - channel
        - networkId
        - serviceId
        - eventId
        - title
        - startAt
        - durationMs
        - status
        - createdAt
      properties:
        id:
          type: integer
          format: int64
        site:
          description: |
            この録画がどのサイト（mirakc インスタンス）のものか。`recordings.site`
            そのまま。`GET /api/recordings` は全サイトの録画を返すため
            （issue #184 M4-12）、クライアントはこの値で区別する。
          type: string
        ruleId:
          type: integer
          format: int64
        source:
          type: string
          enum: [rule, manual]
        serviceName:
          type: string
        channelType:
          type: string
          enum: [GR, BS, CS, SKY]
        channel:
          type: string
        networkId:
          type: integer
        serviceId:
          type: integer
        eventId:
          type: integer
        title:
          type: string
        description:
          type: string
        startAt:
          description: 番組の放送開始時刻。常に UTC（"Z" 終端の RFC3339）で返す。
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
        status:
          type: string
          enum: [recording, finished, canceled, failed]
        startedAt:
          description: 録画の実開始時刻。常に UTC（"Z" 終端の RFC3339）で返す。
          type: string
          format: date-time
        endedAt:
          description: 録画の実終了時刻。常に UTC（"Z" 終端の RFC3339）で返す。
          type: string
          format: date-time
        sizeBytes:
          description: |
            原本の実サイズ。ingest 済み（media_assets 行あり）の場合のみ。
            省略は「まだ取り込めていない」と「取り込んだ後に削除した」の両方を
            含むので、区別が要るときは `ingest.state` を見る（issue #211 /
            #212）。**転送中の途中ファイルのサイズはここに混ぜない**（コミット =
            DB 行。不変条件 3）--- 途中経過は `ingest.writtenBytes`。
          type: integer
          format: int64
        encodedAssets:
          description: |
            再生可能な encoded 派生物（media_assets の active のみ）。
            ブラウザ再生は GET /api/recordings/{id}/file?profile=<name> を使う。
            desired（encodeProfiles）ではなく observed。空配列は省略可。

          type: array
          items:
            $ref: "#/components/schemas/EncodedAsset"
        encodeProfiles:
          description: |
            凍結された「望ましい」エンコードプロファイル一覧（desired。
            recordings.encode_profiles）。ingest 完了時に一度だけ焼き込まれ、以後は
            `POST /api/recordings/{id}/encode-profiles` による事後追加（凍結の例外。
            docs/storage.md §6「原本 TS の保持ポリシー」）でのみ増える。
            `encodedAssets`（observed、再生可能なもの）とは異なり、まだ完了して
            いない pending なジョブのプロファイルも含む --- UI が「追加済み」を
            判定するのに使う。空配列は省略可。
          type: array
          items:
            type: string
        encodeStatus:
          description: |
            完了していないエンコードプロファイルの試行状態（issue #316）。
            `encodeProfiles`（desired）のうち `encodedAssets`（observed、
            再生可能）にまだ現れていないプロファイルだけを列挙する ---
            完了したプロファイルはここに出さず `encodedAssets` の存在で示す
            （2 つの配列に同じプロファイルが同時に出ることはない）。

            プロファイルを 1 つも設定していない録画・全プロファイルが完了
            済みの録画では省略する（空配列は返さない。機能しないキュー画面や
            空の進捗バーを出さない判断はサーバー側のこの省略で表現する）。

            `%` は含まない --- この REST モデルは `queued` / `running` /
            `failed` / 完了を復元する durable な状態だけを持つ。実行中の割合は
            notifier の `/api/events` が `encode-progress` SSE として配送する
            揮発テレメトリで、テーブルにも OpenAPI にも保存しない。
          type: array
          items:
            $ref: "#/components/schemas/EncodeJobStatus"
        dropSummary:
          $ref: "#/components/schemas/DropSummary"
        ingest:
          $ref: "#/components/schemas/IngestProgress"
        qualityEvents:
          description: recording.failed / record-broken / bcas_anomaly の履歴
          type: array
          items:
            type: object
        deletedAt:
          description: |
            論理削除時刻。ごみ箱一覧（`trash=true`）と `GET /api/recordings/{id}`
            （ごみ箱の録画も 200 で返す）でのみ出現する。通常一覧・生きている
            行では省略（NULL）。常に UTC（"Z" 終端の RFC3339）で返す。
          type: string
          format: date-time
        createdAt:
          description: 常に UTC（"Z" 終端の RFC3339）で返す。
          type: string
          format: date-time

    # 原本の取り込み（ingest）がどこまで進んだか（issue #212）。
    #
    # `status = finished`（mirakc の録画完了）から原本のコミット（media_assets
    # 行）までの間、UI は「ブラウザ再生も事後エンコードもできない」理由を
    # `sizeBytes` の省略でしか知れず、遅い回線では止まっているのか進んでいるのか
    # 判別できなかった。ここはその判別だけを目的にする。
    #
    # **encode / thumbnail の進捗は含まない**（本 schema は ingest 限定）。
    IngestProgress:
      type: object
      required: [state]
      properties:
        state:
          description: |
            原本の取り込みの粗い状態。**サーバー側で DB 行から毎回導出する**
            （列に焼いた値ではない）。優先順に:

            - `committed`: `kind='original'` の `media_assets` 行が存在する。
              取り込みは少なくとも 1 回完了した。その原本が**いま**あるかどうかは
              `sizeBytes` の有無で見る（`state='deleted'` の原本でもここは
              `committed` のまま --- 「取り込めなかった」と「取り込んだ後に
              消した」を混同しないため。issue #211）
            - `transferring`: 原本行が無く、転送の進捗行がある。`writtenBytes` /
              `observedAt` が付く。`observedAt` が古いまま止まっていれば停滞して
              いる（River のバックオフ待ち・ストール）
            - `pending`: 原本行も進捗行も無く、**ingest ジョブが投入される
              はずの** mirakc record の観測（`record_sync.status = 'finished'`。
              watcher が ingest を投入する条件と同じ述語）がある。取り込み待ち、
              または失敗して再試行待ち
            - `unknown`: 上のどれでもない。取り込みが始まった観測が無い ---
              mirakc record が観測されていないか、record が `finished` でない
              （録画中・`failed`・`canceled`。**この録画に ingest ジョブは
              投入されない**）

            **`pending` は「これから来る」の断定なので、来る根拠が無いものは
            入れない。** `record_sync` 行の存在だけを根拠にすると、`failed` /
            `canceled` の録画（ingest が一度も投入されず、`record_sync` 行も
            消えない）が永久に「取り込み待ち」を名乗る。

            **「リトライ中」を `pending` と区別する値は持たない。** 区別するには
            River の `river_job` を API 契約に露出させる（内部実装の露出）か、
            失敗の観測という別寿命の値を進捗行に混ぜる（不変条件 9 / 12）
            必要があり、どちらも取らなかった。停滞は `observedAt` の古さで読む。
          type: string
          enum: [committed, transferring, pending, unknown]
        writtenBytes:
          description: |
            転送先ファイルに書けたバイト数。`state = transferring` のときだけ付く。

            **これは「いまファイルに書けているバイト数」であって累積の転送実績
            ではない。** ジョブ再試行（部分ファイルを truncate してゼロから
            作り直す。docs/recording/ingest.md §5.3 の層 2）で 0 に戻ることが
            ある。戻りを隠さないのは、隠すと「進んでいるのに終わらない」に見えて
            実際に起きているやり直しが観測できなくなるため。

            **`sizeBytes`（原本の実サイズ）とは別のフィールドである。** コミット =
            DB 行（不変条件 3）なので、コミット前の途中ファイルのサイズを
            `sizeBytes` に混ぜない。
          type: integer
          format: int64
        expectedBytes:
          description: |
            転送の分母。`record_sync.content_length`（watcher が mirakc record の
            `content.length` として観測した値）を転送開始時に写したもの。mirakc が
            length を返していなければ**省略する** --- でっち上げた分母を置かない。
            省略時、UI は % を出さず `writtenBytes` だけを出す。
          type: integer
          format: int64
        observedAt:
          description: |
            進捗を最後に観測した時刻。`state = transferring` のときだけ付く。
            現在時刻との差が開いていれば転送は停滞している。常に UTC
            （"Z" 終端の RFC3339）で返す。
          type: string
          format: date-time

    # 再生可能な encoded 派生物 1 件（issue #236 M7-3）。
    EncodedAsset:
      type: object
      required: [profile]
      properties:
        profile:
          type: string
        sizeBytes:
          description: |
            encoded 派生物の実サイズ。`media_assets.size_bytes` は NOT NULL
            なので active な行が存在する限り常に付く（未検証の断言にしないため:
            `media_assets.size_bytes` 列の `NOT NULL` 制約が根拠、実行時計測
            ではない。同テーブルの CHECK は
            `kind` / `profile` / `state` に掛かるものだけで `size_bytes` には
            無い）。省略可能にしているのは、サイズが取れない資産があっても
            選択肢そのものは隠さない（ドロップ統計の「分類できなかった PID」と
            同じ判断。docs/frontend/recordings.md）という UI 側の表示規律を
            型で表現するため。
          type: integer
          format: int64

    # 完了していないエンコードプロファイル 1 件の試行状態（issue #316）。
    EncodeJobStatus:
      type: object
      required: [profile, state]
      properties:
        profile:
          type: string
        state:
          description: |
            **サーバー側で recording_encode_attempts（衛星表）から毎回導出する**
            （列に焼いた値ではない）。River の river_job は直接露出しない
            （docs/schema.md の recording_encode_attempts の節を参照。
            docs/recording/ingest.md §5.6 と共通なのは「river_job を露出しない」
            ことだけで、§5.6 の「リトライ中と待ちを区別しない」判断とは逆に
            この表は区別する）。

            - `queued`: まだ 1 度も試行が始まっていない（試行行が無い状態）。
              **一度 `running`/`failed` を書いた行は成功するまで消えないので、
              失敗後に `queued` へ戻ることはない**。「来る根拠」の無い
              `queued` は出さない --- ごみ箱の録画（ジョブが二度と投入されない）
              と、api が現在の設定にあるプロファイル一覧を知っていて、かつ
              そのプロファイルが設定から消えていて試行行も無い場合は、この
              プロファイルの要素自体が省略される
            - `running`: いま ffmpeg が走っている
            - `failed`: 直前の試行が失敗した。**`failed` は「二度と来ない」の
              断定ではない** --- 失敗したジョブはジョブキューの既定のリトライ
              上限（25 回。上書きしていない）まで再実行され、その各試行の先頭で
              `running` に戻る。上限に達した後も、encoded 資産が無い状態が続く
              限り EncodeReconcileWorker が 15 分ごとに再投入する。例外は設定
              から消えたプロファイルで、これは EncodeReconcileWorker の既知
              プロファイル絞り込みが投入対象から外すため、リトライ上限に達した
              ところで `failed` に留まる（**`failed` に固定されるのはリトライを
              使い切った後で、最初の失敗の時点ではない**）
          type: string
          enum: [queued, running, failed]

    # PID 別 drop_stats の合計。内訳は /api/recordings/{id}/drop-stats。
    DropSummary:
      type: object
      required: [packets, drops, errors, scrambled]
      properties:
        packets:
          type: integer
          format: int64
        drops:
          type: integer
          format: int64
        errors:
          type: integer
          format: int64
        scrambled:
          type: integer
          format: int64

    # --- チューナー容量超過 (M2-10, issue #21 / docs/data.md §6.5) ---
    #
    # 区間の性質だけを返す。どの番組・どの予約が負けるかは主張しない。
    CapacityOverage:
      type: object
      required: [site, startAt, endAt, shortfall, jammedTypes]
      properties:
        site:
          description: |
            判定はサイトごとに独立して行う。N 予約の決定（docs/recording.md §3.1）に
            より予約が site に束縛されるため二部グラフがサイトごとに非連結になり、
            Hall の条件を成分ごとに確認すれば十分になる。
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        shortfall:
          description: |
            不足本数。破れた種別部分集合 A の `Σ_{t∈A} d[t] − cap(A)` の最大値。
            1 以上（0 なら超過していないので区間そのものが返らない）
          type: integer
        jammedTypes:
          description: 詰まった種別（Hall 条件を破った部分集合 A）。「BS が 1 本不足」と言うための材料
          type: array
          items:
            type: string
            enum: [GR, BS, CS, SKY]

    DropStat:
      type: object
      required: [pid, packets, drops, errors, scrambled]
      properties:
        pid:
          type: integer
        packets:
          type: integer
          format: int64
        drops:
          type: integer
          format: int64
        errors:
          type: integer
          format: int64
        scrambled:
          type: integer
          format: int64
        pidType:
          description: |
            PID 種別（M2-13, issue #24）。**値はすべて小文字**で、権威は Go 側の定数
            （`internal/tsstat`）。enum にしないのは分類の追加をスキーマ変更なしで
            できるようにするため（`drop_stats.pid_type` に CHECK を置かないのと同じ理由）。

            - `video` / `audio` --- PMT の stream_type から分類した ES
            - `other` --- PMT に載っているが映像でも音声でもない ES（字幕・文字スーパー・
              データ放送はすべてここ。記述子を読まないため字幕と文字スーパーは区別しない）
            - `pat` / `cat` / `nit` / `sdt` / `eit` / `tot` --- 固定 PID（静的表。解析不要）
            - `pmt` --- PAT が PMT の在り処として指した PID

            **分類できなければ省略する**（PSI 解析の失敗は ingest を失敗させない。
            docs/recording.md「例外の境界」）。省略は「分類しなかった」であって
            「該当なし」ではない
          type: string

    # --- Program intent (issue #29) ---

    ProgramIntentInput:
      type: object
      description: |
        PUT /api/sites/{site}/programs/{programId}/intent のボディ。
        `record` は「録れ」（手動予約、およびルール由来予約への上書き）。
        `skip` は「録るな」（どのルール経由でも一貫して除外される）。
      required:
        - action
      properties:
        action:
          type: string
          enum: [record, skip]

    # --- Program overrides (M2-4 / issue #29) ---

    ProgramOverridesInput:
      type: object
      description: |
        PATCH /api/sites/{site}/programs/{programId}/overrides のボディ。
        値を書いたフィールドは override を設定し、`reset` に名前を挙げた
        フィールドは override を削除する。どちらにも現れないフィールドは
        変更しない。同じフィールドを値と `reset` の両方に書いたら 400、
        `reset` に未知のフィールド名があっても 400（docs/recording.md §4.2）。
      properties:
        priority:
          type: integer
          description: |
            mirakc の schedule に反映される（reconciler が DELETE + POST で
            schedule を再作成する）。ただし録画開始後の recorder には
            効かない可能性が高い（docs/recording.md §4.5）。
        contentPath:
          type: string
          description: |
            明示指定した値は既存の schedule にも反映される（reconciler が
            DELETE + POST で張り替える）。ただし録画が始まった schedule には
            反映されない（docs/recording.md §4.5）。空文字は 400（override を
            消すのは `reset`。消しても既存 schedule のパスは変わらない）。
        filenameTemplate:
          type: string
          description: |
            Go text/template のテンプレート文字列。既存の schedule には
            反映されず、まだ schedule が作られていない予約にだけ効く
            （docs/recording.md §4.5）。`contentPath` を明示指定すればそちらは
            既存の schedule にも反映される（このフィールドとの違い）。
        keepOriginal:
          type: string
          enum: [always, until_encoded]
          description: |
            ingest が原本をコミットする tx の中で recording_encode_policy 行の
            INSERT として焼かれる（凍結される）瞬間まで効く。録画開始後の変更でも、
            放送終了・ingest 完了より前ならこの録画に反映されるが、ingest 完了後の
            変更はこの録画には反映されない（docs/recording/reservation-model.md
            §4.5）。

            **「ingest 完了より前なら必ず反映される」ではない** --- 凍結の導出元
            （program_snapshots と CASCADE で連なる予約系の表）は放送終了 +
            `epg.retention_grace`（既定 24h）で GC されるため、エッジに record が
            滞留して ingest がそれを超えて遅れると、指定は効かず既定値
            （keepOriginal=always / encodeProfiles=[]）で凍結される（原本は残る
            がエンコードは投入されない。docs/storage/retention.md §6「凍結が
            依存する寿命と、エッジの滞留の交点」）。
        encodeProfiles:
          type: array
          items:
            type: string
          description: |
            ingest が原本をコミットする tx の中で recording_encode_policy 行の
            INSERT として焼かれる（凍結される）瞬間まで効く。録画開始後の変更でも、
            放送終了・ingest 完了より前ならこの録画に反映されるが、ingest 完了後の
            変更はこの録画には反映されない（docs/recording/reservation-model.md
            §4.5）。

            **「ingest 完了より前なら必ず反映される」ではない** --- 凍結の導出元
            （program_snapshots と CASCADE で連なる予約系の表）は放送終了 +
            `epg.retention_grace`（既定 24h）で GC されるため、エッジに record が
            滞留して ingest がそれを超えて遅れると、指定は効かず既定値
            （keepOriginal=always / encodeProfiles=[]）で凍結される（原本は残る
            がエンコードは投入されない。docs/storage/retention.md §6「凍結が
            依存する寿命と、エッジの滞留の交点」）。
        reset:
          type: array
          items:
            type: string
            enum:
              - priority
              - contentPath
              - filenameTemplate
              - keepOriginal
              - encodeProfiles
          description: |
            指定したフィールドの override を削除する（フィールド単位の
            「ルールに戻す」）。値を書いたフィールドと重複して指定すると 400。

    # --- Program search (M2-2) — 条件形はルールと共有 ---

    ProgramSearchRequest:
      type: object
      description: |
        ルール条件の条件部分と同じ形。rulequery.Conditions に写像される。
        検索対象のサイトは `sites`（空または省略 = 全サイト）が決める。
      properties:
        isFree:
          type: boolean
          nullable: true
        durationMinMs:
          type: integer
          format: int64
          nullable: true
        durationMaxMs:
          type: integer
          format: int64
          nullable: true
        periodStartAt:
          type: string
          format: date-time
          nullable: true
        periodEndAt:
          type: string
          format: date-time
          nullable: true
        textMatches:
          type: array
          items:
            $ref: "#/components/schemas/RuleTextMatch"
        services:
          type: array
          items:
            $ref: "#/components/schemas/RuleService"
        channelTypes:
          type: array
          items:
            type: string
            enum: [GR, BS, CS, SKY]
        genres:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 15
        times:
          type: array
          items:
            $ref: "#/components/schemas/RuleTimeWindow"
        sites:
          type: array
          items:
            type: string
          description: >-
            絞り込み条件。空または省略 = 全サイト（`GET /api/recordings` の `?site=` と
            同じ軸の規約: 軸内は OR、他の絞り込み軸とは AND）。**非互換の変更**: 旧仕様は
            `sites` を `rule_sites` 相当の条件として扱い、空 = パスの {site}（評価 site）
            のみだった。

    ProgramSearchMatch:
      type: object
      required: [site, programId]
      description: 検索がマッチした 1 件（1 サイトの 1 放送）
      properties:
        site:
          type: string
          description: マッチした放送のサイト
        programId:
          type: integer
          format: int64

    # --- Rules (M2-1) ---

    RuleTextMatch:
      type: object
      required: [target, mode, value]
      properties:
        target:
          type: string
          enum: [name, description, extended]
        mode:
          type: string
          enum: [keyword, regex]
          description: keyword = 部分一致 / regex = POSIX ARE
        value:
          type: string
        caseSensitive:
          type: boolean
          default: false
        negate:
          type: boolean
          default: false
          description: true なら除外条件

    RuleService:
      type: object
      required: [networkId, serviceId]
      properties:
        networkId:
          type: integer
        serviceId:
          type: integer

    RuleTimeWindow:
      type: object
      required: [weekdays, startSec, endSec]
      properties:
        weekdays:
          type: integer
          minimum: 1
          maximum: 127
          description: bit0=月 … bit6=日
        startSec:
          type: integer
          minimum: 0
          maximum: 86400
        endSec:
          type: integer
          minimum: 0
          maximum: 86400
          description: start より小さい場合は翌日跨ぎ

    RuleInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
          default: true
        priority:
          type: integer
          default: 10
        isFree:
          type: boolean
          nullable: true
          description: null = 問わない
        durationMinMs:
          type: integer
          format: int64
          nullable: true
        durationMaxMs:
          type: integer
          format: int64
          nullable: true
        periodStartAt:
          type: string
          format: date-time
          nullable: true
        periodEndAt:
          type: string
          format: date-time
          nullable: true
        textMatches:
          type: array
          items:
            $ref: "#/components/schemas/RuleTextMatch"
        services:
          type: array
          items:
            $ref: "#/components/schemas/RuleService"
        channelTypes:
          type: array
          items:
            type: string
            enum: [GR, BS, CS, SKY]
        genres:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 15
          description: genre lv1
        times:
          type: array
          items:
            $ref: "#/components/schemas/RuleTimeWindow"
        sites:
          type: array
          items:
            type: string
          description: >-
            空または省略 = 全サイト。指定する各要素は GET /api/sites が返す既知の site
            名でなければならず、レジストリに無い名前（タイポ含む）や空文字列は 400 になる。更新では、そのルールに既に保存されている site
            名だけは既知として扱う（GET で得た sites
            を載せ直す更新が、レジストリから site が消えた後も通るように）。免除は更新対象のルール単位なので
            **作成では効かない** ——
            既存ルールの sites をそのまま載せて別のルールを作る（フォーク）場合、レジストリから消えた site
            名は 400 になる。`POST /api/sites/{site}/programs/search` の `sites`
            も同じ「空または省略 = 全サイト」の軸規約を使うが、一回限りの問い合わせで
            保存された行を持たないため、既知名検証と更新時の免除はルールの保存にのみ
            適用される。
        dedupeEnabled:
          type: boolean
          default: false
        dedupeThreshold:
          type: number
          format: float
          nullable: true
          exclusiveMinimum: 0
          maximum: 1
          description: |
            pg_trgm の similarity() と比較する閾値。similarity() の値域は [0, 1] なので
            この範囲外は無意味。0 を許すと similarity() >= 0 が常に真になり、finished の
            録画が 1 本でもあれば以降の全番組が重複扱いで黙ってスキップされる
            （録画が黙って止まる）。1 を超えると常に偽になり、重複排除が黙って無効化される。
        dedupeWindowSeconds:
          type: integer
          format: int64
          nullable: true
          exclusiveMinimum: 0
          description: |
            重複排除の時間窓（秒）。interval の API 表現。省略（null）が「時間窓なし」で、
            0 はその意味にはならない。0 以下を許すと
            `program_start_at >= now() - window` が現在以降の開始時刻を要求する形になり、
            比較対象は必ず過去の放送なので常に偽（重複排除が黙って無効化される）。
        keepOriginal:
          type: string
          enum: [always, until_encoded]
          default: always
        encodeProfiles:
          type: array
          items:
            type: string
        filenameTemplate:
          type: string
        metadata:
          type: object
          additionalProperties: true

    Rule:
      allOf:
        - $ref: "#/components/schemas/RuleInput"
        - type: object
          required: [id, name, enabled, priority, keepOriginal, createdAt, updatedAt]
          properties:
            id:
              type: integer
              format: int64
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    DeleteRuleResponse:
      type: object
      required: [id, deletedReservations, detachedReservations]
      properties:
        id:
          type: integer
          format: int64
        deletedReservations:
          type: integer
          description: overrides なしで削除した rule 予約の件数
        detachedReservations:
          type: integer
          description: overrides 付きで detached 化した件数

    Reservation:
      type: object
      required:
        - id
        - site
        - programId
        - source
        - state
        - title
        - serviceName
        - channelType
        - startAt
        - durationMs
        - createdAt
        - updatedAt
        - skip
      properties:
        id:
          type: integer
          format: int64
        site:
          description: |
            この予約がどのサイト（mirakc インスタンス）のものか。`reservations.site`
            そのままで、設定ファイルで定義されたサイト名（docs/schema.md §1-5）。

            チューナー容量超過の判定はサイトごとに独立しているため
            （docs/data.md §6.5）、予約一覧のバッジはこの値と超過区間の site を
            突き合わせる。M1/M2 は単一サイト構成なので実質 `default` 固定だが、
            **クライアントに定数を持たせない**（他サイトの不足を自分の不足として
            出す形で静かに壊れるのを避ける）。
          type: string
        programId:
          type: integer
          format: int64
        source:
          description: |
            導出値であり、reservations テーブルの列ではない（issue #26）。
            ユーザーが録れと指定した番組（program_intents に action=record の行が
            ある）なら manual、無ければ rule。ルールが今まさにこの予約に
            base を供給しているか（ruleId の有無）とは無関係で、手動予約に
            ルールがマッチしていても manual のまま変わらない。
          type: string
          enum: [rule, manual]
        ruleId:
          type: integer
          format: int64
        state:
          type: string
          enum: [active, detached, orphaned]
        overrides:
          type: object
        title:
          type: string
        serviceName:
          description: |
            番組スナップショット（program_snapshots.service_name）由来のチャンネル
            表示名。同じタイトルが日付・局違いで並ぶと区別できないため（issue #302）、
            recordings と同じ形でここにも載せる。
          type: string
        channelType:
          description: |
            予約時点のスナップショット（program_snapshots 由来）。
          type: string
          enum: [GR, BS, CS, SKY]
        startAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        skip:
          description: |
            effective.skip（M2-6, issue #24）。program_intents.action='skip' の
            明示、または意図が無く base.skip（ルールの重複排除判定）が true。
            true の間 reconciler は mirakc に同期しないが、予約行自体は
            「なぜ録られていないか」を説明するため残る。
          type: boolean
        dedupMatchRecordingId:
          description: 履歴ベース重複排除でマッチした録画の ID（マッチが無ければ省略）
          type: integer
          format: int64
        dedupSimilarity:
          description: 上記マッチの pg_trgm 類似度（0.0〜1.0、マッチが無ければ省略）
          type: number
          format: float

    # --- 予約の重なり警告 (M2-8, issue #24 / #21) ---
    #
    # チューナー本数を見ない「案 C」。件数と内訳だけを返し、勝敗・可否は主張しない
    # （断定は M2-10 の tuner_sync 射影 + 容量判定の領分。docs/data.md §6.5）。

    ProgramOverlaps:
      type: object
      required:
        - count
        - reservations
      properties:
        count:
          description: 重なっている既存予約の件数（自分自身を除く）
          type: integer
        reservations:
          description: 内訳。件数だけでなく何と重なっているかをユーザーが判断できるようにする
          type: array
          items:
            $ref: "#/components/schemas/OverlappingReservation"

    OverlappingReservation:
      type: object
      required:
        - id
        - programId
        - title
        - startAt
        - durationMs
      properties:
        id:
          type: integer
          format: int64
        programId:
          type: integer
          format: int64
        title:
          type: string
        startAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64

    # --- Circuit breakers (M2-5) ---

    CircuitBreaker:
      type: object
      description: |
        発動中の大量削除サーキットブレーカー 1 件（`circuit_breakers` 行 = 発動中。
        docs/recording.md §3.2）。
      required:
        - site
        - name
        - trippedAt
        - pending
        - threshold
        - detail
      properties:
        site:
          type: string
        name:
          type: string
          enum: [ruler_deletes, reconcile_total_loss, delete_reconcile]
          description: |
            internal/breaker の定数（RulerDeletes / ReconcileTotalLoss /
            DeleteReconcile）。値の権威は internal/breaker.All
            （internal/breaker/breaker.go）で、この enum はそれを手で複製した
            ものなので、breaker.All に定数を足したときはここも合わせて直す。

            ずれの検知は 2 段構え: internal/breaker パッケージのエクスポート
            済み文字列定数と All 自体の一致は internal/breaker の AST テスト
            （TestAll_MatchesDeclaredConstants）が見る。All とこの enum の
            一致は internal/api の純ユニットテスト
            （TestBreakerAllNamesAreValidCircuitBreakerNameEnumMembers。
            CircuitBreakerName.Valid() 経由）が見る。後者を GET /api/breakers
            の runtime チェックにはしていない —— 消費者
            （web/src/components/circuit-breaker-banner.tsx・web/src/pages/home.tsx）
            が isError を見ておらず、enum 外の 1 行のせいで一覧全体を 500 に
            すると発動中の他のブレーカーまで隠れてしまうため（issue #199 の
            レビューで指摘）。
        trippedAt:
          type: string
          format: date-time
          description: |
            発動した時刻（最初の発動時刻。再発動で更新されるのは pending /
            threshold / detail のみ）。
        pending:
          type: integer
          description: 発動時に止めた削除の件数。
        threshold:
          type: integer
          description: 発動時の閾値。
        detail:
          $ref: "#/components/schemas/CircuitBreakerSample"

    CircuitBreakerSample:
      type: object
      description: |
        発動時に「何が消されようとしていたか」を説明する抜粋
        （`internal/breaker.Sample` と同じ形。手動確認の材料）。
      required:
        - total
      properties:
        total:
          type: integer
          description: 止めた削除の総数。
        programs:
          type: array
          description: 先頭いくつかの抜粋（`internal/breaker.MaxSampleSize` 件まで）。
          items:
            $ref: "#/components/schemas/CircuitBreakerSampleProgram"

    CircuitBreakerSampleProgram:
      type: object
      required:
        - programId
      properties:
        programId:
          type: integer
          format: int64
        title:
          type: string

    EncodeQueueSummary:
      type: object
      description: active なエンコードジョブの件数（録画 × プロファイル単位）。
      required: [queued, running]
      properties:
        queued:
          type: integer
          format: int64
          minimum: 0
          description: 待機中（available / pending / scheduled / retryable）のジョブ数。
        running:
          type: integer
          format: int64
          minimum: 0
          description: 実行中のジョブ数。

    StorageRoot:
      type: object
      description: |
        1 つのストレージ root（`storage.media_dir` または `storage.scratch_dir`）の
        容量観測 1 件（`storage_sync` 行そのもの。issue #238 M7-5）。
      required:
        - root
        - path
        - totalBytes
        - usedBytes
        - availableBytes
        - observedAt
      properties:
        root:
          type: string
          enum: [media, scratch]
          description: |
            config キー（`storage.media_dir` / `storage.scratch_dir`）と 1:1。
        path:
          type: string
          description: |
            観測対象の絶対パス（config の値そのもの）。他のフィールドと同じく
            `observedAt` 時点のスナップショット --- config の path を変更した
            直後に statfs が失敗すると、次の成功する観測まで**古い path のまま**
            残る（バイト数も同様に古い値のまま）。現在の設定を保証しない。
        totalBytes:
          type: integer
          format: int64
          description: |
            ファイルシステム全体の容量（`observedAt` 時点のスナップショット。
            `path` の説明を参照）。
        usedBytes:
          type: integer
          format: int64
          description: |
            root 予約領域を使用済み側に数えた使用量（total - free）。
            `observedAt` 時点のスナップショット。
        availableBytes:
          type: integer
          format: int64
          description: |
            非特権プロセスが実際に書き込める残量（statfs の Bavail）。
            「残高」として UI に出すべき数字はこちら。`observedAt` 時点の
            スナップショット。
        observedAt:
          type: string
          format: date-time
          description: |
            この行を最後に観測できた時刻。観測ループが止まっていても行は
            消えないため、この値の鮮度だけが異常の手がかりになる。
