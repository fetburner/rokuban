openapi: "3.1.0"
info:
  title: Rokuban API
  version: 0.0.1
  description: Cloud-native recording server API

paths:
  /healthz:
    get:
      operationId: healthz
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/version:
    get:
      operationId: getVersion
      summary: Get server version
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /api/reservations:
    get:
      operationId: listReservations
      summary: List reservations
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reservation"
    post:
      operationId: createReservation
      summary: Create a manual reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "409":
          description: Conflict (duplicate programId)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/reservations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      operationId: getReservation
      summary: Get a reservation
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteReservation
      summary: Cancel a reservation
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    VersionResponse:
      type: object
      required:
        - version
      properties:
        version:
          type: string
          example: 0.0.1

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string

    CreateReservationRequest:
      type: object
      required:
        - programId
        - title
        - startAt
        - durationMs
      properties:
        programId:
          type: integer
          format: int64
        title:
          type: string
        startAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
        priority:
          type: integer

    Reservation:
      type: object
      required:
        - id
        - programId
        - source
        - state
        - title
        - startAt
        - durationMs
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
        programId:
          type: integer
          format: int64
        source:
          type: string
          enum: [rule, manual]
        ruleId:
          type: integer
          format: int64
        state:
          type: string
          enum: [active, detached, orphaned]
        overrides:
          type: object
        title:
          type: string
        startAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
