version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam
    - nilerr
    - errorlint
    - funlen

  settings:
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    funlen:
      lines: 150
      statements: -1

issues:
  new-from-rev: origin/main

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/fetburner/rokuban
