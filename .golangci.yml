version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam
    - nilerr
    - errorlint
    - funlen
    - gocognit
    - depguard
    - gocritic

  settings:
    # gocritic は rokuban 固有のルール（tools/lintrules）を ruleguard で読むためだけに使う。
    # failOn が無いと DSL の読み込み失敗が「ルール 0 件」で黙って通る。
    gocritic:
      disable-all: true
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          rules: "${config-path}/tools/lintrules/rules.go"
          failOn: all
    depguard:
      rules:
        api-role:
          # API のテストは worker の実ジョブを使う統合テストなので、ここでは
          # 本番コードの import 境界だけを判定する。
          list-mode: lax
          files:
            - "${config-path}/internal/api/**"
            - "!$test"
          deny:
            - pkg: github.com/fetburner/rokuban/internal/worker
              desc: api role must not depend on worker execution
            - pkg: github.com/fetburner/rokuban/internal/mirakc
              desc: api role must not depend on the mirakc client
            - pkg: github.com/fetburner/rokuban/internal/mediapath
              desc: api role must not depend on filesystem paths
            - pkg: github.com/fetburner/rokuban/internal/ffargs
              desc: api role must not depend on ffmpeg arguments
            - pkg: github.com/fetburner/rokuban/internal/tsstat
              desc: api role must not depend on transport-stream inspection
            - pkg: os/exec
              desc: api role must not execute external processes
            - pkg: github.com/riverqueue/river
              desc: api role enqueues through jobq.Enqueuer, not River
            - pkg: github.com/fetburner/rokuban/internal/store/pgstore
              desc: api persistence uses store contracts, not PostgreSQL implementations
        store-contract-database-boundary:
          # store の契約は pgx と生成 SQL に依存させない。
          list-mode: lax
          files:
            - "${config-path}/internal/store/**"
            - "!${config-path}/internal/store/pgstore/**"
          deny:
            - pkg: github.com/jackc/pgx/v5
              desc: store contracts do not depend on pgx
            - pkg: github.com/fetburner/rokuban/internal/db/sqlcgen
              desc: store contracts do not depend on generated database queries

        db-import-boundary:
          # pgx と生成 SQL は pgstore と DB 基盤に閉じ込める。テストは統合 DB の状態作りに使うため除外する。
          # pgx の恒久の例外（riveradapter など）は sqlcgen-composition-roots が sqlcgen だけを禁止する。
          list-mode: lax
          files:
            - "${config-path}/**"
            - "!$test"
            - "!${config-path}/internal/store/pgstore/**"
            - "!${config-path}/internal/db/**"
            - "!${config-path}/internal/jobq/riveradapter/**"
            - "!${config-path}/internal/notifier/pgsource/**"
            - "!${config-path}/internal/role/leader.go"
            - "!${config-path}/internal/testutil/**"
            - "!${config-path}/cmd/rokuban/**"
            # 移設待ち。移したタスクが行を消す。増やさない。
            - "!${config-path}/internal/api/breakers.go"
            - "!${config-path}/internal/api/capacity.go"
            - "!${config-path}/internal/api/capacity_preview.go"
            - "!${config-path}/internal/api/cm_detect.go"
            - "!${config-path}/internal/api/encode_queue.go"
            - "!${config-path}/internal/api/epg.go"
            - "!${config-path}/internal/api/handler.go"
            - "!${config-path}/internal/api/label_rules.go"
            - "!${config-path}/internal/api/program_intent.go"
            - "!${config-path}/internal/api/program_overrides.go"
            - "!${config-path}/internal/api/program_reservation.go"
            - "!${config-path}/internal/api/recordings.go"
            - "!${config-path}/internal/api/recordings_query.go"
            - "!${config-path}/internal/api/reservations_overlaps.go"
            - "!${config-path}/internal/api/router.go"
            - "!${config-path}/internal/api/rules.go"
            - "!${config-path}/internal/api/search.go"
            - "!${config-path}/internal/api/storage.go"
            - "!${config-path}/internal/api/tuners.go"
            - "!${config-path}/internal/breaker/breaker.go"
            - "!${config-path}/internal/capacity/load.go"
            - "!${config-path}/internal/capacity/preview.go"
            - "!${config-path}/internal/catalog/export.go"
            - "!${config-path}/internal/catalog/rescue.go"
            - "!${config-path}/internal/catalog/rescue_scan.go"
            - "!${config-path}/internal/epgimport/library.go"
            - "!${config-path}/internal/epgimport/rule.go"
            - "!${config-path}/internal/epgimport/util.go"
            - "!${config-path}/internal/inplace/register.go"
            - "!${config-path}/internal/jobq/jobqfake/fake.go"
            - "!${config-path}/internal/metrics/backlog.go"
            - "!${config-path}/internal/metrics/loop_pass.go"
            - "!${config-path}/internal/metrics/presync.go"
            - "!${config-path}/internal/reconciler/reconciler.go"
            - "!${config-path}/internal/reservation/source.go"
            - "!${config-path}/internal/reservation/sync.go"
            - "!${config-path}/internal/rulequery/load.go"
            - "!${config-path}/internal/rulequery/query.go"
            - "!${config-path}/internal/ruler/dedupe.go"
            - "!${config-path}/internal/ruler/ruler.go"
            - "!${config-path}/internal/ruler/sql.go"
            - "!${config-path}/internal/streamer/chase.go"
            - "!${config-path}/internal/streamer/frame.go"
            - "!${config-path}/internal/streamer/live.go"
            - "!${config-path}/internal/streamer/original_vod.go"
            - "!${config-path}/internal/streamer/streamer.go"
            - "!${config-path}/internal/tsscan/worker.go"
            - "!${config-path}/internal/watcher/program_snapshot.go"
            - "!${config-path}/internal/watcher/watcher.go"
            - "!${config-path}/internal/worker/catalog_export.go"
            - "!${config-path}/internal/worker/cm_detect.go"
            - "!${config-path}/internal/worker/cm_detect_reconcile.go"
            - "!${config-path}/internal/worker/cm_logo_candidate.go"
            - "!${config-path}/internal/worker/delete_execute.go"
            - "!${config-path}/internal/worker/delete_reconcile.go"
            - "!${config-path}/internal/worker/delete_select.go"
            - "!${config-path}/internal/worker/encode.go"
            - "!${config-path}/internal/worker/encode_attempts.go"
            - "!${config-path}/internal/worker/encode_profile_meaning.go"
            - "!${config-path}/internal/worker/encode_reconcile.go"
            - "!${config-path}/internal/worker/epg.go"
            - "!${config-path}/internal/worker/ingest.go"
            - "!${config-path}/internal/worker/ingest_progress.go"
            - "!${config-path}/internal/worker/label_rule_reconcile.go"
            - "!${config-path}/internal/worker/media_asset_namespace.go"
            - "!${config-path}/internal/worker/media_asset_publish.go"
            - "!${config-path}/internal/worker/reconcile_pass.go"
            - "!${config-path}/internal/worker/record_sweep.go"
            - "!${config-path}/internal/worker/ruler_pass.go"
            - "!${config-path}/internal/worker/seek_tiles.go"
            - "!${config-path}/internal/worker/storage.go"
            - "!${config-path}/internal/worker/storage_audit.go"
            - "!${config-path}/internal/worker/thumbnail.go"
            - "!${config-path}/internal/worker/thumbnail_reconcile.go"
            - "!${config-path}/internal/worker/thumbnail_selection.go"
            - "!${config-path}/internal/worker/tuner.go"
            - "!${config-path}/internal/worker/worker.go"
          deny:
            - pkg: github.com/jackc/pgx
              desc: pgx imports are limited to pgstore, the database foundation and composition roots
            - pkg: github.com/fetburner/rokuban/internal/db/sqlcgen
              desc: generated database queries are limited to pgstore and the database foundation
        sqlcgen-composition-roots:
          # pgx の恒久の例外でも、生成 SQL は使わせない。
          list-mode: lax
          files:
            - "${config-path}/internal/jobq/riveradapter/**"
            - "${config-path}/internal/notifier/pgsource/**"
            - "${config-path}/internal/role/leader.go"
            - "${config-path}/internal/testutil/**"
            - "${config-path}/cmd/rokuban/**"
            - "!$test"
          deny:
            - pkg: github.com/fetburner/rokuban/internal/db/sqlcgen
              desc: generated database queries are limited to pgstore and the database foundation
        river-adapter-only:
          # River の型はテストも含め runtime adapter の境界に閉じ込める。
          # KEDA の SQL テストだけは YAML の状態名を River のスキーマと照合する。
          list-mode: lax
          files:
            - "${config-path}/**"
            - "!${config-path}/internal/jobq/riveradapter/**"
            - "!${config-path}/deploy/k8s/workloads_test.go"
          deny:
            - pkg: github.com/riverqueue/river
              desc: River imports are limited to internal/jobq/riveradapter
        riveradapter-import:
          # River adapter の直接 import は内部の本番コードで禁止する。
          # worker.go だけは River の公開登録 API が具体型を要求するため例外にする。
          # testutil はテスト DB の作成で riveradapter/migrate を使うため除外する。
          # cmd/ は構成の根として adapter を組み立てるので、そもそも対象にしない。
          list-mode: lax
          files:
            - "${config-path}/internal/**"
            - "!${config-path}/internal/jobq/riveradapter/**"
            - "!${config-path}/internal/worker/worker.go"
            - "!${config-path}/internal/testutil/**"
            - "!$test"
          deny:
            - pkg: github.com/fetburner/rokuban/internal/jobq/riveradapter
              desc: use the neutral jobq contracts; only cmd/ wires the River adapter
        riveradapter-allowlist:
          # adapter は契約（jobq）とエンジン（river / pgx）だけに依存する。製品の方針
          # （どのジョブを何分で）は jobq.WorkerSpec として cmd/rokuban から渡される。
          # 禁止リストで jobs / tsscan / config を塞ぐと他の製品パッケージへの依存が
          # 通るので、許可リストにする。テストは jobs の Args を fixture に使ってよい。
          list-mode: strict
          files:
            - "${config-path}/internal/jobq/riveradapter/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/fetburner/rokuban/internal/db
            - github.com/fetburner/rokuban/internal/jobq
            - github.com/jackc/pgx
            - github.com/riverqueue/river
        notifier-db-source:
          # notifier の EventHub と SSE 配信は DB を知らない。DB への接続は Source の
          # 実装のサブパッケージに閉じ込める。テストは実 DB を使う統合テストを含むので対象外。
          list-mode: lax
          files:
            - "${config-path}/internal/notifier/**"
            - "!${config-path}/internal/notifier/pgsource/**"
            - "!$test"
          deny:
            - pkg: github.com/jackc/pgx
              desc: notifier reaches the database only through a Source subpackage
            - pkg: github.com/fetburner/rokuban/internal/db
              desc: notifier reaches the database only through a Source subpackage
            - pkg: database/sql
              desc: notifier reaches the database only through a Source subpackage
        exec-role:
          # os/exec は worker/streamer が実行に使い、config は LookPath で
          # ツールの存在だけを検証する。テストの子プロセス起動は対象外。
          list-mode: lax
          files:
            - "!$test"
            - "!${config-path}/internal/worker/**"
            - "!${config-path}/internal/streamer/**"
            - "!${config-path}/internal/config/**"
          deny:
            - pkg: os/exec
              desc: os/exec is limited to worker, streamer, and config
        worker-tsstat:
          # 不変条件 6: ingest は TS を読まず、TS の読者は解析ジョブへ閉じ込める。
          list-mode: lax
          files:
            - "${config-path}/internal/worker/**"
            - "!$test"
          deny:
            - pkg: github.com/fetburner/rokuban/internal/tsstat
              desc: ingest and other workers must not inspect transport streams (invariant 6)
        ts-inspection:
          # 不変条件 6: 放送 TS を読むのは internal/tsstat を使う解析ジョブだけ。
          # テストは TS のフィクスチャを組み立てるのに gots を使うので対象外。
          list-mode: lax
          files:
            - "!$test"
            - "!${config-path}/internal/tsstat/**"
          deny:
            - pkg: github.com/Comcast/gots
              desc: transport-stream parsing is limited to internal/tsstat (invariant 6)
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    funlen:
      lines: 150
      statements: -1
    gocognit:
      # whole-files: true は触れたファイルの既存関数まで検査するので、閾値が
      # 既存の最大値を下回ると無関係な PR が落ちる。既存の関数を全部直す義務は
      # 作らず、lint が見る既定ビルド（テスト・生成物を除く）の現在の最大値を
      # 閾値にして「今より悪くしない」天井だけを守る。gocognit は閾値を超えた
      # 関数だけを報告する。build tag conformance のファイルは lint 対象外なので
      # 基準に含めない。
      min-complexity: 54

  exclusions:
    # docs:lint のためにリポジトリ直下へ入る node_modules に Go のパッケージ
    # （flatted）が同梱されていて、./... がそれを拾う。
    paths:
      - "(^|/)node_modules/"
    rules:
      - path: "_test\\.go$"
        linters:
          - gocognit

issues:
  # 明示的に --new-from-rev 等で差分 lint する実行向け。
  # funlen は issue 位置を func 宣言行に付けるため、本体だけの変更も検出できるよう
  # 変更ファイル全体を対象にする。
  whole-files: true

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/fetburner/rokuban
