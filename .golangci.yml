version: "2"

# build tag の付いたファイルも型検査と lint に入れる。タグ無しの build・vet・test・lint は
# これらを見ないので、s3conformance / conformance のテストの参照切れや、タグ付きだけが
# 使う関数を unused と誤報する指摘は、CI の専用ジョブでしか出ない。
# 案 A（lint に入れる）を選んだ理由: unused の誤報に従って使われている関数を消すと、
# 消した後にタグ付きの識別子が参照切れになる。それを消す前に止めるには lint が見る必要がある。
run:
  build-tags:
    - s3conformance
    - conformance

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam
    - nilerr
    - errorlint
    - funlen
    - gocognit
    - depguard
    - gocritic

  settings:
    # gocritic は rokuban 固有のルール（tools/lintrules）を ruleguard で読むためだけに使う。
    # failOn が無いと DSL の読み込み失敗が「ルール 0 件」で黙って通る。
    gocritic:
      disable-all: true
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          rules: "${config-path}/tools/lintrules/rules.go"
          failOn: all
    depguard:
      rules:
        aws-sdk-s3-implementation-only:
          # The AWS SDK is imported only by the S3 object-store adapter and by the
          # object-store conformance tests; no other package, test files included.
          list-mode: lax
          files:
            - "${config-path}/**"
            - "!${config-path}/internal/objstore/s3store/**"
            - "!${config-path}/internal/objstore/conformance/**"
          deny:
            - pkg: github.com/aws/aws-sdk-go-v2
              desc: AWS SDK imports are limited to the S3 object-store adapter
            - pkg: github.com/aws/smithy-go
              desc: Smithy imports are limited to the S3 object-store adapter
        api-role:
          # API のテストは worker の実ジョブを使う統合テストなので、ここでは
          # 本番コードの import 境界だけを判定する。
          list-mode: lax
          files:
            - "${config-path}/internal/api/**"
            - "!$test"
          deny:
            - pkg: github.com/fetburner/rokuban/internal/worker
              desc: api role must not depend on worker execution
            - pkg: github.com/fetburner/rokuban/internal/mirakc
              desc: api role must not depend on the mirakc client
            - pkg: github.com/fetburner/rokuban/internal/mediapath
              desc: api role must not depend on filesystem paths
            - pkg: github.com/fetburner/rokuban/internal/storemarker
              desc: api role must not read filesystem store markers
            - pkg: github.com/fetburner/rokuban/internal/ffargs
              desc: api role must not depend on ffmpeg arguments
            - pkg: github.com/fetburner/rokuban/internal/tsstat
              desc: api role must not depend on transport-stream inspection
            - pkg: os/exec
              desc: api role must not execute external processes
            - pkg: github.com/riverqueue/river
              desc: api role enqueues through jobq.Enqueuer, not River
        jobs-contract-leaf:
          # jobs は共有のジョブ契約。mirakc に依存すると、契約を import する api まで届く（不変条件 1）。
          # store も入れないのは、共有の契約を store より下に保つため（api は store に正当に依存する）。
          list-mode: lax
          files:
            - "${config-path}/internal/jobs/**"
            - "!$test"
          deny:
            - pkg: github.com/fetburner/rokuban/internal/mirakc
              desc: jobs is a shared contract that api imports; it must not depend on the mirakc client (invariant 1)
            - pkg: github.com/fetburner/rokuban/internal/store
              desc: jobs is a shared contract; it stays below store (site defaults live in internal/sitename)
        metrics-instruments-leaf:
          # 計器の定義だけを持つ。internal の他のパッケージを一切 import させない。
          # DB を引く collector は internal/metrics/dbcollector にある。
          list-mode: lax
          files:
            - "${config-path}/internal/metrics/*.go"
            - "!$test"
          deny:
            - pkg: github.com/fetburner/rokuban/internal
              desc: instruments import no internal package; DB-reading collectors live in internal/metrics/dbcollector, object-store error classification in internal/objstore
        pgstore-composition-root:
          # PostgreSQL 実装の組み立ては cmd/rokuban に置く。この規則はテストと pgstore 自身を検査しない。
          list-mode: lax
          files:
            - "${config-path}/**"
            - "!$test"
            - "!${config-path}/internal/store/pgstore/**"
            - "!${config-path}/cmd/rokuban/**"
            # s3conformance タグの単独バイナリ（CI の browser-s3-302 job が go build する）。cmd/rokuban と同じ組み立ての根。
            # テストではないので !$test では除外されない。
            - "!${config-path}/internal/streamer/conformance/**"
          deny:
            - pkg: github.com/fetburner/rokuban/internal/store/pgstore
              desc: PostgreSQL store implementations are constructed only in cmd/rokuban
        pgstoretest-test-only:
          # pgstoretest はテスト用。pgstore-composition-root は cmd/rokuban を検査から外すので、
          # pgstoretest の import はこの規則で cmd/rokuban も含めて止める。
          list-mode: lax
          files:
            - "${config-path}/**"
            - "!$test"
          deny:
            - pkg: github.com/fetburner/rokuban/internal/store/pgstore/pgstoretest
              desc: pgstoretest is only for test store construction
        store-contract-database-boundary:
          # store の契約は pgx と生成 SQL に依存させない。
          list-mode: lax
          files:
            - "${config-path}/internal/store/**"
            - "!${config-path}/internal/store/pgstore/**"
          deny:
            - pkg: github.com/jackc/pgx/v5
              desc: store contracts do not depend on pgx
            - pkg: github.com/fetburner/rokuban/internal/db/sqlcgen
              desc: store contracts do not depend on generated database queries

        db-import-boundary:
          # pgx と生成 SQL は pgstore と DB 基盤に閉じ込める。`internal/db` 自体も、下の除外以外のパッケージから import させない。テストは統合 DB の状態作りに使うため除外する。
          # pgx の恒久の例外（riveradapter など）は sqlcgen-composition-roots が sqlcgen だけを禁止する。
          list-mode: lax
          files:
            - "${config-path}/**"
            - "!$test"
            - "!${config-path}/internal/store/pgstore/**"
            - "!${config-path}/internal/db/**"
            - "!${config-path}/internal/jobq/riveradapter/**"
            - "!${config-path}/internal/notifier/pgsource/**"
            - "!${config-path}/internal/role/leader.go"
            - "!${config-path}/internal/testutil/**"
            - "!${config-path}/cmd/rokuban/**"
            # s3conformance タグの単独バイナリ。PostgreSQL 実装と DB 基盤を組み立てる根（cmd/rokuban と同じ役目）。
            - "!${config-path}/internal/streamer/conformance/**"
          deny:
            - pkg: github.com/jackc/pgx
              desc: pgx imports are limited to pgstore, the database foundation and composition roots
            - pkg: github.com/fetburner/rokuban/internal/db
              desc: application packages depend on the store contract, not the database foundation
            - pkg: github.com/fetburner/rokuban/internal/db/sqlcgen
              desc: generated database queries are limited to pgstore and the database foundation
        sqlcgen-composition-roots:
          # pgx の恒久の例外でも、生成 SQL は使わせない。
          list-mode: lax
          files:
            - "${config-path}/internal/jobq/riveradapter/**"
            - "${config-path}/internal/notifier/pgsource/**"
            - "${config-path}/internal/role/leader.go"
            - "${config-path}/internal/testutil/**"
            - "${config-path}/cmd/rokuban/**"
            - "!$test"
          deny:
            - pkg: github.com/fetburner/rokuban/internal/db/sqlcgen
              desc: generated database queries are limited to pgstore and the database foundation
        test-sqlcgen-boundary:
          # テストは状態を契約のメソッドか internal/db/dbtest で作る。sqlcgen を直接使わない。
          # 除外は DB 基盤そのものに限る。pgstore は store の実装、internal/db は生成クエリ・マイグレーション・dbtest、internal/testutil はテスト DB の準備。
          list-mode: lax
          files:
            - "$test"
            - "!${config-path}/internal/store/pgstore/**"
            - "!${config-path}/internal/db/**"
            - "!${config-path}/internal/testutil/**"
          deny:
            - pkg: github.com/fetburner/rokuban/internal/db/sqlcgen
              desc: tests build state through store contracts or internal/db/dbtest
        river-adapter-only:
          # River の型はテストも含め runtime adapter の境界に閉じ込める。
          # KEDA の SQL テストだけは YAML の状態名を River のスキーマと照合する。
          list-mode: lax
          files:
            - "${config-path}/**"
            - "!${config-path}/internal/jobq/riveradapter/**"
            - "!${config-path}/deploy/k8s/workloads_test.go"
          deny:
            - pkg: github.com/riverqueue/river
              desc: River imports are limited to internal/jobq/riveradapter
        riveradapter-import:
          # River adapter の直接 import は内部の本番コードで禁止する。
          # worker.go だけは River の公開登録 API が具体型を要求するため例外にする。
          # testutil はテスト DB の作成で riveradapter/migrate を使うため除外する。
          # cmd/ は構成の根として adapter を組み立てるので、そもそも対象にしない。
          list-mode: lax
          files:
            - "${config-path}/internal/**"
            - "!${config-path}/internal/jobq/riveradapter/**"
            - "!${config-path}/internal/worker/worker.go"
            - "!${config-path}/internal/testutil/**"
            - "!$test"
          deny:
            - pkg: github.com/fetburner/rokuban/internal/jobq/riveradapter
              desc: use the neutral jobq contracts; only cmd/ wires the River adapter
        riveradapter-allowlist:
          # adapter は契約（jobq）とエンジン（river / pgx）だけに依存する。製品の方針
          # （どのジョブを何分で）は jobq.WorkerSpec として cmd/rokuban から渡される。
          # 禁止リストで jobs / tsscan / config を塞ぐと他の製品パッケージへの依存が
          # 通るので、許可リストにする。テストは jobs の Args を fixture に使ってよい。
          list-mode: strict
          files:
            - "${config-path}/internal/jobq/riveradapter/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/fetburner/rokuban/internal/jobq
            - github.com/jackc/pgx
            - github.com/riverqueue/river
        notifier-db-source:
          # notifier の EventHub と SSE 配信は DB を知らない。DB への接続は Source の
          # 実装のサブパッケージに閉じ込める。テストは実 DB を使う統合テストを含むので対象外。
          list-mode: lax
          files:
            - "${config-path}/internal/notifier/**"
            - "!${config-path}/internal/notifier/pgsource/**"
            - "!$test"
          deny:
            - pkg: github.com/jackc/pgx
              desc: notifier reaches the database only through a Source subpackage
            - pkg: github.com/fetburner/rokuban/internal/db
              desc: notifier reaches the database only through a Source subpackage
            - pkg: database/sql
              desc: notifier reaches the database only through a Source subpackage
        exec-role:
          # os/exec は worker・cmdetect・encode・streamer と共用補助の mediaexec が実行に使う。
          # config は LookPath でツールの存在だけを検証する。テストの子プロセス起動は対象外。
          # conformance/harness は複数のテストパッケージが共有するため _test.go に置けないが、
          # conformance タグ付きでテストからしか使われない（docker / go build を起動する）。
          # scripts/citest は CI が go run で呼ぶ判定ツールで、go list だけを子プロセスで起動する。
          list-mode: lax
          files:
            - "!$test"
            - "!${config-path}/internal/mirakc/conformance/harness/**"
            - "!${config-path}/scripts/citest/**"
            - "!${config-path}/internal/worker/**"
            - "!${config-path}/internal/cmdetect/**"
            - "!${config-path}/internal/encode/**"
            - "!${config-path}/internal/streamer/**"
            - "!${config-path}/internal/mediaexec/*.go"
            - "!${config-path}/internal/config/**"
          deny:
            - pkg: os/exec
              desc: os/exec is limited to worker, cmdetect, encode, streamer, mediaexec, and config
        mediaexec-import-role:
          # 不変条件 4: os/exec の制限が実行補助の import で迂回されないよう、
          # 本番コードからの mediaexec の呼び出しを worker・cmdetect・thumbnail・encode・streamer に閉じ込める。
          list-mode: lax
          files:
            - "${config-path}/**"
            - "!${config-path}/internal/worker/**"
            - "!${config-path}/internal/cmdetect/**"
            - "!${config-path}/internal/encode/**"
            - "!${config-path}/internal/thumbnail/**"
            - "!${config-path}/internal/streamer/**"
            - "!$test"
          deny:
            - pkg: github.com/fetburner/rokuban/internal/mediaexec
              desc: mediaexec imports are limited to internal/worker, internal/cmdetect, internal/thumbnail, internal/encode, and internal/streamer
        cmdetect-worker-only:
          # 不変条件 4: cmdetect は os/exec と mediaexec を使う。
          # cmdetect の import で exec の制限が迂回されないよう、本番コードからの import を worker に閉じ込める。
          list-mode: lax
          files:
            - "${config-path}/**"
            - "!${config-path}/internal/worker/**"
            - "!${config-path}/internal/cmdetect/**"
            - "!$test"
          deny:
            - pkg: github.com/fetburner/rokuban/internal/cmdetect
              desc: cmdetect imports are limited to internal/worker and internal/cmdetect
        thumbnail-worker-only:
          # 不変条件 4: thumbnail は mediaexec を使う。
          # thumbnail の import で exec の制限が迂回されないよう、本番コードからの import を worker に閉じ込める。
          list-mode: lax
          files:
            - "${config-path}/**"
            - "!${config-path}/internal/worker/**"
            - "!${config-path}/internal/thumbnail/**"
            - "!$test"
          deny:
            - pkg: github.com/fetburner/rokuban/internal/thumbnail
              desc: thumbnail imports are limited to internal/worker and internal/thumbnail
        encode-worker-only:
          # 不変条件 4: encode は os/exec と mediaexec を使う。
          # encode の import で exec の制限が迂回されないよう、本番コードからの import を worker と cmd/rokuban に閉じ込める。
          # 起動時検査の呼び出し元は server.go の 1 か所で、ジョブ登録とは独立している。
          # 検査への依存を起動コードで明示するため、cmd/rokuban を除外に加える。
          # cmd/rokuban は移設前から worker を import し、worker.NewWorkers で encode ジョブを登録している。
          # cmd/rokuban からの os/exec の直接 import は引き続き exec-role が拒む。
          list-mode: lax
          files:
            - "${config-path}/**"
            - "!${config-path}/internal/worker/**"
            - "!${config-path}/internal/encode/**"
            - "!${config-path}/cmd/rokuban/**"
            - "!$test"
          deny:
            - pkg: github.com/fetburner/rokuban/internal/encode
              desc: encode imports are limited to internal/worker, internal/encode, and cmd/rokuban
        storagemaint-worker-only:
          # 不変条件 1: 転送と削除はファイルシステムを使う。
          # api が移設先を経由して依存しないよう、本番コードからの import を worker に閉じ込める。
          list-mode: lax
          files:
            - "${config-path}/**"
            - "!${config-path}/internal/worker/**"
            - "!${config-path}/internal/storagemaint/**"
            - "!$test"
          deny:
            - pkg: github.com/fetburner/rokuban/internal/storagemaint
              desc: storagemaint imports are limited to internal/worker and internal/storagemaint
        ingest-worker-only:
          # 不変条件 1: ingest は mirakc と FS に依存する。api がそれに依存しないよう、本番コードからの import を worker と cmd/rokuban に閉じ込める。depguard は直接の import しか見ないので、api-role の internal/worker の禁止は ingest を覆わない（ingest を直接 import されても止めるのはこの規則）。
          # 置き場の検査（ProbeIngestStorage）を起動コードで呼ぶため、cmd/rokuban を除外に加える（encode-worker-only と同じ）。
          list-mode: lax
          files:
            - "${config-path}/**"
            - "!${config-path}/internal/worker/**"
            - "!${config-path}/internal/ingest/**"
            - "!${config-path}/cmd/rokuban/**"
            - "!$test"
          deny:
            - pkg: github.com/fetburner/rokuban/internal/ingest
              desc: ingest imports are limited to internal/worker, internal/ingest, and cmd/rokuban
        worker-tsstat:
          # 不変条件 6: ingest は TS を読まず、TS の読者は解析ジョブへ閉じ込める。
          list-mode: lax
          files:
            - "${config-path}/internal/worker/**"
            - "${config-path}/internal/cmdetect/**"
            - "${config-path}/internal/thumbnail/**"
            - "${config-path}/internal/encode/**"
            - "${config-path}/internal/storagemaint/**"
            - "${config-path}/internal/ingest/**"
            - "!$test"
          deny:
            - pkg: github.com/fetburner/rokuban/internal/tsstat
              desc: ingest and other workers must not inspect transport streams (invariant 6)
        ts-inspection:
          # 不変条件 6: 放送 TS を読むのは internal/tsstat を使う解析ジョブだけ。
          # テストは TS のフィクスチャを組み立てるのに gots を使うので対象外。
          list-mode: lax
          files:
            - "!$test"
            - "!${config-path}/internal/tsstat/**"
          deny:
            - pkg: github.com/Comcast/gots
              desc: transport-stream parsing is limited to internal/tsstat (invariant 6)
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    funlen:
      lines: 150
      statements: -1
    gocognit:
      # whole-files: true は触れたファイルの既存関数まで検査するので、閾値が
      # 既存の最大値を下回ると無関係な PR が落ちる。既存の関数を全部直す義務は
      # 作らず、lint が見る既定ビルド（テスト・生成物を除く）の現在の最大値を
      # 閾値にして「今より悪くしない」天井だけを守る。gocognit は閾値を超えた
      # 関数だけを報告する。build tag のファイルも lint に入る（上の run.build-tags）ので、
      # その中で閾値を超える関数は `//nolint:gocognit` と理由で個別に外す。閾値は上げない。
      min-complexity: 54

  exclusions:
    # docs:lint のためにリポジトリ直下へ入る node_modules に Go のパッケージ
    # （flatted）が同梱されていて、./... がそれを拾う。
    paths:
      - "(^|/)node_modules/"
    rules:
      - path: "_test\\.go$"
        linters:
          - gocognit

issues:
  # 明示的に --new-from-rev 等で差分 lint する実行向け。
  # funlen は issue 位置を func 宣言行に付けるため、本体だけの変更も検出できるよう
  # 変更ファイル全体を対象にする。
  whole-files: true

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/fetburner/rokuban
