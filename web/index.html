<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- SVG を優先し、対応しないブラウザ（Safari 16 未満など）は .ico に落ちる -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <!-- PWA は入れないが、iOS の「ホーム画面に追加」はマニフェストなしでも使われる -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover がないと env(safe-area-inset-*) が 0 になり、
         ボトムタブが iOS のホームインジケータと重なる -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- JS 起動後は各ルートの head（routes.tsx）が画面名付きの録番の
         タイトルに書き換える。ここは JS 読み込み中だけ見える既定値なので、
         UI 本体の表記（サイドバー/ボトムタブの「録番」）に揃える。 -->
    <title>録番</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
