# CI スモークテスト用。docker compose -f docker-compose.test.yml up --wait で
# 全サービスの healthcheck が通り、かつ catalog_export が media volume へ
# 書けていれば成功（healthz はジョブが落ちても通るため後者を別に見る）。
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: rokuban
      POSTGRES_PASSWORD: rokuban
      POSTGRES_DB: rokuban
    healthcheck:
      # 公式イメージは initdb 中、CREATE DATABASE のために
      # listen_addresses='' の一時サーバーを Unix socket だけで起動する。
      # ホストを指定して TCP とアプリ DB を検査しないと、その一時サーバーを
      # healthy と誤認し、本サーバーの再起動中に migrate が 57P03 で落ちる。
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rokuban -d rokuban"]
      start_period: 10s
      interval: 2s
      timeout: 3s
      retries: 10

  migrate:
    image: rokuban:test
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config.ci.yml:/config.yml:ro
    command: ["migrate", "up", "--config", "/config.yml"]

  rokuban:
    # server --all は worker ロールを含み ffmpeg/ffprobe を要求するため、
    # ffmpeg 入りの Dockerfile.full イメージで起動する。
    image: rokuban:test-full
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "40773:40773"
    volumes:
      - ./config.ci.yml:/config.yml:ro
      # storage.media_dir をフレッシュな named volume にする。起動直後に
      # RunOnStart で走る catalog_export が、実バイナリとして nobody で
      # ここへ os.MkdirAll + os.Create する（CI の
      # "catalog_export wrote to the media volume" ステップが検証する）。
      # healthz はジョブが落ちても通るので、ジョブ状態の明示アサートが要る。
      - media:/mnt/media
    command: ["server", "--all", "--config", "/config.yml"]
    # 本番の docker-compose.yml と同じ判断（停止予算を包む猶予）。テスト用なので
    # 短くてよいが、書かないと teardown のたびに実行中のジョブが SIGKILL され、
    # River の行が一時的に running のまま残る（ingest / encode は次の定期 recovery が
    # lock 解放後に回収する。docs/operations.md §5「Deployment 併用時」）。
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:40773/healthz"]
      start_period: 5s
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  media:
